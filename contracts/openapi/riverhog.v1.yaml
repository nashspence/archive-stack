      properties:
        path: { type: string }
        protocol:
          type: string
          const: tus
        upload_url:
          type: string
          format: uri
        offset:
          type: integer
          description: Current accepted byte offset in the logical file's upload stream.
        length:
          type: integer
          description: Total logical-file byte length for the upload stream.
        checksum_algorithm:
          type: string
          const: sha256
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    FinalizedImageSummary:
      type: object
      required:
        [
          id,
          filename,
          finalized_at,
          bytes,
          target_bytes,
          fill,
          files,
          collections,
          collection_ids,
          iso_ready,
          disc_redundancy_state,
          discs_required,
          discs_registered,
          discs_verified,
          discs_missing,
        ]
      properties:
        id:
          type: string
          pattern: "^[0-9]{8}T[0-9]{6}Z$"
          description: Canonical finalized image id and immutable media identifier.
        filename:
          type: string
          description: Stable ISO filename for the finalized image artifact.
        finalized_at:
          type: string
          format: date-time
          description: Expanded UTC timestamp encoded by the finalized image id.
        bytes: { type: integer }
        target_bytes:
          type: integer
          description: Target media capacity used when this image was finalized.
        fill: { type: number }
        files: { type: integer }
        collections:
          type: integer
          description: Count of collection ids represented by the finalized image.
        collection_ids:
          type: array
          items: { type: string }
          description: Lexically sorted contained collection ids.
        iso_ready:
          type: boolean
          const: true
          description: Finalized images are always ISO-ready.
        disc_redundancy_state:
          $ref: "#/components/schemas/CoverageState"
        discs_required:
          type: integer
          minimum: 1
        discs_registered:
          type: integer
          minimum: 0
        discs_verified:
          type: integer
          minimum: 0
        discs_missing:
          type: integer
          minimum: 0
    FinalizedImageListResponse:
      type: object
      required: [page, per_page, total, pages, sort, order, images]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        sort:
          type: string
          enum: [finalized_at, bytes, discs_registered]
        order:
          type: string
          enum: [asc, desc]
        images:
          type: array
          items:
            $ref: "#/components/schemas/FinalizedImageSummary"
    CollectionCoverageImage:
      type: object
      required:
        [
          id,
          filename,
          disc_redundancy_state,
          discs_required,
          discs_registered,
          discs_verified,
          discs_missing,
          covered_paths,
          discs,
        ]
      properties:
        id:
          type: string
          pattern: "^[0-9]{8}T[0-9]{6}Z$"
        filename:
          type: string
        disc_redundancy_state:
          $ref: "#/components/schemas/CoverageState"
        discs_required:
          type: integer
          minimum: 1
        discs_registered:
          type: integer
          minimum: 0
        discs_verified:
          type: integer
          minimum: 0
        discs_missing:
          type: integer
          minimum: 0
        covered_paths:
          type: array
          items:
            type: string
          description: Relative collection paths within this collection that the finalized image represents.
        covered_paths_total:
          type: integer
          minimum: 0
          description: Total covered path count before any `coverage_path_limit` truncation.
        discs:
          type: array
          items:
            $ref: "#/components/schemas/DiscSummary"
    DiscSummary:
      type: object
      required:
        [
          disc_id,
          label_text,
          location,
          created_at,
          state,
          verification_state,
          history,
          image_id,
        ]
      properties:
        disc_id:
          type: string
          description: Generated disc id, unique within one finalized image.
        label_text:
          type: string
          description: Exact operator-facing disc label text for this generated disc slot.
        location:
          type: string
          nullable: true
          description: Mutable physical location label. Not part of disc identity.
        created_at: { type: string, format: date-time }
        state:
          type: string
          enum: [needed, burning, verified, registered, lost, damaged, retired]
        verification_state:
          type: string
          enum: [pending, verified, failed]
        history:
          type: array
          items:
            $ref: "#/components/schemas/DiscHistory"
        image_id:
          type: string
          pattern: "^[0-9]{8}T[0-9]{6}Z$"
          description: Finalized image id for this disc.
        filename:
          type: string
          nullable: true
          description: Stable ISO filename for the finalized image artifact.
