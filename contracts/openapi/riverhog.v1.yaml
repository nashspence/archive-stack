openapi: 3.1.0
info:
  title: RIVERHOG API
  version: 1.0.0
  summary: MVP API for hot/cold archival storage
  description: Authoritative archive resources are durable across service restarts unless a specific contract explicitly expires or releases them.
servers:
  - url: /v1
paths:
  /collection-uploads:
    post:
      summary: Create or resume one collection upload session
      description: Creates or resumes a collection upload session from a human-readable slug and expected logical file set. Riverhog normalizes the slug, mints the canonical collection id with either the server UTC upload timestamp or an optional caller-provided UTC timestamp, and resumes an existing non-finalized session when the normalized slug and manifest match.
      operationId: createOrResumeCollectionUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUploadRequest"
      responses:
        "200":
          description: Collection upload session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionUploadSession"
        default:
          $ref: "#/components/responses/Error"
  /collection-upload-sessions:
    post:
      summary: Create or resume one incremental collection upload session
      description: Creates or resumes an open collection upload session from a human-readable slug without requiring a complete file manifest up front. Files are registered one at a time, uploaded through the normal collection-file upload resource, then frozen by an explicit complete call.
      operationId: createOrResumeCollectionUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrResumeCollectionUploadSessionRequest"
      responses:
        "200":
          description: Collection upload session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionUploadSession"
        default:
          $ref: "#/components/responses/Error"
  /collection-upload-sessions/{collection_id}/files:
    post:
      summary: Register one file in an incremental collection upload session
      description: Adds one logical file metadata entry to an open incremental upload session. Re-registering the same path with identical metadata is idempotent; conflicting metadata is rejected. The response is scoped to the registered file; callers use the collection status endpoint for whole-session progress.
      operationId: registerCollectionUploadSessionFile
      parameters:
        - in: path
          name: collection_id
          required: true
          description: Server-minted canonical collection id returned by incremental session creation. Slash-bearing ids occupy multiple path segments.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCollectionUploadSessionFileRequest"
      responses:
        "200":
          description: Registered file state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionUploadSessionFileRegistration"
        default:
          $ref: "#/components/responses/Error"
  /collection-upload-sessions/{collection_id}/files/upload:
    post:
      summary: Register one file and create or resume its upload resource
      description: Adds one logical file metadata entry to an open incremental upload session, then creates or resumes that file's Riverhog-managed tus-compatible upload resource. Re-registering the same path with identical metadata is idempotent; conflicting metadata is rejected.
      operationId: createOrResumeRegisteredCollectionFileUpload
      parameters:
        - in: path
          name: collection_id
          required: true
          description: Server-minted canonical collection id returned by incremental session creation. Slash-bearing ids occupy multiple path segments.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCollectionUploadSessionFileRequest"
      responses:
        "200":
          description: Registered file upload session
          headers:
            Tus-Resumable:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            Upload-Offset:
              schema: { type: integer, minimum: 0 }
            Upload-Length:
              schema: { type: integer, minimum: 0 }
            Upload-Expires:
              schema: { type: string, format: date-time }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionUploadSessionFileUpload"
        default:
          $ref: "#/components/responses/Error"
  /collection-upload-sessions/{collection_id}/complete:
    post:
      summary: Complete one incremental collection upload session
      description: Freezes the registered file set for one open incremental upload session. Completion requires at least one registered file and all registered bytes uploaded and verified, then hands the collection to the existing archive finalization pipeline.
      operationId: completeCollectionUploadSession
      parameters:
        - in: path
          name: collection_id
          required: true
          description: Server-minted canonical collection id returned by incremental session creation. Slash-bearing ids occupy multiple path segments.
          schema: { type: string }
      responses:
        "200":
          description: Collection upload session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionUploadSession"
        default:
          $ref: "#/components/responses/Error"
  /collection-upload-sessions/{collection_id}/cancel:
    post:
      summary: Cancel one incremental collection upload session
      description: Cancels an open incremental upload session, deletes staged upload bytes, and leaves a closed audit state. Sessions cannot be canceled after the archival handoff begins.
      operationId: cancelCollectionUploadSession
      parameters:
        - in: path
          name: collection_id
          required: true
          description: Server-minted canonical collection id returned by incremental session creation. Slash-bearing ids occupy multiple path segments.
          schema: { type: string }
      responses:
        "200":
          description: Collection upload session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionUploadSession"
        default:
          $ref: "#/components/responses/Error"
  /collection-uploads/{collection_id}:
    get:
      summary: Get one collection upload session
      description: Returns the current resumable upload state for one server-minted collection id while it remains in progress. The session remains visible through `uploading`, `archiving`, and `failed`; once the collection archive package has uploaded, verified, promoted the collection, and committed the collection/archive records, this upload session is deleted and later reads return `not_found`.
      operationId: getCollectionUpload
      parameters:
        - in: path
          name: collection_id
          required: true
          description: Server-minted canonical collection id returned by collection upload creation. Slash-bearing ids occupy multiple path segments.
          schema: { type: string }
      responses:
        "200":
          description: Collection upload session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionUploadSession"
        default:
          $ref: "#/components/responses/Error"
  /collection-uploads/{collection_id}/files/{path}/upload:
    post:
      summary: Create or resume one collection-file upload resource
      description: Creates or resumes one Riverhog-managed tusd upload resource for one logical collection file and returns its direct tusd URL. Riverhog does not proxy collection upload bytes; clients send TUS requests to the returned `upload_url`.
      operationId: createOrResumeCollectionFileUpload
      parameters:
        - in: path
          name: collection_id
          required: true
          description: Server-minted canonical collection id returned by collection upload creation. Slash-bearing ids occupy multiple path segments.
          schema: { type: string }
        - in: path
          name: path
          required: true
          description: Relative logical file path within the collection.
          schema: { type: string }
      responses:
        "200":
          description: Collection-file upload session
          headers:
            Tus-Resumable:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            Upload-Offset:
              schema: { type: integer, minimum: 0 }
            Upload-Length:
              schema: { type: integer, minimum: 0 }
            Upload-Expires:
              schema: { type: string, format: date-time }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionFileUploadSession"
        default:
          $ref: "#/components/responses/Error"
  /search:
    get:
      summary: Search collection file targets
      operationId: search
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [target, collection, path, bytes, hot, archived]
            default: target
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - in: query
          name: collection
          required: false
          schema: { type: string }
        - in: query
          name: hot
          required: false
          schema:
            oneOf:
              - type: boolean
              - type: "null"
        - in: query
          name: archived
          required: false
          schema:
            oneOf:
              - type: boolean
              - type: "null"
      responses:
        "200":
          description: File search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        default:
          $ref: "#/components/responses/Error"
  /files:
    get:
      summary: Query files matching a target selector
      description: Returns one page of files whose projected path matches the given target selector with their full state. Returns an empty list when no files match; never 404.
      operationId: queryFiles
      parameters:
        - in: query
          name: target
          required: true
          schema: { type: string }
          description: Canonical projected-path selector. File selectors return exactly matching files; directory selectors (ending with `/`) return all files under that prefix.
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Files matching the target selector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesResponse"
        default:
          $ref: "#/components/responses/Error"
  /files/{target}/content:
    get:
      summary: Download raw bytes for a hot file
      description: Serves the raw bytes of the currently hot version of a file identified by its projected-path target. Returns 404 when the file is not hot or does not exist.
      operationId: getFileContent
      parameters:
        - in: path
          name: target
          required: true
          description: Canonical file target (not a directory selector). Slash-bearing targets occupy multiple path segments.
          schema: { type: string }
      responses:
        "200":
          description: Raw file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /collections:
    get:
      summary: List collection summaries
      description: Returns one page of collection summaries with optional substring and protection-state filtering.
      operationId: listCollections
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: q
          required: false
          description: Case-insensitive substring filter over canonical collection ids.
          schema: { type: string }
        - in: query
          name: sort
          required: false
          schema: { type: string, default: id }
        - in: query
          name: order
          required: false
          schema: { type: string, default: asc }
        - in: query
          name: protection_state
          required: false
          description: Exact collection protection filter.
          schema:
            type: string
            enum: [under_protected, cloud_only, physical_only, fully_protected]
      responses:
        "200":
          description: Collection summary listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionListResponse"
        default:
          $ref: "#/components/responses/Error"
  /collections/{collection_id}:
    get:
      summary: Get one collection summary
      operationId: getCollection
      parameters:
        - in: path
          name: collection_id
          required: true
          description: Canonical collection id. Slash-bearing ids occupy multiple path segments under `/collections/`.
          schema: { type: string }
        - in: query
          name: coverage_path_limit
          required: false
          description: Maximum covered paths to return per image. Defaults to a bounded operator preview.
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 100
      responses:
        "200":
          description: Collection summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionSummary"
        default:
          $ref: "#/components/responses/Error"
  /plan:
    get:
      summary: Get current burn plan
      description: Returns provisional planner output only. Finalized images do not appear in this plan.
      operationId: getPlan
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [fill, bytes, files, collections, candidate_id]
            default: fill
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: q
          required: false
          schema: { type: string }
        - in: query
          name: collection
          required: false
          schema: { type: string }
        - in: query
          name: iso_ready
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Planner output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
  /discs:
    get:
      summary: List burned disc records
      description: Returns one page of generated disc/copy records with sorting and filtering over operator-facing disc metadata.
      operationId: listDiscs
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [id, image_id, state, verification_state, location]
            default: id
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - in: query
          name: q
          required: false
          schema: { type: string }
        - in: query
          name: image_id
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Disc list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscListResponse"
        default:
          $ref: "#/components/responses/Error"
  /discs/{copy_id}:
    get:
      summary: Get one burned disc record
      description: Returns one generated disc/copy record by copy id, including copy history.
      operationId: getDisc
      parameters:
        - in: path
          name: copy_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Disc record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscSummary"
        default:
          $ref: "#/components/responses/Error"
  /images:
    get:
      summary: List finalized images
      description: Returns finalized images only, with conventional pagination, sorting, and filtering over finalized-image metadata.
      operationId: listImages
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [finalized_at, bytes, physical_copies_registered]
            default: finalized_at
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: q
          required: false
          schema: { type: string }
        - in: query
          name: collection
          required: false
          schema: { type: string }
        - in: query
          name: has_copies
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Finalized image list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizedImageListResponse"
        default:
          $ref: "#/components/responses/Error"
  /images/{image_id}:
    get:
      summary: Get one image summary
      description: Returns one finalized image summary. `image_id` is the compact UTC finalized id and media identifier.
      operationId: getImage
      parameters:
        - in: path
          name: image_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Image summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizedImageSummary"
        default:
          $ref: "#/components/responses/Error"
  /images/{image_id}/rebuild-session:
    get:
      summary: Get the latest image rebuild session for one image
      description: Returns the latest `image_rebuild` recovery session for one finalized image, including expired or completed sessions.
      operationId: getImageRebuildSession
      parameters:
        - in: path
          name: image_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recovery session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySession"
        default:
          $ref: "#/components/responses/Error"
  /recovery-sessions:
    get:
      summary: List recovery sessions
      description: Returns a paged inventory of Glacier-backed cloud-fetch and image rebuild sessions, with filters for type, state, collection, and image.
      operationId: listRecoverySessions
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum:
              [created_at, id, type, state, restore_ready_at, restore_expires_at]
            default: created_at
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: type
          required: false
          schema:
            oneOf:
              - type: string
                enum: [collection_restore, image_rebuild]
              - type: "null"
        - in: query
          name: state
          required: false
          schema:
            oneOf:
              - type: string
                enum: [restore_requested, ready, paused, expired, completed, failed, canceled]
              - type: "null"
        - in: query
          name: collection
          required: false
          schema:
            oneOf:
              - type: string
              - type: "null"
        - in: query
          name: image
          required: false
          schema:
            oneOf:
              - type: string
              - type: "null"
      responses:
        "200":
          description: Paged recovery session inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySessionList"
        default:
          $ref: "#/components/responses/Error"
  /recovery-sessions/{session_id}:
    get:
      summary: Get one recovery session
      description: Returns one Glacier-backed cloud-fetch or image rebuild session by durable session id.
      operationId: getRecoverySession
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recovery session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySession"
        default:
          $ref: "#/components/responses/Error"
  /recovery-sessions/{session_id}/complete:
    post:
      summary: Complete one ready recovery session
      description: Marks one ready recovery session complete and records cleanup or lifecycle handoff for restored Standard-storage data.
      operationId: completeRecoverySession
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Completed recovery session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySession"
        default:
          $ref: "#/components/responses/Error"
  /recovery-sessions/{session_id}/cancel:
    post:
      summary: Cancel one active cloud-fetch recovery session
      description: Cancels one active fetch-scoped cloud-fetch recovery session by durable session id and stops automatic materialization. Image rebuild sessions are paused and resumed instead of canceled.
      operationId: cancelRecoverySession
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canceled recovery session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySession"
        default:
          $ref: "#/components/responses/Error"
  /recovery-sessions/{session_id}/pause:
    post:
      summary: Pause one active image rebuild session
      description: Pauses one active `image_rebuild` recovery session and schedules daily operator reminders until it is resumed.
      operationId: pauseRecoverySession
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Paused recovery session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySession"
        default:
          $ref: "#/components/responses/Error"
  /recovery-sessions/{session_id}/resume:
    post:
      summary: Resume one paused image rebuild session
      description: Resumes one paused `image_rebuild` recovery session from its previous restore state.
      operationId: resumeRecoverySession
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resumed recovery session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySession"
        default:
          $ref: "#/components/responses/Error"
  /recovery-sessions/{session_id}/images/{image_id}/iso:
    get:
      summary: Download one rebuilt recovery-session ISO
      description: Streams rebuilt ISO bytes for one image in a ready `image_rebuild` recovery session.
      operationId: getRecoveredIso
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
        - in: path
          name: image_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rebuilt ISO bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /glacier:
    get:
      summary: Get Glacier usage reporting
      description: Returns Glacier usage totals, direct per-collection archive state, collection manifest/OTS proof state, image contribution metadata, and overall usage snapshots.
      operationId: getGlacierReport
      parameters:
        - in: query
          name: collection
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Glacier usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlacierUsageReport"
        default:
          $ref: "#/components/responses/Error"
  /plan/candidates/{candidate_id}/finalize:
    post:
      summary: Explicitly finalize one provisional candidate
      description: Finalization is the only operation that creates a finalized image id, and the resulting finalized image remains addressable across service restarts.
      operationId: finalizeImage
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Image finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizedImageSummary"
        default:
          $ref: "#/components/responses/Error"
  /images/{image_id}/iso:
    get:
      summary: Download ISO bytes for an image
      description: Downloads ISO bytes for an already finalized image. This endpoint is retrieval-only and does not finalize a provisional candidate.
      operationId: getImageIso
      parameters:
        - in: path
          name: image_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ISO stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /images/{image_id}/copies:
    get:
      summary: List generated copy slots for an image
      description: Returns the generated copy slots for one finalized image identified by `image_id`.
      operationId: listCopies
      parameters:
        - in: path
          name: image_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Copy listing
          content:
            application/json:
              schema:
                type: object
                required: [copies]
                properties:
                  copies:
                    type: array
                    items:
                      $ref: "#/components/schemas/CopySummary"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Register a physical burned copy
      description: Registers one durable burned-disc record for an already finalized image identified by `image_id`.
      operationId: createCopy
      parameters:
        - in: path
          name: image_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                copy_id:
                  type: string
                  description: Optional generated copy id to claim explicitly for this finalized image.
                location:
                  type: string
                  description: Mutable operator-supplied physical location label. Not part of the copy identity.
      responses:
        "200":
          description: Copy registered
          content:
            application/json:
              schema:
                type: object
                required: [copy]
                properties:
                  copy:
                    $ref: "#/components/schemas/CopySummary"
        default:
          $ref: "#/components/responses/Error"
  /images/{image_id}/copies/{copy_id}:
    patch:
      summary: Update one generated copy record
      description: Updates mutable operational metadata for one generated copy slot on a finalized image.
      operationId: updateCopy
      parameters:
        - in: path
          name: image_id
          required: true
          schema: { type: string }
        - in: path
          name: copy_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                location:
                  type: string
                  nullable: true
                  description: Updated physical location label. Not part of copy identity.
                state:
                  type: string
                  nullable: true
                  enum: [needed, burning, verified, registered, lost, damaged, retired]
                verification_state:
                  type: string
                  nullable: true
                  enum: [pending, verified, failed]
      responses:
        "200":
          description: Updated copy record
          content:
            application/json:
              schema:
                type: object
                required: [copy]
                properties:
                  copy:
                    $ref: "#/components/schemas/CopySummary"
        default:
          $ref: "#/components/responses/Error"
  /images/{image_id}/copies/{copy_id}/label-needed:
    post:
      summary: Notify that a copy needs labeling
      description: Sends the best-effort operator notification that a burned and verified copy needs its physical label applied.
      operationId: notifyCopyLabelNeeded
      parameters:
        - in: path
          name: image_id
          required: true
          schema: { type: string }
        - in: path
          name: copy_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current copy record
          content:
            application/json:
              schema:
                type: object
                required: [copy]
                properties:
                  copy:
                    $ref: "#/components/schemas/CopySummary"
        default:
          $ref: "#/components/responses/Error"
  /pin:
    post:
      summary: Pin a target into hot storage
      description: Creates or reuses one exact pin that remains active until release, including across service restarts.
      operationId: pinTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  $ref: "#/components/schemas/Target"
      responses:
        "200":
          description: Pin result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResponse"
        default:
          $ref: "#/components/responses/Error"
  /release:
    post:
      summary: Release an exact pin target
      operationId: releaseTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  $ref: "#/components/schemas/Target"
      responses:
        "200":
          description: Release result
          content:
            application/json:
              schema:
                type: object
                required: [target, pin]
                properties:
                  target:
                    $ref: "#/components/schemas/Target"
                  pin:
                    type: boolean
                    const: false
        default:
          $ref: "#/components/responses/Error"
  /pins:
    get:
      summary: List active pins
      description: Lists durable exact pins that remain active until release.
      operationId: listPins
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Active pins
          content:
            application/json:
              schema:
                type: object
                required: [page, per_page, total, pages, pins]
                properties:
                  page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
                  pages: { type: integer }
                  pins:
                    type: array
                    items:
                      $ref: "#/components/schemas/PinSummary"
  /fetches/{fetch_id}:
    get:
      summary: Get fetch summary
      description: Returns one durable pin-scoped fetch summary while the exact pin remains active.
      operationId: getFetch
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Fetch summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchSummary"
        default:
          $ref: "#/components/responses/Error"
  /fetches/{fetch_id}/cloud-fetch:
    get:
      summary: Get cloud-fetch recovery sessions
      description: Returns collection-native recovery sessions that are making this hot-storage fetch available from cloud archive.
      operationId: getCloudFetchSessions
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [created_at, id, type, state, restore_ready_at, restore_expires_at]
            default: created_at
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum: [restore_requested, ready, paused, expired, completed, failed, canceled]
      responses:
        "200":
          description: Cloud-fetch recovery sessions for this fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudFetchSessions"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Start or resume cloud-fetch recovery
      description: Creates or resumes collection-native recovery sessions for missing files in this hot-storage fetch. While active, normal optical-media fetch reminders and upload operations are suppressed for the same fetch.
      operationId: createOrResumeCloudFetch
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cloud-fetch recovery sessions for this fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudFetchSessions"
        default:
          $ref: "#/components/responses/Error"
  /fetches/{fetch_id}/cloud-fetch/cancel:
    post:
      summary: Cancel active cloud-fetch recovery
      description: Cancels active collection-native cloud-fetch recovery sessions for this hot-storage fetch.
      operationId: cancelCloudFetch
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cloud-fetch recovery sessions for this fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudFetchSessions"
        default:
          $ref: "#/components/responses/Error"
  /fetches/{fetch_id}/status:
    get:
      summary: Get lightweight fetch status
      description: Returns one durable pin-scoped fetch summary plus a bounded list of pending, partial, or byte-complete entry statuses for human operator display. This endpoint does not include recovery copy hints and does not backfill finalized-image recovery metadata; use the fetch manifest for automated recovery.
      operationId: getFetchStatus
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 25
            minimum: 0
            maximum: 100
      responses:
        "200":
          description: Lightweight fetch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchStatus"
        default:
          $ref: "#/components/responses/Error"
  /fetches/{fetch_id}/manifest:
    get:
      summary: Get fetch manifest
      description: Returns the stable fetch manifest and any unexpired upload progress for one active exact pin. Copy recovery lengths come from registered disc-copy metadata, and missing recovery digests are backfilled from the finalized image root before the manifest is returned, so archived-only files do not need hot plaintext to publish a manifest.
      operationId: getFetchManifest
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Fetch manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchManifest"
        default:
          $ref: "#/components/responses/Error"
  /fetches/{fetch_id}/entries/{entry_id}/upload:
    post:
      summary: Create or resume one fetch-entry upload resource
      description: Creates or resumes one restart-safe Riverhog-managed tus-compatible upload resource for the fetch entry until the published expiry time discards incomplete state.
      operationId: createOrResumeFetchEntryUpload
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
        - in: path
          name: entry_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Upload resource ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchUploadSession"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Append bytes to one fetch-entry upload resource
      description: Appends one chunk to an existing Riverhog-managed fetch-entry upload resource using tus-compatible checksum and offset headers.
      operationId: appendFetchEntryUploadChunk
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
        - in: path
          name: entry_id
          required: true
          schema: { type: string }
        - in: header
          name: Tus-Resumable
          required: true
          schema: { type: string, enum: ["1.0.0"] }
        - in: header
          name: Upload-Offset
          required: true
          schema: { type: integer, minimum: 0 }
        - in: header
          name: Upload-Checksum
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Chunk accepted
          headers:
            Tus-Resumable:
              schema: { type: string, enum: ["1.0.0"] }
            Upload-Offset:
              schema: { type: integer, minimum: 0 }
            Upload-Length:
              schema: { type: integer, minimum: 0 }
            Upload-Expires:
              schema: { type: string, format: date-time }
            Location:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"
    head:
      summary: Read one fetch-entry upload resource state
      description: Returns the current tus-style offset and metadata for one existing Riverhog-managed fetch-entry upload resource. Returns `not_found` once the upload resource no longer exists.
      operationId: headFetchEntryUpload
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
        - in: path
          name: entry_id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Upload resource state
          headers:
            Tus-Resumable:
              schema: { type: string, enum: ["1.0.0"] }
            Upload-Offset:
              schema: { type: integer, minimum: 0 }
            Upload-Length:
              schema: { type: integer, minimum: 0 }
            Upload-Expires:
              schema: { type: string, format: date-time }
            Location:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Cancel one fetch-entry upload resource
      description: Cancels one existing Riverhog-managed fetch-entry upload resource, deletes any incomplete server-side bytes for that entry, and resets that entry back to `pending`.
      operationId: deleteFetchEntryUpload
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
        - in: path
          name: entry_id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Upload resource canceled
          headers:
            Tus-Resumable:
              schema: { type: string, enum: ["1.0.0"] }
        default:
          $ref: "#/components/responses/Error"
    options:
      summary: Describe fetch-entry upload resource capabilities
      description: Returns the tus-compatible capability headers Riverhog supports for fetch-entry upload resources.
      operationId: optionsFetchEntryUpload
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
        - in: path
          name: entry_id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Upload resource capabilities
          headers:
            Tus-Resumable:
              schema: { type: string, enum: ["1.0.0"] }
            Tus-Version:
              schema: { type: string, enum: ["1.0.0"] }
            Tus-Extension:
              schema: { type: string }
            Tus-Checksum-Algorithm:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"
  /fetches/{fetch_id}/complete:
    post:
      summary: Complete a fetch
      operationId: completeFetch
      parameters:
        - in: path
          name: fetch_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Fetch completed
          content:
            application/json:
              schema:
                type: object
                required: [id, state, hot]
                properties:
                  id: { type: string }
                  state:
                    $ref: "#/components/schemas/FetchState"
                  hot:
                    $ref: "#/components/schemas/HotStatus"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Target:
      type: string
      description: Canonical projected-path selector relative to the hot-view root. Directory selectors end with `/` and file selectors do not.
    FetchState:
      type: string
      enum: [waiting_media, uploading, verifying, done, failed]
    FetchEntryUploadState:
      type: string
      enum: [pending, partial, byte_complete, uploaded]
    PhysicalProtectionState:
      type: string
      enum: [unprotected, partially_protected, protected]
    CollectionProtectionState:
      type: string
      enum: [under_protected, cloud_only, physical_only, fully_protected]
    CoverageState:
      type: string
      enum: [none, partial, full]
    GlacierArchive:
      type: object
      required:
        [state, object_path, stored_bytes, backend, storage_class, last_uploaded_at, last_verified_at, failure]
      properties:
        state:
          type: string
          enum: [pending, uploading, uploaded, retrying, failed]
        object_path:
          oneOf:
            - type: string
            - type: "null"
        stored_bytes:
          oneOf:
            - type: integer
            - type: "null"
        backend:
          oneOf:
            - type: string
            - type: "null"
        storage_class:
          oneOf:
            - type: string
            - type: "null"
        last_uploaded_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        last_verified_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        failure:
          oneOf:
            - type: string
            - type: "null"
    CollectionManifestProofState:
      type: string
      enum: [pending, uploaded, failed]
    CollectionManifest:
      type: object
      required: [object_path, sha256, ots_object_path, ots_state]
      properties:
        object_path:
          oneOf:
            - type: string
            - type: "null"
        sha256:
          oneOf:
            - type: string
              pattern: "^[0-9a-f]{64}$"
            - type: "null"
        ots_object_path:
          oneOf:
            - type: string
            - type: "null"
        ots_state:
          $ref: "#/components/schemas/CollectionManifestProofState"
    GlacierUsageTotals:
      type: object
      required:
        [collections, uploaded_collections, measured_storage_bytes]
      properties:
        collections:
          type: integer
          minimum: 0
        uploaded_collections:
          type: integer
          minimum: 0
        measured_storage_bytes:
          type: integer
          minimum: 0
    GlacierUsageImage:
      type: object
      required:
        [
          id,
          filename,
          collection_ids,
        ]
      properties:
        id:
          type: string
          pattern: "^[0-9]{8}T[0-9]{6}Z$"
        filename: { type: string }
        collection_ids:
          type: array
          items: { type: string }
    GlacierCollectionContribution:
      type: object
      required:
        [
          image_id,
          filename,
          represented_bytes,
        ]
      properties:
        image_id:
          type: string
          pattern: "^[0-9]{8}T[0-9]{6}Z$"
        filename: { type: string }
        represented_bytes:
          type: integer
          minimum: 0
    GlacierUsageCollection:
      type: object
      required:
        [
          id,
          bytes,
          glacier,
          collection_manifest,
          archive_format,
          compression,
          measured_storage_bytes,
          images,
        ]
      properties:
        id: { type: string }
        bytes:
          type: integer
          minimum: 0
        glacier:
          $ref: "#/components/schemas/GlacierArchive"
        collection_manifest:
          oneOf:
            - $ref: "#/components/schemas/CollectionManifest"
            - type: "null"
        archive_format:
          oneOf:
            - type: string
            - type: "null"
        compression:
          oneOf:
            - type: string
            - type: "null"
        measured_storage_bytes:
          type: integer
          minimum: 0
        images:
          type: array
          items:
            $ref: "#/components/schemas/GlacierCollectionContribution"
    GlacierUsageSnapshot:
      type: object
      required:
        [captured_at, uploaded_collections, measured_storage_bytes]
      properties:
        captured_at:
          type: string
          format: date-time
        uploaded_collections:
          type: integer
          minimum: 0
        measured_storage_bytes:
          type: integer
          minimum: 0
    GlacierUsageReport:
      type: object
      required:
        [scope, measured_at, totals, images, collections, history]
      properties:
        scope:
          type: string
          enum: [all, image, collection, filtered]
        measured_at:
          type: string
          format: date-time
        totals:
          $ref: "#/components/schemas/GlacierUsageTotals"
        images:
          type: array
          items:
            $ref: "#/components/schemas/GlacierUsageImage"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/GlacierUsageCollection"
        history:
          type: array
          items:
            $ref: "#/components/schemas/GlacierUsageSnapshot"
    CollectionSummary:
      type: object
      required:
        [
          id,
          files,
          bytes,
          hot_bytes,
          archived_bytes,
          pending_bytes,
          glacier,
          collection_manifest,
          archive_format,
          compression,
          disc_coverage,
          protection_state,
          protected_bytes,
          image_coverage,
        ]
      properties:
        id:
          type: string
          description: Canonical collection id. May contain `/` and is prefix-free with every other collection id.
        files: { type: integer }
        bytes: { type: integer }
        hot_bytes: { type: integer }
        archived_bytes: { type: integer }
        pending_bytes: { type: integer }
        glacier:
          $ref: "#/components/schemas/GlacierArchive"
        collection_manifest:
          $ref: "#/components/schemas/CollectionManifest"
        archive_format:
          type: string
        compression:
          type: string
        disc_coverage:
          $ref: "#/components/schemas/CollectionDiscCoverage"
        protection_state:
          $ref: "#/components/schemas/CollectionProtectionState"
        protected_bytes:
          type: integer
        image_coverage:
          type: array
          items:
            $ref: "#/components/schemas/CollectionCoverageImage"
    CollectionListItem:
      type: object
      required:
        [
          id,
          files,
          bytes,
          hot_bytes,
          archived_bytes,
          pending_bytes,
          glacier,
          collection_manifest,
          archive_format,
          compression,
          disc_coverage,
          protection_state,
          protected_bytes,
        ]
      properties:
        id:
          type: string
          description: Canonical collection id. May contain `/` and is prefix-free with every other collection id.
        files: { type: integer }
        bytes: { type: integer }
        hot_bytes: { type: integer }
        archived_bytes: { type: integer }
        pending_bytes: { type: integer }
        glacier:
          $ref: "#/components/schemas/GlacierArchive"
        collection_manifest:
          $ref: "#/components/schemas/CollectionManifest"
        archive_format:
          type: string
        compression:
          type: string
        disc_coverage:
          $ref: "#/components/schemas/CollectionDiscCoverage"
        protection_state:
          $ref: "#/components/schemas/CollectionProtectionState"
        protected_bytes:
          type: integer
    CollectionDiscCoverage:
      type: object
      required: [state, covered_bytes, verified_physical_bytes]
      properties:
        state:
          $ref: "#/components/schemas/CoverageState"
        covered_bytes:
          type: integer
          minimum: 0
        verified_physical_bytes:
          type: integer
          minimum: 0
    CollectionListResponse:
      type: object
      required: [page, per_page, total, pages, collections]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CollectionListItem"
    CollectionUploadFile:
      type: object
      required: [path, bytes, sha256]
      properties:
        path:
          type: string
          description: Relative logical file path within the collection source tree.
        bytes: { type: integer }
        sha256:
          type: string
          description: Logical-file SHA-256 digest for final verification.
    CollectionUploadRequest:
      type: object
      required: [slug, files]
      properties:
        slug:
          type: string
          description: Human-readable collection slug. Riverhog normalizes this and mints the canonical collection id.
        upload_timestamp:
          oneOf:
            - type: string
            - type: "null"
          description: Optional UTC basic timestamp in `YYYYMMDDTHHMMSSZ` form to use in the canonical collection id for migration of older archival sets. Slug remains required.
        ingest_source:
          oneOf:
            - type: string
            - type: "null"
          description: Descriptive source hint from the client. Never part of collection identity.
        files:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CollectionUploadFile"
    CreateOrResumeCollectionUploadSessionRequest:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          description: Human-readable collection slug. Riverhog normalizes this and mints or resumes the canonical collection id.
        upload_timestamp:
          oneOf:
            - type: string
            - type: "null"
          description: Optional UTC basic timestamp in `YYYYMMDDTHHMMSSZ` form to use in the canonical collection id for migration of older archival sets. Slug remains required.
        ingest_source:
          oneOf:
            - type: string
            - type: "null"
          description: Descriptive source hint from the client. Never part of collection identity.
    RegisterCollectionUploadSessionFileRequest:
      allOf:
        - $ref: "#/components/schemas/CollectionUploadFile"
    CollectionUploadFileState:
      type: object
      required: [path, bytes, sha256, upload_state, uploaded_bytes, upload_state_expires_at]
      properties:
        path: { type: string }
        bytes: { type: integer }
        sha256: { type: string }
        upload_state:
          $ref: "#/components/schemas/FetchEntryUploadState"
        uploaded_bytes:
          type: integer
          description: Accepted upload bytes for this logical file's plaintext stream.
        upload_state_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    CollectionUploadSessionFileRegistration:
      type: object
      required: [collection_id, ingest_source, state, file]
      properties:
        collection_id:
          type: string
          description: Server-minted canonical collection id for this upload session.
        ingest_source:
          oneOf:
            - type: string
            - type: "null"
        state:
          type: string
          enum: [open, uploading]
        file:
          $ref: "#/components/schemas/CollectionUploadFileState"
    CollectionUploadSessionFileUpload:
      allOf:
        - $ref: "#/components/schemas/CollectionUploadSessionFileRegistration"
        - $ref: "#/components/schemas/CollectionFileUploadSession"
    CollectionUploadSession:
      type: object
      required:
        [
          collection_id,
          ingest_source,
          state,
          files_total,
          files_pending,
          files_partial,
          files_uploaded,
          hot_promoted_files,
          bytes_total,
          uploaded_bytes,
