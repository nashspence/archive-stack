          description: Relative file path within the collection, no leading slash.
        bytes: { type: integer }
        sha256:
          type: string
          description: SHA-256 hex digest of the file content.
        hot: { type: boolean }
        archived: { type: boolean }
    FilesResponse:
      type: object
      required: [target, page, per_page, total, pages, files]
      properties:
        target:
          $ref: "#/components/schemas/Target"
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileRecord"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
