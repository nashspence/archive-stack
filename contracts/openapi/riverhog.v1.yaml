              disc_bytes,
              missing_files,
              missing_with_disc_files,
              missing_without_disc_files,
              target_summaries,
              files_preview_limit,
              files_preview_returned,
              files_preview,
              next_action,
              next_action_reason,
              archive_restores,
              entries_limit,
              entries_returned,
              entries,
            ]
          properties:
            hot_files: { type: integer }
            hot_bytes: { type: integer }
            disc_files: { type: integer }
            disc_bytes: { type: integer }
            missing_files: { type: integer }
            missing_with_disc_files: { type: integer }
            missing_without_disc_files: { type: integer }
            target_summaries:
              type: array
              items:
                $ref: "#/components/schemas/FetchTargetSummary"
            files_preview_limit:
              type: integer
              minimum: 0
              maximum: 100
            files_preview_returned:
              type: integer
              minimum: 0
            files_preview:
              type: array
              items:
                $ref: "#/components/schemas/FetchFile"
            next_action: { type: string }
            next_action_reason: { type: string }
            archive_restores:
              $ref: "#/components/schemas/ArchiveRestoreList"
            entries_limit:
              type: integer
              minimum: 0
              maximum: 100
            entries_returned:
              type: integer
              minimum: 0
            entries:
              type: array
              items:
                $ref: "#/components/schemas/FetchStatusEntry"
    FetchFilesResponse:
      type: object
      required:
        [
          fetch_id,
          query,
          hot,
          disc_coverage,
          page,
          per_page,
          total,
          pages,
          sort,
          order,
          files,
        ]
      properties:
        fetch_id: { type: string }
        query:
          oneOf:
            - type: string
            - type: "null"
        hot:
          oneOf:
            - type: boolean
            - type: "null"
        disc_coverage:
          oneOf:
            - type: boolean
            - type: "null"
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        pages: { type: integer }
        sort:
          type: string
          enum: [target, collection, path, bytes, hot, disc]
        order:
          type: string
          enum: [asc, desc]
        files:
          type: array
          items:
            $ref: "#/components/schemas/FetchFile"
    FetchManifestEntryCopy:
      type: object
      required: [disc_id, image_id, location, disc_path, recovery_bytes, recovery_sha256]
      properties:
        disc_id: { type: string }
        image_id:
          type: string
          pattern: "^[0-9]{8}T[0-9]{6}Z$"
        location: { type: string }
        disc_path:
          type: string
          description: On-disc payload-object path whose raw encrypted bytes are uploaded for this recovery candidate.
        recovery_bytes:
          type: integer
          description: Exact raw encrypted byte length at `disc_path` for this recovery candidate.
        recovery_sha256:
          type: string
          description: SHA-256 of the exact raw encrypted byte stream at `disc_path` for this recovery candidate.
    FetchManifestEntry:
      type: object
      required:
        [id, collection_id, path, bytes, sha256, recovery_bytes, upload_state, uploaded_bytes, upload_state_expires_at, discs]
      properties:
        id: { type: string }
        collection_id:
          type: string
          description: Collection id for this logical file, included so fetches spanning multiple collections remain unambiguous.
        path: { type: string }
        bytes:
          type: integer
          description: Final logical-file byte length used by the server after decrypting and reconstructing uploaded recovery data.
        sha256:
          type: string
          description: Logical-file digest used by the server for final verification.
        recovery_bytes:
          type: integer
          description: Total upload length for this entry's ordered recovery-byte stream.
        upload_state:
          $ref: "#/components/schemas/FetchEntryUploadState"
        uploaded_bytes:
          type: integer
          description: Accepted upload bytes in this entry's ordered recovery-byte stream.
        upload_state_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        discs:
          type: array
          items:
            $ref: "#/components/schemas/FetchManifestEntryCopy"
        parts:
          type: array
          items:
            $ref: "#/components/schemas/FetchManifestPart"
    FetchManifestPart:
      type: object
      required: [index, bytes, sha256, recovery_bytes, discs]
      properties:
        index: { type: integer }
        bytes:
          type: integer
          description: Logical plaintext length for this part after decryption.
        sha256:
          type: string
          description: Logical plaintext digest for this part, used by the server as a verification anchor.
        recovery_bytes:
          type: integer
          description: Raw encrypted byte length uploaded for this ordered recovery span.
        discs:
          type: array
          items:
            $ref: "#/components/schemas/FetchManifestEntryCopy"
    FetchManifest:
      type: object
      required: [id, name, targets, entries]
      properties:
        id: { type: string }
        name: { type: string }
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FetchManifestEntry"
    SearchFile:
      type: object
      required: [target, collection, path, bytes, sha256, hot, disc_coverage]
      properties:
        target:
          $ref: "#/components/schemas/Target"
        collection: { type: string }
        path: { type: string }
        bytes: { type: integer }
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        hot: { type: boolean }
        disc_coverage: { type: boolean }
    SearchResponse:
      type: object
      required: [query, collection, hot, disc_coverage, page, per_page, total, pages, sort, order, files]
      properties:
        query:
          oneOf:
            - type: string
            - type: "null"
        collection:
          oneOf:
            - type: string
            - type: "null"
        hot:
          oneOf:
            - type: boolean
            - type: "null"
        disc_coverage:
          oneOf:
            - type: boolean
            - type: "null"
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        sort:
          type: string
          enum: [target, collection, path, bytes, hot, disc]
        order:
          type: string
          enum: [asc, desc]
        files:
          type: array
          items:
            $ref: "#/components/schemas/SearchFile"
    FetchUploadSession:
      type: object
      required: [entry, protocol, upload_url, offset, length, checksum_algorithm, expires_at]
      properties:
        entry: { type: string }
        protocol:
          type: string
          const: tus
        upload_url:
          type: string
          format: uri
        offset:
          type: integer
          description: Current accepted byte offset in the entry's ordered recovery-byte stream.
        length:
          type: integer
          description: Total byte length of the entry's ordered recovery-byte stream.
        checksum_algorithm:
          type: string
          const: sha256
          description: Transport checksum algorithm for uploaded PATCH chunks, not the final logical-file digest.
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    PlanCandidate:
      type: object
      required: [candidate_id, bytes, target_bytes, fill, collections, collection_ids, files, iso_ready]
      properties:
        candidate_id: { type: string }
        bytes: { type: integer }
        target_bytes:
          type: integer
          description: Target media capacity used when this candidate was planned.
        fill: { type: number }
        collections: { type: integer }
        collection_ids:
          type: array
          items: { type: string }
        files: { type: integer }
        iso_ready: { type: boolean }
    PlanResponse:
      type: object
      required: [page, per_page, total, pages, sort, order, ready, target_bytes, min_fill_bytes, candidates, unplanned_bytes]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        sort:
          type: string
          enum: [fill, bytes, files, collections, candidate_id]
        order:
          type: string
          enum: [asc, desc]
        ready: { type: boolean }
        target_bytes: { type: integer }
        min_fill_bytes: { type: integer }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PlanCandidate"
        unplanned_bytes: { type: integer }
        note: { type: string }
    FileRecord:
      type: object
      required: [target, collection, path, bytes, sha256, hot, disc_coverage]
      properties:
        target:
          $ref: "#/components/schemas/Target"
        collection:
          type: string
          description: Canonical collection id owning this file.
        path:
          type: string
          description: Relative file path within the collection, no leading slash.
        bytes: { type: integer }
        sha256:
          type: string
          description: SHA-256 hex digest of the file content.
        hot: { type: boolean }
        disc_coverage: { type: boolean }
    FilesResponse:
      type: object
      required: [target, page, per_page, total, pages, files]
      properties:
        target:
          $ref: "#/components/schemas/Target"
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileRecord"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
