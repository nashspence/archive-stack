[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "stove0-server"
version = "0.1.0"
description = "Content-opaque Riverhog collection transformation orchestration."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "fastapi>=0.111,<1.0",
  "http-api-contracts>=0.1,<0.2",
  "lifecycle-events>=0.1,<0.2",
  "psycopg[binary]>=3.3,<4.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "riverhog-api-client>=0.1,<0.2",
  "riverhog-protocol>=0.1,<0.2",
  "sqlalchemy>=2.0,<3.0",
  "starlette>=0.37,<2.0",
  "state-schema>=0.1,<0.2",
  "stove0-observer-support>=0.1,<0.2",
  "stove0-protocol>=0.1,<0.2",
  "stove0-review-contracts>=0.1,<0.2",
  "stove0-target-support>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
stove0-server = "stove0_api.app:main"

[tool.uv.sources]
http-api-contracts = { workspace = true }
lifecycle-events = { workspace = true }
riverhog-api-client = { workspace = true }
riverhog-protocol = { workspace = true }
stove0-observer-support = { workspace = true }
stove0-protocol = { workspace = true }
stove0-review-contracts = { workspace = true }
stove0-target-support = { workspace = true }
state-schema = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stove0_api", "src/stove0_core"]
