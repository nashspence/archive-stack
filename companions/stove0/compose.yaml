x-stove0-image: &stove0-image
  image: stove0:dev
  build:
    context: ../..
    dockerfile: companions/stove0/server/Dockerfile
    target: reference-composition
    args:
      SOURCE_REVISION: ${SOURCE_REVISION:-unknown}

x-stove0-environment: &stove0-environment
  TZ: ${TZ:-UTC}
  STOVE0_DATABASE_URL_FILE: /run/secrets/stove0_database_url
  STOVE0_RECIPES_PATH: /etc/stove0/recipes.yaml
  STOVE0_WORKSPACE_ASSURANCE: ephemeral
  STOVE0_CLAIM_LEASE_SECONDS: ${STOVE0_CLAIM_LEASE_SECONDS:-1800}
  STOVE0_CAPABILITY_TTL_SECONDS: ${STOVE0_CAPABILITY_TTL_SECONDS:-900}
  STOVE0_SCHEDULER_INTERVAL_SECONDS: ${STOVE0_SCHEDULER_INTERVAL_SECONDS:-5}
  STOVE0_OPERATIONAL_STATE_RETENTION_SECONDS: ${STOVE0_OPERATIONAL_STATE_RETENTION_SECONDS:-2592000}
  RIVERHOG_BASE_URL: ${STOVE0_RIVERHOG_BASE_URL:-http://app:8000}
  RIVERHOG_ALLOW_INSECURE_HTTP: "true"
  STOVE0_OBSERVERS_JSON: '{"exiftool":{"base_url":"http://exiftool-observer:8080","token_env":"STOVE0_EXIFTOOL_OBSERVER_TOKEN","allow_insecure_http":true,"semantic_validator_providers":["media-metadata"]},"ffprobe-sampling":{"base_url":"http://ffprobe-sampling-observer:8080","token_env":"STOVE0_FFPROBE_SAMPLING_OBSERVER_TOKEN","allow_insecure_http":true,"semantic_validator_providers":["media-sampling"]}}'
  STOVE0_TARGETS_JSON: '{"nvenc-av1-opus":{"base_url":"http://nvenc-av1-opus-target:8080","token_env":"STOVE0_NVENC_AV1_OPUS_TARGET_TOKEN","allow_insecure_http":true},"opus":{"base_url":"http://opus-target:8080","token_env":"STOVE0_OPUS_TARGET_TOKEN","allow_insecure_http":true},"review":{"base_url":"http://review-materialize-target:8080","token_env":"STOVE0_REVIEW_MATERIALIZE_TARGET_TOKEN","allow_insecure_http":true},"review-effect":{"base_url":"http://review-rclone-effect-target:8080","token_env":"STOVE0_REVIEW_RCLONE_EFFECT_TARGET_TOKEN","allow_insecure_http":true}}'
  STOVE0_FFPROBE_SAMPLING_OBSERVER_TOKEN_FILE: /run/secrets/stove0_ffprobe_sampling_observer_token
  STOVE0_EXIFTOOL_OBSERVER_TOKEN_FILE: /run/secrets/stove0_exiftool_observer_token
  STOVE0_NVENC_AV1_OPUS_TARGET_TOKEN_FILE: /run/secrets/stove0_nvenc_av1_opus_target_token
  STOVE0_OPUS_TARGET_TOKEN_FILE: /run/secrets/stove0_opus_target_token
  STOVE0_REVIEW_MATERIALIZE_TARGET_TOKEN_FILE: /run/secrets/stove0_review_materialize_target_token
  STOVE0_REVIEW_RCLONE_EFFECT_TARGET_TOKEN_FILE: /run/secrets/stove0_review_rclone_effect_target_token

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  user: "65532:65532"
  group_add:
    - "${STOVE0_SECRET_FILE_GID:-65532}"
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

x-stove0-common: &stove0-common
  <<: [*stove0-image, *hardening]
  volumes:
    - type: bind
      source: ${STOVE0_RECIPES_HOST_PATH:?STOVE0_RECIPES_HOST_PATH is required}
      target: /etc/stove0/recipes.yaml
      read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
  networks: ["stove0-internal", "riverhog-control"]

services:
  state:
    <<: *stove0-common
    restart: "no"
    command: ["stove0-server", "state", "upgrade"]
    environment:
      TZ: ${TZ:-UTC}
      STOVE0_DATABASE_URL_FILE: /run/secrets/stove0_database_url
    secrets: ["stove0_database_url"]

  api:
    <<: *stove0-common
    depends_on:
      state:
        condition: service_completed_successfully
    environment:
      <<: *stove0-environment
      STOVE0_API_TOKEN_FILE: /run/secrets/stove0_api_token
      RIVERHOG_TOKEN_FILE: /run/secrets/stove0_api_riverhog_token
    secrets:
      - stove0_database_url
      - stove0_ffprobe_sampling_observer_token
      - stove0_exiftool_observer_token
      - stove0_nvenc_av1_opus_target_token
      - stove0_opus_target_token
      - stove0_review_materialize_target_token
      - stove0_review_rclone_effect_target_token
      - stove0_api_token
      - stove0_api_riverhog_token
    ports:
      - "${STOVE0_API_BIND_ADDR:-127.0.0.1}:${STOVE0_API_PORT:-8094}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5));
          assert payload == {'service': 'stove0', 'status': 'ok'}
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  controller:
    <<: *stove0-common
    depends_on:
      state:
        condition: service_completed_successfully
    command: ["stove0-server", "scheduler", "--role", "controller"]
    environment:
      <<: *stove0-environment
      RIVERHOG_TOKEN_FILE: /run/secrets/stove0_controller_riverhog_token
    secrets:
      - stove0_database_url
      - stove0_ffprobe_sampling_observer_token
      - stove0_exiftool_observer_token
      - stove0_nvenc_av1_opus_target_token
      - stove0_opus_target_token
      - stove0_review_materialize_target_token
      - stove0_review_rclone_effect_target_token
      - stove0_controller_riverhog_token

  worker:
    <<: *stove0-common
    depends_on:
      state:
        condition: service_completed_successfully
    command: ["stove0-server", "scheduler", "--role", "worker"]
    environment:
      <<: *stove0-environment
      RIVERHOG_TOKEN_FILE: /run/secrets/stove0_worker_riverhog_token
    secrets:
      - stove0_database_url
      - stove0_ffprobe_sampling_observer_token
      - stove0_exiftool_observer_token
      - stove0_nvenc_av1_opus_target_token
      - stove0_opus_target_token
      - stove0_review_materialize_target_token
      - stove0_review_rclone_effect_target_token
      - stove0_worker_riverhog_token

  ffprobe-sampling-observer:
    <<: *hardening
    image: stove0-ffprobe-sampling-observer:dev
    build:
      context: ../..
      dockerfile: reference/stove0/observers/ffprobe-sampling/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["stove0-ffprobe-sampling-observer", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      STOVE0_FFPROBE_SAMPLING_OBSERVER_TOKEN_FILE: /run/secrets/stove0_ffprobe_sampling_observer_token
      STOVE0_FFPROBE_SAMPLING_OBSERVER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      STOVE0_FFPROBE_SAMPLING_OBSERVER_IMAGE_DIGEST: ${STOVE0_FFPROBE_IMAGE_DIGEST:?STOVE0_FFPROBE_IMAGE_DIGEST is required}
      STOVE0_FFPROBE_SAMPLING_OBSERVER_WORKSPACE: /run/stove0-ffprobe-sampling-observer
    secrets: ["stove0_ffprobe_sampling_observer_token"]
    networks: ["stove0-internal", "riverhog-control"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
      - /run/stove0-ffprobe-sampling-observer:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_OBSERVER_TMPFS_SIZE:-8g}
    healthcheck: &ffmpeg-health
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5));
          assert payload['status'] == 'ok'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  exiftool-observer:
    <<: *hardening
    image: stove0-exiftool-observer:dev
    build:
      context: ../..
      dockerfile: reference/stove0/observers/exiftool/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["stove0-exiftool-observer", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      STOVE0_EXIFTOOL_OBSERVER_TOKEN_FILE: /run/secrets/stove0_exiftool_observer_token
      STOVE0_EXIFTOOL_OBSERVER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      STOVE0_EXIFTOOL_OBSERVER_IMAGE_DIGEST: ${STOVE0_EXIFTOOL_IMAGE_DIGEST:?STOVE0_EXIFTOOL_IMAGE_DIGEST is required}
      STOVE0_EXIFTOOL_OBSERVER_WORKSPACE: /run/stove0-exiftool-observer
    secrets: ["stove0_exiftool_observer_token"]
    networks: ["stove0-internal", "riverhog-control"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
      - /run/stove0-exiftool-observer:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_OBSERVER_TMPFS_SIZE:-8g}
    healthcheck: *ffmpeg-health

  opus-target:
    <<: *hardening
    image: stove0-opus-target:dev
    build: &opus-build
      context: ../..
      dockerfile: reference/stove0/targets/opus/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["stove0-opus-target", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      STOVE0_OPUS_TARGET_TOKEN_FILE: /run/secrets/stove0_opus_target_token
      STOVE0_OPUS_TARGET_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      STOVE0_OPUS_TARGET_IMAGE_DIGEST: ${STOVE0_OPUS_IMAGE_DIGEST:?STOVE0_OPUS_IMAGE_DIGEST is required}
      STOVE0_OPUS_TARGET_STATE_ROOT: /var/lib/stove0-opus-target
      STOVE0_OPUS_TARGET_WORKSPACE: /run/stove0-opus-target
      STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS: ${STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS:-2592000}
    secrets: ["stove0_opus_target_token"]
    networks: ["stove0-internal", "riverhog-control"]
    volumes:
      - stove0-opus-target-state:/var/lib/stove0-opus-target
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
      - /run/stove0-opus-target:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TARGET_TMPFS_SIZE:-32g}
    healthcheck: *ffmpeg-health

  opus-review-sampler:
    <<: *hardening
    image: stove0-opus-target:dev
    build: *opus-build
    command: ["stove0-opus-review-sampler", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      STOVE0_OPUS_REVIEW_SAMPLER_TOKEN_FILE: /run/secrets/stove0_opus_review_sampler_token
      STOVE0_OPUS_REVIEW_SAMPLER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      STOVE0_OPUS_REVIEW_SAMPLER_IMAGE_DIGEST: ${STOVE0_OPUS_IMAGE_DIGEST:?STOVE0_OPUS_IMAGE_DIGEST is required}
      STOVE0_OPUS_REVIEW_SAMPLER_WORKSPACE: /run/stove0-review
    secrets: ["stove0_opus_review_sampler_token"]
    networks: ["review-sampler"]
    volumes:
      - stove0-review-workspace:/run/stove0-review
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    healthcheck: *ffmpeg-health

  review-materialize-target:
    <<: *hardening
    image: stove0-review-materialize-target:dev
    build:
      context: ../..
      dockerfile: reference/stove0/targets/review/materialize-target/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["stove0-review-materialize-target", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      STOVE0_REVIEW_MATERIALIZE_TARGET_TOKEN_FILE: /run/secrets/stove0_review_materialize_target_token
      STOVE0_REVIEW_MATERIALIZE_TARGET_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      STOVE0_REVIEW_MATERIALIZE_TARGET_IMAGE_DIGEST: ${STOVE0_REVIEW_MATERIALIZE_IMAGE_DIGEST:?STOVE0_REVIEW_MATERIALIZE_IMAGE_DIGEST is required}
      STOVE0_REVIEW_MATERIALIZE_TARGET_STATE_ROOT: /var/lib/stove0-review-materialize-target
      STOVE0_REVIEW_MATERIALIZE_TARGET_WORKSPACE: /run/stove0-review
      STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS: ${STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS:-2592000}
      STOVE0_REVIEW_MATERIALIZE_TARGET_SAMPLERS_JSON: '{"samplers":[{"id":"opus","base_url":"http://opus-review-sampler:8080","token_file":"/run/secrets/stove0_opus_review_sampler_token","allow_insecure_http":true,"descriptor_sha256":"${STOVE0_OPUS_REVIEW_SAMPLER_DESCRIPTOR_SHA256:?STOVE0_OPUS_REVIEW_SAMPLER_DESCRIPTOR_SHA256 is required}","image_digest":"${STOVE0_OPUS_IMAGE_DIGEST:?STOVE0_OPUS_IMAGE_DIGEST is required}"}]}'
    depends_on:
      opus-review-sampler:
        condition: service_healthy
    secrets:
      - stove0_review_materialize_target_token
      - stove0_opus_review_sampler_token
    networks: ["stove0-internal", "riverhog-control", "review-sampler"]
    volumes:
      - stove0-review-materialize-target-state:/var/lib/stove0-review-materialize-target
      - stove0-review-workspace:/run/stove0-review
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    healthcheck: *ffmpeg-health

  review-rclone-effect-target:
    <<: *hardening
    image: stove0-review-rclone-effect-target:dev
    build:
      context: ../..
      dockerfile: reference/stove0/targets/review/rclone-effect-target/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["stove0-review-rclone-effect-target", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      STOVE0_REVIEW_RCLONE_EFFECT_TARGET_TOKEN_FILE: /run/secrets/stove0_review_rclone_effect_target_token
      STOVE0_REVIEW_RCLONE_EFFECT_TARGET_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      STOVE0_REVIEW_RCLONE_EFFECT_TARGET_IMAGE_DIGEST: ${STOVE0_REVIEW_RCLONE_EFFECT_IMAGE_DIGEST:?STOVE0_REVIEW_RCLONE_EFFECT_IMAGE_DIGEST is required}
      STOVE0_REVIEW_RCLONE_EFFECT_TARGET_STATE_ROOT: /var/lib/stove0-review-rclone-effect-target
      STOVE0_REVIEW_RCLONE_EFFECT_TARGET_WORKSPACE: /run/stove0-review
      STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS: ${STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS:-2592000}
      STOVE0_REVIEW_RCLONE_EFFECT_TARGET_DESTINATION_IDENTITY: ${STOVE0_REVIEW_RCLONE_EFFECT_DESTINATION_IDENTITY:-bdb097e00217151eda04cc51bff5262f21aea08af4da16df5467d727570875a1}
      STOVE0_REVIEW_RCLONE_EFFECT_TARGET_RCLONE_REMOTE: /var/lib/stove0-review-delivery
      STOVE0_REVIEW_RCLONE_EFFECT_TARGET_SAMPLERS_JSON: '{"samplers":[{"id":"opus","base_url":"http://opus-review-sampler:8080","token_file":"/run/secrets/stove0_opus_review_sampler_token","allow_insecure_http":true,"descriptor_sha256":"${STOVE0_OPUS_REVIEW_SAMPLER_DESCRIPTOR_SHA256:?STOVE0_OPUS_REVIEW_SAMPLER_DESCRIPTOR_SHA256 is required}","image_digest":"${STOVE0_OPUS_IMAGE_DIGEST:?STOVE0_OPUS_IMAGE_DIGEST is required}"}]}'
    depends_on:
      opus-review-sampler:
        condition: service_healthy
    secrets:
      - stove0_review_rclone_effect_target_token
      - stove0_opus_review_sampler_token
    networks: ["stove0-internal", "riverhog-control", "review-sampler"]
    volumes:
      - stove0-review-rclone-effect-target-state:/var/lib/stove0-review-rclone-effect-target
      - stove0-review-workspace:/run/stove0-review
      - stove0-review-effect-delivery:/var/lib/stove0-review-delivery
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    healthcheck: *ffmpeg-health

  nvenc-av1-opus-target:
    <<: *hardening
    image: stove0-nvenc-av1-opus-target:dev
    build: &nvenc-build
      context: ../..
      dockerfile: reference/stove0/targets/nvenc-av1-opus/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    profiles: ["nvenc"]
    gpus: all
    command: ["stove0-nvenc-av1-opus-target", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      STOVE0_NVENC_AV1_OPUS_TARGET_TOKEN_FILE: /run/secrets/stove0_nvenc_av1_opus_target_token
      STOVE0_NVENC_AV1_OPUS_TARGET_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      STOVE0_NVENC_AV1_OPUS_TARGET_IMAGE_DIGEST: ${STOVE0_NVENC_AV1_OPUS_IMAGE_DIGEST:?STOVE0_NVENC_AV1_OPUS_IMAGE_DIGEST is required}
      STOVE0_NVENC_AV1_OPUS_TARGET_STATE_ROOT: /var/lib/stove0-nvenc-av1-opus-target
      STOVE0_NVENC_AV1_OPUS_TARGET_WORKSPACE: /run/stove0-nvenc-av1-opus-target
      STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS: ${STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS:-2592000}
    secrets: ["stove0_nvenc_av1_opus_target_token"]
    networks: ["stove0-internal", "riverhog-control"]
    volumes:
      - stove0-nvenc-av1-opus-target-state:/var/lib/stove0-nvenc-av1-opus-target
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
      - /run/stove0-nvenc-av1-opus-target:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TARGET_TMPFS_SIZE:-32g}
    healthcheck: *ffmpeg-health

  nvenc-av1-opus-review-sampler:
    <<: *hardening
    image: stove0-nvenc-av1-opus-target:dev
    build: *nvenc-build
    profiles: ["nvenc"]
    gpus: all
    command: ["stove0-nvenc-av1-opus-review-sampler", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      STOVE0_NVENC_AV1_OPUS_REVIEW_SAMPLER_TOKEN_FILE: /run/secrets/stove0_nvenc_av1_opus_review_sampler_token
      STOVE0_NVENC_AV1_OPUS_REVIEW_SAMPLER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      STOVE0_NVENC_AV1_OPUS_REVIEW_SAMPLER_IMAGE_DIGEST: ${STOVE0_NVENC_AV1_OPUS_IMAGE_DIGEST:?STOVE0_NVENC_AV1_OPUS_IMAGE_DIGEST is required}
      STOVE0_NVENC_AV1_OPUS_REVIEW_SAMPLER_WORKSPACE: /run/stove0-review
    secrets: ["stove0_nvenc_av1_opus_review_sampler_token"]
    networks: ["review-sampler"]
    volumes:
      - stove0-review-workspace:/run/stove0-review
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    healthcheck: *ffmpeg-health

volumes:
  stove0-nvenc-av1-opus-target-state:
  stove0-opus-target-state:
  stove0-review-materialize-target-state:
  stove0-review-rclone-effect-target-state:
  stove0-review-effect-delivery:
  stove0-review-workspace:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=${STOVE0_REVIEW_TMPFS_SIZE:-32g},uid=65532,gid=65532,mode=0700

secrets:
  stove0_database_url:
    file: ${STOVE0_DATABASE_URL_FILE:?STOVE0_DATABASE_URL_FILE is required}
  stove0_api_token:
    file: ${STOVE0_API_TOKEN_FILE:?STOVE0_API_TOKEN_FILE is required}
  stove0_api_riverhog_token:
    file: ${STOVE0_API_RIVERHOG_TOKEN_FILE:?STOVE0_API_RIVERHOG_TOKEN_FILE is required}
  stove0_controller_riverhog_token:
    file: ${STOVE0_CONTROLLER_RIVERHOG_TOKEN_FILE:?STOVE0_CONTROLLER_RIVERHOG_TOKEN_FILE is required}
  stove0_worker_riverhog_token:
    file: ${STOVE0_WORKER_RIVERHOG_TOKEN_FILE:?STOVE0_WORKER_RIVERHOG_TOKEN_FILE is required}
  stove0_ffprobe_sampling_observer_token:
    file: ${STOVE0_FFPROBE_SAMPLING_OBSERVER_TOKEN_FILE:?STOVE0_FFPROBE_SAMPLING_OBSERVER_TOKEN_FILE is required}
  stove0_exiftool_observer_token:
    file: ${STOVE0_EXIFTOOL_OBSERVER_TOKEN_FILE:?STOVE0_EXIFTOOL_OBSERVER_TOKEN_FILE is required}
  stove0_nvenc_av1_opus_target_token:
    file: ${STOVE0_NVENC_AV1_OPUS_TARGET_TOKEN_FILE:?STOVE0_NVENC_AV1_OPUS_TARGET_TOKEN_FILE is required}
  stove0_nvenc_av1_opus_review_sampler_token:
    file: ${STOVE0_NVENC_AV1_OPUS_REVIEW_SAMPLER_TOKEN_FILE:?STOVE0_NVENC_AV1_OPUS_REVIEW_SAMPLER_TOKEN_FILE is required}
  stove0_opus_target_token:
    file: ${STOVE0_OPUS_TARGET_TOKEN_FILE:?STOVE0_OPUS_TARGET_TOKEN_FILE is required}
  stove0_opus_review_sampler_token:
    file: ${STOVE0_OPUS_REVIEW_SAMPLER_TOKEN_FILE:?STOVE0_OPUS_REVIEW_SAMPLER_TOKEN_FILE is required}
  stove0_review_materialize_target_token:
    file: ${STOVE0_REVIEW_MATERIALIZE_TARGET_TOKEN_FILE:?STOVE0_REVIEW_MATERIALIZE_TARGET_TOKEN_FILE is required}
  stove0_review_rclone_effect_target_token:
    file: ${STOVE0_REVIEW_RCLONE_EFFECT_TARGET_TOKEN_FILE:?STOVE0_REVIEW_RCLONE_EFFECT_TARGET_TOKEN_FILE is required}

networks:
  stove0-internal:
    internal: true
  review-sampler:
    internal: true
  riverhog-control:
    external: true
    name: ${RIVERHOG_CONTROL_NETWORK:-riverhog_default}
