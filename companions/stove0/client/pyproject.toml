[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "stove0-client"
version = "0.1.0"
description = "Cross-platform command-line client for stove0."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "pydantic>=2.7,<3.0",
  "rich>=15.0,<16.0",
  "stove0-api-client>=0.1,<0.2",
  "stove0-recipe-config>=0.1,<0.2",
  "typer>=0.12,<1.0",
]

[project.scripts]
stove0 = "stove0_cli.main:main"

[tool.uv.sources]
stove0-api-client = { workspace = true }
stove0-recipe-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stove0_cli"]
