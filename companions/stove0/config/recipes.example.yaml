- id: stove0.review.materialize/v1
  intent_schema:
    id: stove0.review.materialize-intent/v1
    sha256: f38621476c23845144af1222566aafa8031d6487e082860c66f7b559be17aeed
    document:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - sample_plan
      - variant
      properties:
        sample_plan:
          type: object
          required:
          - format
          - selection_method
          - samples_per_artifact
          - window_duration_ms
          - windows
          - sample_plan_sha256
          properties:
            format:
              const: stove0-review-sample-plan/v1
            selection_method:
              const: evenly-spaced/v1
            samples_per_artifact:
              type: integer
              minimum: 1
            window_duration_ms:
              type: integer
              minimum: 1
            windows:
              type: array
              minItems: 1
              items:
                type: object
                required:
                - artifact_id
                - start_ms
                - duration_ms
                properties:
                  artifact_id:
                    type: string
                    minLength: 1
                  start_ms:
                    type: integer
                    minimum: 0
                  duration_ms:
                    type: integer
                    minimum: 1
                additionalProperties: false
            sample_plan_sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
          additionalProperties: false
        variant:
          type: object
          required:
          - id
          - portable_intent
          properties:
            id:
              type: string
              pattern: ^[a-z0-9](?:[a-z0-9._-]{0,158}[a-z0-9])?$
            portable_intent:
              type: object
          additionalProperties: false
      additionalProperties: false
  inputs:
  - role: stove0.review.source/v1
    minimum: 1
    allowed_dispositions:
    - preserved
    - transformed
  outputs:
  - role: stove0.review.audio/v1
    minimum: 0
    derived_from_roles:
    - stove0.review.source/v1
  - role: stove0.review.index/v1
    minimum: 1
    maximum: 1
    derived_from_roles:
    - stove0.review.source/v1
  - role: stove0.review.video/v1
    minimum: 0
    derived_from_roles:
    - stove0.review.source/v1
  source_retirement_permitted: false
  contract_sha256: 1ac1e34e47f1f54571af1ce05200b8efad367d9e0ddc5d0c4d114802c5358bd7
recipes:
- id: stove0.audio-archive/v1
  revision: 1
  input_tags:
  - stove0-audio-archive
  event_input_closure: single-finalized-collection
  allow_derived_inputs: false
  source_retirement_policy: retain
  observers:
  - registration_id: exiftool
    contract_id: stove0.media.metadata/v1
    artifact_rules:
    - glob: '*'
      role: stove0.media.source/v1
    retrieval_policy: allow
  routes:
  - id: archive-audio
    operation_id: stove0.media.audio-archive/v1
    target_registration_id: opus
    artifact_rules:
    - glob: '*'
      role: stove0.media.source/v1
    intent:
      bitrate_kbps: 128
      codec: opus
      container: opus
    input_retrieval_policy: allow
    output_tags:
    - archive-audio
- id: stove0.review/v1
  revision: 1
  input_tags:
  - stove0-review
  event_input_closure: single-finalized-collection
  allow_derived_inputs: false
  source_retirement_policy: retain
  observers:
  - registration_id: ffprobe-sampling
    contract_id: stove0.review.media-sampling/v1
    artifact_rules:
    - glob: '*'
      role: stove0.review.source/v1
    retrieval_policy: available-only
  routes:
  - id: review
    operation_id: stove0.review.materialize/v1
    target_registration_id: review
    artifact_rules:
    - glob: '*'
      role: stove0.review.source/v1
    target_options:
      sampler_registration_id: opus
    projections:
    - source: work-effective-intent
      source_pointer: /review_sample_plan
      destination: intent
      destination_pointer: /sample_plan
    - source: work-evaluation
      source_pointer: /variant_id
      destination: intent
      destination_pointer: /variant/id
    - source: work-evaluation
      source_pointer: /parameters/review_variant/portable_intent
      destination: intent
      destination_pointer: /variant/portable_intent
    - source: work-evaluation
      source_pointer: /parameters/review_variant/target_options
      destination: target-options
      destination_pointer: ''
    input_retrieval_policy: available-only
    output_tags:
    - review-output
- id: stove0.video-archive/v1
  revision: 1
  input_tags:
  - stove0-video-archive
  event_input_closure: single-finalized-collection
  allow_derived_inputs: false
  source_retirement_policy: retire-after-verified-output
  retirement_grace_seconds: 86400
  observers:
  - registration_id: exiftool
    contract_id: stove0.media.metadata/v1
    artifact_rules:
    - glob: '*'
      role: stove0.media.source/v1
    retrieval_policy: allow
  routes:
  - id: archive-video
    operation_id: stove0.media.av1-opus-archive/v1
    target_registration_id: nvenc-av1-opus
    artifact_rules:
    - glob: '*'
      role: stove0.media.source/v1
    intent:
      audio_bitrate_kbps: 128
      codec: av1
      container: mkv
      quality: 23
      salvage: safe-remux
    target_options:
      preset: p4
    input_retrieval_policy: allow
    output_tags:
    - archive-video
