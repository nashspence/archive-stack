- id: stove0.review.sample-encode/v1
  intent_schema:
    id: stove0.review.sample-encode-intent/v1
    sha256: 9c1757fd841e4d40e438bcb1a0ac04bca21395306c577ffd6496547d7e2a5949
    document:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - sample_plan
      - variant
      properties:
        sample_plan:
          type: object
          required:
          - format
          - selection_method
          - samples_per_artifact
          - window_duration_ms
          - windows
          - sample_plan_sha256
          properties:
            format:
              const: stove0-review-sample-plan/v1
            selection_method:
              const: evenly-spaced/v1
            samples_per_artifact:
              type: integer
              minimum: 1
              maximum: 64
            window_duration_ms:
              type: integer
              minimum: 1
              maximum: 3600000
            windows:
              type: array
              minItems: 1
              maxItems: 8192
              items:
                type: object
                required:
                - artifact_id
                - start_ms
                - duration_ms
                properties:
                  artifact_id:
                    type: string
                    minLength: 1
                  start_ms:
                    type: integer
                    minimum: 0
                  duration_ms:
                    type: integer
                    minimum: 1
                additionalProperties: false
            sample_plan_sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
          additionalProperties: false
        variant:
          type: object
          required:
          - id
          - portable_intent
          properties:
            id:
              type: string
              pattern: ^[a-z0-9](?:[a-z0-9._-]{0,158}[a-z0-9])?$
            portable_intent:
              type: object
          additionalProperties: false
      additionalProperties: false
  inputs:
  - role: stove0.review.source/v1
    minimum: 1
    maximum: 128
    allowed_dispositions:
    - preserved
    - transformed
  outputs:
