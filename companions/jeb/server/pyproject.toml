[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jeb-server"
version = "0.1.0"
description = "Transport-neutral watched-drop collection and target submission."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
dependencies = [
  "argon2-cffi>=23,<26",
  "fastapi>=0.111,<1.0",
  "httpx>=0.27,<1.0",
  "jeb-cli-support>=0.1,<0.2",
  "jeb-protocol>=0.1,<0.2",
  "lifecycle-events>=0.1,<0.2",
  "media-preflight>=0.1,<0.2",
  "munchy-api-client>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "riverhog-cli-support>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
jeb-service = "jeb_api.cli:main"

[tool.uv.sources]
jeb-cli-support = { workspace = true }
jeb-protocol = { workspace = true }
lifecycle-events = { workspace = true }
media-preflight = { workspace = true }
munchy-api-client = { workspace = true }
riverhog-cli-support = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jeb_api", "src/jeb_core"]
