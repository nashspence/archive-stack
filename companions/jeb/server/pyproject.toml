[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "jeb-server"
version = "0.1.0"
description = "Payload-free event-driven Riverhog collection transformation controller."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "alembic>=1.18.5,<2.0",
  "argon2-cffi>=23,<26",
  "fastapi>=0.111,<1.0",
  "http-api-contracts>=0.1,<0.2",
  "httpx>=0.27,<1.0",
  "jeb-cli-support>=0.1,<0.2",
  "jeb-protocol>=0.1,<0.2",
  "lifecycle-events>=0.1,<0.2",
  "media-preflight>=0.1,<0.2",
  "munchy-api-client>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "riverhog-api-client>=0.1,<0.2",
  "riverhog-cli-support>=0.1,<0.2",
  "riverhog-protocol>=0.1,<0.2",
  "riverhog-provenance>=0.1,<0.2",
  "sqlalchemy>=2.0,<3.0",
  "starlette>=0.37,<2.0",
  "state-schema>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
jeb-service = "jeb_api.cli:main"

[tool.uv.sources]
http-api-contracts = { workspace = true }
jeb-cli-support = { workspace = true }
jeb-protocol = { workspace = true }
lifecycle-events = { workspace = true }
media-preflight = { workspace = true }
munchy-api-client = { workspace = true }
riverhog-api-client = { workspace = true }
riverhog-cli-support = { workspace = true }
riverhog-protocol = { workspace = true }
riverhog-provenance = { workspace = true }
state-schema = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jeb_api", "src/jeb_core"]
