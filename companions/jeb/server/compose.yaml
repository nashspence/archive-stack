services:
  jeb-state:
    build:
      context: ../../..
      dockerfile: companions/jeb/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: jeb:dev
    restart: "no"
    environment:
      JEB_STATE_DIR: /state
      JEB_STATE_DB: /state/jeb.sqlite3
    command: ["jeb-service", "state", "upgrade"]
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing
      - type: bind
        source: ${JEB_STATE_HOST_DIR:-./runtime/state}
        target: /state

  jeb:
    build:
      context: ../../..
      dockerfile: companions/jeb/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: jeb:dev
    restart: unless-stopped
    depends_on:
      jeb-state:
        condition: service_completed_successfully
    environment:
      JEB_API_TOKEN: ${JEB_API_TOKEN:-jeb-development-api-token}
      JEB_HOST: 0.0.0.0
      JEB_PORT: "8081"
      JEB_LOG_LEVEL: ${JEB_LOG_LEVEL:-INFO}
      JEB_LANDING_DIR: /landing
      JEB_STATE_DIR: /state
      JEB_STATE_DB: /state/jeb.sqlite3
      JEB_BATCH_DIR: /landing/.jeb-batches
      JEB_INTERVAL: ${JEB_INTERVAL:-300s}
      JEB_PREFLIGHT_REPAIR: ${JEB_PREFLIGHT_REPAIR:-safe_remux}
      JEB_PREFLIGHT_REPAIR_ORIGINAL: ${JEB_PREFLIGHT_REPAIR_ORIGINAL:-keep_corrupt}
      JEB_PREFLIGHT_REPAIR_CORRUPT_DIR: /landing/_corrupt
      JEB_PREFLIGHT_REPAIR_FFMPEG: ${JEB_PREFLIGHT_REPAIR_FFMPEG:-ffmpeg}
      JEB_TUSD_BASE_URL: ${JEB_TUSD_BASE_URL:-http://jeb-tusd:1080/files/}
      JEB_TUS_STAGING_DIR: /landing/.ingress/tus
      JEB_TUS_INCOMPLETE_MAX_AGE: ${JEB_TUS_INCOMPLETE_MAX_AGE:-14d}
      JEB_FTP_PROJECTION: /state/ingress/ftp/passwd
      JEB_FTP_UID: ${JEB_FTP_UID:-1000}
      JEB_FTP_GID: ${JEB_FTP_GID:-1000}
      JEB_MUNCHY_URL: ${JEB_MUNCHY_URL:-http://munchy-server:8080}
      JEB_MUNCHY_TOKEN: ${JEB_MUNCHY_TOKEN:-}
      JEB_MUNCHY_ALLOW_INSECURE_HTTP: ${JEB_MUNCHY_ALLOW_INSECURE_HTTP:-false}
      JEB_MUNCHY_UPLOAD_WORKERS: ${JEB_MUNCHY_UPLOAD_WORKERS:-4}
      JEB_MUNCHY_UPLOAD_CHUNK_MIB: ${JEB_MUNCHY_UPLOAD_CHUNK_MIB:-64}
      JEB_MUNCHY_WAIT_FOR_SAFE_DELETE: ${JEB_MUNCHY_WAIT_FOR_SAFE_DELETE:-true}
      JEB_EVENT_SOURCE: ${JEB_EVENT_SOURCE:-urn:jeb}
      JEB_UPSTREAM_EVENT_POLL_SECONDS: ${JEB_UPSTREAM_EVENT_POLL_SECONDS:-5}
      JEB_EVENT_CONTEXT_RETENTION: ${JEB_EVENT_CONTEXT_RETENTION:-30d}
      JEB_EVENT_REPEAT_INTERVAL: ${JEB_EVENT_REPEAT_INTERVAL:-24h}
      JEB_EVENT_REPEAT_TIME: ${JEB_EVENT_REPEAT_TIME:-}
      JEB_EVENT_REPEAT_TIMEZONE: ${JEB_EVENT_REPEAT_TIMEZONE:-UTC}
    ports:
      - "${JEB_API_BIND_ADDR:-127.0.0.1}:${JEB_API_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import json, urllib.request;
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=5));
          assert payload['status'] == 'ok'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing
      - type: bind
        source: ${JEB_STATE_HOST_DIR:-./runtime/state}
        target: /state

  jeb-tusd:
    image: tusproject/tusd:v2.8.0@sha256:060f117d224d057a5f25be79b4a4535168a0901515cc20cd02f62d0b8e623f5f
    restart: unless-stopped
    depends_on:
      jeb:
        condition: service_healthy
      jeb-ingress-init:
        condition: service_completed_successfully
    command:
      - -host
      - 0.0.0.0
      - -port
      - "1080"
      - -base-path
      - /files/
      - -behind-proxy
      - -disable-download
      - -upload-dir
      - /landing/.ingress/tus
      - -hooks-http
      - http://jeb:8081/internal/ingress/tus/hooks
      - -hooks-http-forward-headers
      - Authorization
      - -hooks-enabled-events
      - pre-create,post-finish
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing

  jeb-ingress-init:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: "no"
    environment:
      JEB_TUS_STAGING_DIR: /landing/.ingress/tus
    command:
      - sh
      - -c
      - install -d -o 1000 -g 1000 -m 770 /landing/.ingress "$${JEB_TUS_STAGING_DIR}"
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing

  jeb-tus:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      - jeb
      - jeb-tusd
    ports:
      - "${JEB_INGRESS_BIND_ADDR:-127.0.0.1}:${JEB_TUS_PORT:-1081}:1081"
    volumes:
      - type: bind
        source: ./adapters/tus/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true

  jeb-ftp:
    image: stilliard/pure-ftpd:trixie-latest@sha256:12b5aeb1a371b789e77d0b6217434a7a5ded9a3b251d52dab1f2e85ccde4cbf8
    restart: unless-stopped
    depends_on:
      jeb:
        condition: service_healthy
    ports:
      - "${JEB_INGRESS_BIND_ADDR:-127.0.0.1}:${JEB_FTP_PORT:-21}:21"
      - "${JEB_INGRESS_BIND_ADDR:-127.0.0.1}:${JEB_FTP_PASSIVE_PORT_START:-30000}-${JEB_FTP_PASSIVE_PORT_END:-30039}:30000-30039"
    environment:
      FTP_PASSIVE_PORTS: ${JEB_FTP_PASSIVE_PORT_START:-30000}:${JEB_FTP_PASSIVE_PORT_END:-30039}
      JEB_FTP_MAX_CLIENTS: ${JEB_FTP_MAX_CLIENTS:-40}
      JEB_FTP_MAX_CONNECTIONS: ${JEB_FTP_MAX_CONNECTIONS:-8}
      JEB_FTP_PROJECTION: /state/ingress/ftp/passwd
      JEB_FTP_PUBLIC_HOST: ${JEB_FTP_PUBLIC_HOST:-127.0.0.1}
    volumes:
      - type: bind
        source: ./adapters/ftp/run-adapter.sh
        target: /usr/local/bin/run-jeb-ftp
        read_only: true
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing
      - type: bind
        source: ${JEB_STATE_HOST_DIR:-./runtime/state}
        target: /state
        read_only: true
    command: ["/usr/local/bin/run-jeb-ftp"]
