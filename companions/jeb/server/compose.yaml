services:
  jeb-state:
    build:
      context: ../../..
      dockerfile: companions/jeb/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: jeb:latest
    restart: "no"
    env_file:
      - ./config/jeb.env
    environment:
      JEB_API_TOKEN: ${JEB_API_TOKEN:-jeb-development-api-token}
      JEB_TUSD_BASE_URL: ${JEB_TUSD_BASE_URL:-http://jeb-tusd:1080/files/}
      JEB_MUNCHY_TOKEN: ${JEB_MUNCHY_TOKEN:-}
    command: ["jeb-service", "state", "upgrade"]
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing
      - type: bind
        source: ${JEB_STATE_HOST_DIR:-./runtime/state}
        target: /state

  jeb:
    build:
      context: ../../..
      dockerfile: companions/jeb/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: jeb:latest
    restart: unless-stopped
    depends_on:
      jeb-state:
        condition: service_completed_successfully
    env_file:
      - ./config/jeb.env
    environment:
      JEB_API_TOKEN: ${JEB_API_TOKEN:-jeb-development-api-token}
      JEB_HEALTH_HOST: 0.0.0.0
      JEB_HEALTH_PORT: "8081"
      JEB_TUSD_BASE_URL: ${JEB_TUSD_BASE_URL:-http://jeb-tusd:1080/files/}
      JEB_TUS_INCOMPLETE_MAX_AGE: ${JEB_TUS_INCOMPLETE_MAX_AGE:-14d}
      JEB_MUNCHY_TOKEN: ${JEB_MUNCHY_TOKEN:-}
      JEB_EVENT_SOURCE: ${JEB_EVENT_SOURCE:-urn:jeb}
      JEB_UPSTREAM_EVENT_POLL_SECONDS: ${JEB_UPSTREAM_EVENT_POLL_SECONDS:-5}
      JEB_EVENT_CONTEXT_RETENTION: ${JEB_EVENT_CONTEXT_RETENTION:-30d}
      JEB_EVENT_REPEAT_INTERVAL: ${JEB_EVENT_REPEAT_INTERVAL:-24h}
      JEB_EVENT_REPEAT_TIME: ${JEB_EVENT_REPEAT_TIME:-}
      JEB_EVENT_REPEAT_TIMEZONE: ${JEB_EVENT_REPEAT_TIMEZONE:-UTC}
    ports:
      - "${JEB_API_BIND_ADDR:-127.0.0.1}:${JEB_API_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import json, urllib.request;
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=5));
          assert payload['status'] == 'ok'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing
      - type: bind
        source: ${JEB_STATE_HOST_DIR:-./runtime/state}
        target: /state

  jeb-tusd:
    image: tusproject/tusd:v2.8.0
    restart: unless-stopped
    depends_on:
      jeb:
        condition: service_healthy
      jeb-ingress-init:
        condition: service_completed_successfully
    command:
      - -host
      - 0.0.0.0
      - -port
      - "1080"
      - -base-path
      - /files/
      - -behind-proxy
      - -disable-download
      - -upload-dir
      - /landing/.ingress/tus
      - -hooks-http
      - http://jeb:8081/internal/ingress/tus/hooks
      - -hooks-http-forward-headers
      - Authorization
      - -hooks-enabled-events
      - pre-create,post-finish
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing

  jeb-ingress-init:
    image: alpine:3.22
    restart: "no"
    command:
      - sh
      - -c
      - install -d -o 1000 -g 1000 -m 770 /landing/.ingress /landing/.ingress/tus
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing

  jeb-tus:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - jeb
      - jeb-tusd
    ports:
      - "${JEB_INGRESS_BIND_ADDR:-127.0.0.1}:${JEB_TUS_PORT:-1081}:1081"
    volumes:
      - type: bind
        source: ./adapters/tus/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true

  jeb-ftp:
    image: stilliard/pure-ftpd:trixie-latest
    restart: unless-stopped
    depends_on:
      jeb:
        condition: service_healthy
    ports:
      - "${JEB_INGRESS_BIND_ADDR:-127.0.0.1}:${JEB_FTP_PORT:-21}:21"
      - "${JEB_INGRESS_BIND_ADDR:-127.0.0.1}:${JEB_FTP_PASSIVE_PORT_START:-30000}-${JEB_FTP_PASSIVE_PORT_END:-30039}:30000-30039"
    environment:
      FTP_PASSIVE_PORTS: ${JEB_FTP_PASSIVE_PORT_START:-30000}:${JEB_FTP_PASSIVE_PORT_END:-30039}
      JEB_FTP_PUBLIC_HOST: ${JEB_FTP_PUBLIC_HOST:-127.0.0.1}
    volumes:
      - type: bind
        source: ./adapters/ftp/run-adapter.sh
        target: /usr/local/bin/run-jeb-ftp
        read_only: true
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing
      - type: bind
        source: ${JEB_STATE_HOST_DIR:-./runtime/state}
        target: /state
        read_only: true
    command: ["/usr/local/bin/run-jeb-ftp"]
