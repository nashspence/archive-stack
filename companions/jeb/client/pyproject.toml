[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "jeb-client"
version = "0.1.0"
description = "Command-line client for Jeb."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "httpx>=0.27,<1.0",
  "jeb-api-client>=0.1,<0.2",
  "jeb-cli-support>=0.1,<0.2",
  "jeb-protocol>=0.1,<0.2",
  "PyYAML>=6.0,<7.0",
  "riverhog-cli-support>=0.1,<0.2",
  "riverhog-provenance>=0.1,<0.2",
]

[project.scripts]
jeb = "jeb_cli.main:main"

[tool.uv.sources]
jeb-api-client = { workspace = true }
jeb-cli-support = { workspace = true }
jeb-protocol = { workspace = true }
riverhog-cli-support = { workspace = true }
riverhog-provenance = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jeb_cli"]
