[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-client"
version = "0.1.0"
description = "Command-line client for Munchy."
requires-python = ">=3.12"
dependencies = [
  "cli-support",
  "config-validation",
  "munchy-api-client",
  "munchy-workflows",
  "pydantic>=2.7,<3.0",
  "rich>=15.0,<16.0",
  "time-formats",
  "tus-transport",
  "typer>=0.12,<1.0",
]

[project.scripts]
munchy = "munchy_cli.main:main"

[tool.uv.sources]
cli-support = { workspace = true }
config-validation = { workspace = true }
munchy-api-client = { workspace = true }
munchy-workflows = { workspace = true }
time-formats = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_cli"]
