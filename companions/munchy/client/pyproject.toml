[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-client"
version = "0.1.0"
description = "Command-line client for Munchy."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "config-validation>=0.1,<0.2",
  "httpx>=0.27,<1.0",
  "munchy-api-client>=0.1,<0.2",
  "munchy-workflows>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "rich>=15.0,<16.0",
  "riverhog-cli-support>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "tus-transport>=0.1,<0.2",
  "typer>=0.12,<1.0",
]

[project.scripts]
munchy = "munchy_cli.main:main"

[tool.uv.sources]
config-validation = { workspace = true }
munchy-api-client = { workspace = true }
munchy-workflows = { workspace = true }
riverhog-cli-support = { workspace = true }
time-formats = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_cli"]
