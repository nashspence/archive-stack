schema_version: 1
kind: munchy.job
job:
  workflow_mode: review
  handoff:
    destination: rclone
    options:
      location: "review-remote:munchy/reviews/{template_id}/{route_id}/{profile_id}/{run_id}"
  review:
    clip_plan:
      target_seconds: 90
    sweep:
      route_ids:
        - example-camera-video
      quality: 24..36:4
      max_height:
        - 720
        - 1080
  routing:
    routes:
      - id: example-camera-video
        group: video
        when:
          path:
            suffix_in:
              - .mp4
              - .mov

profiles:
  example-camera:
    name: example-camera
    target_options:
      preset: p7
      tune: uhq
    archive:
      codec: av1
      container: webm
      quality: 36
      fps_mode: passthrough
      scale_flags: lanczos
      pix_fmt: p010le
      audio:
        codec: opus
        bitrate: 128k
        sample_rate: 48000
        channels: 2
        application: audio
        compression_level: 10
        vbr: "on"

groups:
  video:
    profile: example-camera
    output_mode: video
