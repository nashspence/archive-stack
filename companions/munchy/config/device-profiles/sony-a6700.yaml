schema_version: 1
kind: munchy.device_profile
id: sony-a6700
parameters:
  device_id:
    required: true
section:
  file_extensions:
  - .mp4
  - .xml
  - .jpg
  - .jpeg
  - .hif
  - .heif
  - .arw
  output_mode: preserve
  group: preserve
  encode_profile: false
  profiles:
    video-av1-webm:
      name: video-av1-webm
      target_options:
        preset: p7
        tune: uhq
      archive:
        codec: av1
        container: webm
        quality: 56
        pix_fmt: p010le
        fps_mode: passthrough
        scale_flags: lanczos
        audio:
          codec: opus
          bitrate: 128k
          sample_rate: 48000
          channels: 2
          application: audio
          compression_level: 10
          vbr: 'on'
  groups:
    preserve:
      output_mode: preserve
    video-av1-webm:
      output_mode: video
      profile: video-av1-webm
      max_parallel_encodes: 4
      eager_pipeline_batches: 1
  routing:
    sidecars:
      sony-xml:
        format: xml
        paths:
        - '{parent}/{stem}M01.XML'
        primary:
          all:
          - path:
              prefix: '{device_id}'
              basename_regex: ^C[0-9]{4}\.MP4$
        sidecar:
          path:
            suffix: .xml
        facts:
          source: exiftool
          tags:
          - NonRealTimeMetaCreationDateValue
          - NonRealTimeMetaDeviceManufacturer
          - NonRealTimeMetaDeviceModelName
          - NonRealTimeMetaAcquisitionRecordGroupName
          - NonRealTimeMetaAcquisitionRecordGroupItemName
          - NonRealTimeMetaAcquisitionRecordGroupItemValue
          - NonRealTimeMetaVideoFormatVideoFrameCaptureFps
          - NonRealTimeMetaVideoFormatVideoFrameVideoCodec
          extractors:
          - type: name_value
            name_tag: NonRealTimeMetaAcquisitionRecordGroupItemName
            value_tag: NonRealTimeMetaAcquisitionRecordGroupItemValue
            requires:
            - tag: NonRealTimeMetaAcquisitionRecordGroupName
              contains: ExifGPS
            fields:
              Latitude: exif.gps_latitude
              LatitudeRef: exif.gps_latitude_ref
              Longitude: exif.gps_longitude
              LongitudeRef: exif.gps_longitude_ref
    gates:
      '{device_id}-native':
        all:
        - path:
            prefix: '{device_id}'
        - any:
          - fact: exif.model
            equals: ILCE-6700
          - path:
              basename_regex: ^C[0-9]{4}\.MP4$
      '{device_id}-video-xml-native':
        all:
        - path:
            prefix: '{device_id}'
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_device_manufacturer
          equals: Sony
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_device_model_name
          equals: ILCE-6700
      '{device_id}-video-xml-4k':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_video_codec
          contains: _3840_2160_
      '{device_id}-video-xml-1080p':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_video_codec
          contains: _1920_1080_
      '{device_id}-video-xml-24':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_capture_fps
          equals: 23.98p
      '{device_id}-video-xml-30':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_capture_fps
          equals: 29.97p
      '{device_id}-video-xml-60':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_capture_fps
          equals: 59.94p
      '{device_id}-video-xml-120':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_capture_fps
          equals: 119.88p
      '{device_id}-video-xml-h264-422-10bit-intra':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_video_codec
          regex: ^AVC[0-9]*_.*_H422IP@
      '{device_id}-video-xml-h264-422-10bit':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_video_codec
          regex: ^AVC[0-9]*_.*_H422P@
      '{device_id}-video-xml-h264-420-8bit':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_video_codec
          regex: ^AVC_.*_HP@
      '{device_id}-video-xml-hevc-422-10bit':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_video_codec
          regex: ^HEVC_.*_M42210P@
      '{device_id}-video-xml-hevc-420-10bit':
        all:
        - fact: sidecars.sony-xml.facts.exiftool.tags.non_real_time_meta_video_format_video_frame_video_codec
          regex: ^HEVC_.*_M10P@
      '{device_id}-photo-heif':
        all:
        - gate: '{device_id}-native'
        - path:
            suffix_in:
            - .hif
            - .heif
        - any:
          - fact: exiftool.tags.jpeg_heif_switch
            equals: HEIF
          - fact: exif.mime_type
            equals: image/heif
      '{device_id}-photo-heif-420':
        all:
        - gate: '{device_id}-photo-heif'
        - fact: exiftool.tags.quick_time_chroma_format
          equals: '4:2:0'
      '{device_id}-photo-heif-422':
        all:
        - gate: '{device_id}-photo-heif'
        - fact: exiftool.tags.quick_time_chroma_format
          equals: '4:2:2'
    routes:
    - id: sony-thumbnail-held
      action: leave
      when:
        all:
        - path:
            prefix: '{device_id}/private/M4ROOT/THMBNL'
        - path:
            suffix_in:
            - .jpg
            - .jpeg
            - .JPG
            - .JPEG
    - id: sony-media-index-xml-held
      action: leave
      when:
        all:
        - path:
            prefix: '{device_id}/private/M4ROOT'
            basename_regex: ^MEDIAPRO\.XML$
    - id: sidecar-xml-orphan
      group: preserve
      into: sidecar/xml-orphan
      when:
        all:
        - path:
            prefix: '{device_id}'
            basename_regex: ^C[0-9]{4}M01\.XML$
    - id: photo-raw-arw-lossless-compressed
      group: preserve
      into: photo/raw-arw/lossless-compressed
      when:
        all:
        - path:
            prefix: '{device_id}'
            suffix: .arw
        - fact: exiftool.tags.raw_file_type
          equals: Lossless Compressed RAW
    - id: photo-raw-arw-compressed
      group: preserve
      into: photo/raw-arw/compressed
      when:
        all:
        - path:
            prefix: '{device_id}'
            suffix: .arw
        - fact: exiftool.tags.raw_file_type
          equals: Compressed RAW
    - id: photo-jpeg-extra-fine
      group: preserve
      into: photo/jpeg/extra-fine
      when:
        all:
        - path:
            prefix: '{device_id}'
            suffix: .jpg
        - fact: exiftool.tags.quality
          equals: Extra Fine
    - id: photo-jpeg-fine
      group: preserve
      into: photo/jpeg/fine
      when:
        all:
        - path:
            prefix: '{device_id}'
            suffix: .jpg
        - fact: exiftool.tags.quality
          equals: Fine
    - id: photo-jpeg-standard
      group: preserve
      into: photo/jpeg/standard
      when:
        all:
        - path:
            prefix: '{device_id}'
            suffix: .jpg
        - fact: exiftool.tags.quality
          equals: Standard
    - id: photo-jpeg-light
      group: preserve
      into: photo/jpeg/light
      when:
        all:
        - path:
            prefix: '{device_id}'
