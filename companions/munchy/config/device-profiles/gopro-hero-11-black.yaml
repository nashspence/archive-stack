schema_version: 1
kind: munchy.device_profile
id: gopro-hero-11-black
parameters:
  device_id:
    required: true
section:
  file_extensions:
  - .mp4
  - .lrv
  - .thm
  - .jpg
  - .jpeg
  - .gpr
  - .sav
  output_mode: preserve
  group: preserve
  groups:
    preserve:
      output_mode: preserve
    preserve-no-metadata:
      output_mode: preserve
      metadata_projection: false
  routing:
    extra_exiftool_tags:
    - AutoBoostScore
    - BitrateSetting
    - ElectronicImageStabilization
    - ElectronicStabilizationOn
    - FieldOfView
    - HDRSetting
    - PhotoResolution
    sidecars:
      thm:
        format: thm
        paths:
        - '{parent}/{stem}.THM'
        primary:
          all:
          - path:
              prefix: '{device_id}'
              basename_regex: ^GX[0-9]{6}\.MP4$
        sidecar:
          path:
            suffix: .thm
      gpr:
        format: gpr
        paths:
        - '{parent}/{stem}.GPR'
        primary:
          all:
          - path:
              prefix: '{device_id}'
              basename_regex: ^GOPR[0-9]{4}\.JPG$
        sidecar:
          path:
            suffix: .gpr
    gates:
      gopro-hero11:
        all:
        - path:
            prefix: '{device_id}'
        - fact: exif.model
          equals: HERO11 Black
    routes:
    - id: lrv-proxy
      group: preserve
      into: proxy/lrv
      when:
        all:
        - gate: gopro-hero11
        - path:
            suffix: .lrv
    - id: thm-orphan
      group: preserve
      into: sidecar/thm-orphan
      when:
        all:
        - path:
            prefix: '{device_id}'
            suffix: .thm
    - id: gpr-orphan
      group: preserve
      into: raw/gpr-orphan
      when:
        all:
        - gate: gopro-hero11
        - path:
            suffix: .gpr
    - id: device-state-sav
      group: preserve-no-metadata
      into: device-state/sav
      when:
        all:
        - path:
            prefix: '{device_id}'
            basename_regex: ^leinfo\.sav$
    - id: photo-raw-jpeg-with-gpr
      group: preserve
      into: photo/raw/jpeg
      when:
        all:
        - gate: gopro-hero11
        - path:
            basename_regex: ^GOPR[0-9]{4}\.(JPG|jpg|JPEG|jpeg)$
        - fact: sidecar.gpr.path
          exists: true
    - id: photo-linear-standard-jpeg
      group: preserve
      into: photo/linear/standard-jpeg
      when:
        all:
        - gate: gopro-hero11
        - path:
            basename_regex: ^GOPR[0-9]{4}\.(JPG|jpg|JPEG|jpeg)$
        - fact: exiftool.tags.field_of_view
          equals: Linear
        - fact: exiftool.tags.hdr_setting
          equals: 'OFF'
    - id: photo-linear-hdr-or-superphoto-jpeg
      group: preserve
      into: photo/linear/hdr-or-superphoto-jpeg
      when:
        all:
        - gate: gopro-hero11
        - path:
            basename_regex: ^GOPR[0-9]{4}\.(JPG|jpg|JPEG|jpeg)$
        - fact: exiftool.tags.field_of_view
          equals: Linear
        - fact: exiftool.tags.hdr_setting
          equals: S_STILL
    - id: photo-wide-standard-jpeg
      group: preserve
      into: photo/wide/standard-jpeg
      when:
        all:
        - gate: gopro-hero11
        - path:
            basename_regex: ^GOPR[0-9]{4}\.(JPG|jpg|JPEG|jpeg)$
        - fact: exiftool.tags.field_of_view
          equals: Wide
        - fact: exiftool.tags.hdr_setting
          equals: 'OFF'
    - id: photo-wide-hdr-or-superphoto-jpeg
      group: preserve
      into: photo/wide/hdr-or-superphoto-jpeg
      when:
        all:
        - gate: gopro-hero11
        - path:
            basename_regex: ^GOPR[0-9]{4}\.(JPG|jpg|JPEG|jpeg)$
        - fact: exiftool.tags.field_of_view
          equals: Wide
        - fact: exiftool.tags.hdr_setting
          equals: S_STILL
    - id: photo-jpeg
      group: preserve
      into: photo/jpeg
      when:
        all:
        - gate: gopro-hero11
        - path:
            basename_regex: ^GOPR[0-9]{4}\.(JPG|jpg|JPEG|jpeg)$
    - id: video-1080p24-hevc
      group: preserve
      into: video/1080p24-hevc
      when:
        all:
        - gate: gopro-hero11
        - path:
            basename_regex: ^GX[0-9]{6}\.MP4$
        - fact: video.resolution
          equals: 1080p
        - fact: video.fps
          equals: 24
        - fact: video.codec
