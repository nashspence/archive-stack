schema_version: 1
kind: munchy.device_profile
id: reolink-duo-3v-poe
parameters:
  device_id:
    required: true
  camera_name:
    required: true
  timezone:
    required: true
section:
  video_extensions:
  - .mp4
  file_include_globs:
  - RecM*.mp4
  - '{camera_name}_00_*.mp4'
  group: '{device_id}-video'
  output_mode: video
  tasks:
  - archive_video
  encode_profile:
    schema_version: 1
    target: munchy-av1-nvenc
    name: '{device_id}-collection-archive'
    target_options:
      preset: p7
      tune: uhq
    archive:
      codec: av1
      container: webm
      quality: 53
      max_height: 720
      fps_mode: passthrough
      scale_flags: lanczos
      pix_fmt: p010le
      audio:
        codec: opus
        bitrate: 28k
        sample_rate: 24000
        channels: 1
        application: audio
        frame_duration: 40
        cutoff: 12000
        compression_level: 10
        vbr: 'on'
  groups:
    '{device_id}-video':
      metadata_projection:
        device:
          make: Reolink
          model: Duo 3V PoE
        capture_date_sources:
        - type: embedded
        - type: path_regex
          name: reolink_camera_filename
          pattern: (?:^|/)[^/]+_[0-9]+_(?P<stamp>[0-9]{14})\.mp4$
          datetime_group: stamp
          format: '%Y%m%d%H%M%S'
          timezone: '{timezone}'
        - type: path_regex
          name: reolink_rec_filename
          pattern: (?:^|/)Rec[MS][0-9A-F]+(?:_DST)?(?P<date>[0-9]{8})_(?P<time>[0-9]{6})_[0-9]{6}_.*\.mp4$
          template: '{date}{time}'
          format: '%Y%m%d%H%M%S'
          timezone: '{timezone}'
  routing:
    routes:
    - id: '{device_id}-main-video'
      group: '{device_id}-video'
      into: '{device_id}/video/main'
      when:
        any:
        - path:
            prefix: '{device_id}'
            filename_glob: RecM*.mp4
        - path:
            prefix: '{device_id}'
            filename_glob: '{camera_name}_00_*.mp4'
