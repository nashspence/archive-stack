services:
  munchy-state:
    build:
      context: ../../..
      dockerfile: companions/munchy/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: munchy-server:dev
    restart: "no"
    command: ["munchy-server", "state", "upgrade"]
    environment:
      MUNCHY_STATE_DB: ${MUNCHY_STATE_DB:-/state/munchy.sqlite3}
    volumes:
      - ${MUNCHY_STATE_HOST_DIR:-./runtime/state}:/state

  munchy-server:
    build:
      context: ../../..
      dockerfile: companions/munchy/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: munchy-server:dev
    container_name: munchy-server
    network_mode: host
    restart: unless-stopped
    mem_limit: "2g"
    memswap_limit: "2g"
    stop_grace_period: 30s
    depends_on:
      munchy-state:
        condition: service_completed_successfully

    environment:
      MUNCHY_HOST: ${MUNCHY_HOST:-127.0.0.1}
      MUNCHY_PORT: ${MUNCHY_PORT:-8092}
      MUNCHY_STATE_DIR: /state
      MUNCHY_WORK_DIR: /work
      MUNCHY_TUSD_DIR: /tusd
      MUNCHY_TUSD_INTERNAL_BASE_URL: ${MUNCHY_TUSD_INTERNAL_BASE_URL:-http://127.0.0.1:8093/files}
      MUNCHY_TUSD_PUBLIC_BASE_URL: ${MUNCHY_TUSD_PUBLIC_BASE_URL:-http://127.0.0.1:8093/files}
      MUNCHY_TUSD_PUBLIC_SIGNING_SECRET: ${MUNCHY_TUSD_PUBLIC_SIGNING_SECRET:?MUNCHY_TUSD_PUBLIC_SIGNING_SECRET is required}
      MUNCHY_TUSD_PUBLIC_URL_TTL_SECONDS: ${MUNCHY_TUSD_PUBLIC_URL_TTL_SECONDS:-86400}
      MUNCHY_TUSD_HOOK_SECRET: ${MUNCHY_TUSD_HOOK_SECRET:-dev-munchy-server-hook-secret}
      MUNCHY_ADMIN_TOKEN: ${MUNCHY_ADMIN_TOKEN:-}
      MUNCHY_APPLICATION_AUTH_REQUIRED: ${MUNCHY_APPLICATION_AUTH_REQUIRED:-1}
      MUNCHY_STATE_DB: ${MUNCHY_STATE_DB:-/state/munchy.sqlite3}
      MUNCHY_DIAGNOSTIC_DIR: ${MUNCHY_DIAGNOSTIC_DIR:-/state/diagnostics}
      MUNCHY_LOG_LEVEL: ${MUNCHY_LOG_LEVEL:-INFO}
      MUNCHY_HTTPX_LOG_LEVEL: ${MUNCHY_HTTPX_LOG_LEVEL:-WARNING}
      MUNCHY_UVICORN_LOG_LEVEL: ${MUNCHY_UVICORN_LOG_LEVEL:-info}
      MUNCHY_GPU_RUNTIME_DIR: /gpu-runtime/munchy-av1-nvenc
      MUNCHY_GPU_MANAGER_URL: ${MUNCHY_GPU_MANAGER_URL:-http://127.0.0.1:8080}
      MUNCHY_GPU_TARGET_URL: ${MUNCHY_GPU_TARGET_URL:-http://127.0.0.1:8000}
      MUNCHY_GPU_TARGET: ${MUNCHY_GPU_TARGET:-munchy-av1-nvenc}
      MUNCHY_GPU_LEASE_TTL_S: ${MUNCHY_GPU_LEASE_TTL_S:-28800}
      MUNCHY_GPU_WAIT_S: ${MUNCHY_GPU_WAIT_S:-300}
      MUNCHY_GPU_REPOST_SECONDS: ${MUNCHY_GPU_REPOST_SECONDS:-120}
      MUNCHY_MIN_FREE_BYTES: ${MUNCHY_MIN_FREE_BYTES:-10737418240}
      MUNCHY_GPU_SCRATCH_MULTIPLIER: ${MUNCHY_GPU_SCRATCH_MULTIPLIER:-2.5}
      MUNCHY_EAGER_ARCHIVE_SCRATCH_MULTIPLIER: ${MUNCHY_EAGER_ARCHIVE_SCRATCH_MULTIPLIER:-0.5}
      MUNCHY_REVIEW_SCRATCH_EXTRA_MULTIPLIER: ${MUNCHY_REVIEW_SCRATCH_EXTRA_MULTIPLIER:-0.35}
      MUNCHY_BUFFERED_HANDOFF_SCRATCH_EXTRA_MULTIPLIER: ${MUNCHY_BUFFERED_HANDOFF_SCRATCH_EXTRA_MULTIPLIER:-1.25}
      MUNCHY_MAX_ACTIVE_INPUT_UPLOADS: ${MUNCHY_MAX_ACTIVE_INPUT_UPLOADS:-8}
      MUNCHY_MAX_RUNNING_JOBS: ${MUNCHY_MAX_RUNNING_JOBS:-1}
      MUNCHY_HANDOFF_ATTEMPTS: ${MUNCHY_HANDOFF_ATTEMPTS:-3}
      MUNCHY_RESUME_ON_START: ${MUNCHY_RESUME_ON_START:-1}
      MUNCHY_LOCAL_CLEANUP_MIN_AGE_HOURS: ${MUNCHY_LOCAL_CLEANUP_MIN_AGE_HOURS:-24}
      MUNCHY_INPUT_UPLOAD_TTL_HOURS: ${MUNCHY_INPUT_UPLOAD_TTL_HOURS:-24}
      MUNCHY_ORPHAN_INPUT_UPLOAD_TTL_HOURS: ${MUNCHY_ORPHAN_INPUT_UPLOAD_TTL_HOURS:-24}
      MUNCHY_CLEANUP_INTERVAL_SECONDS: ${MUNCHY_CLEANUP_INTERVAL_SECONDS:-3600}
      MUNCHY_TERMINAL_JOB_RETENTION: ${MUNCHY_TERMINAL_JOB_RETENTION:-90d}
      MUNCHY_JOB_DIAGNOSTIC_RETENTION: ${MUNCHY_JOB_DIAGNOSTIC_RETENTION:-30d}
      MUNCHY_EAGER_ARCHIVE_BATCH_FILES: ${MUNCHY_EAGER_ARCHIVE_BATCH_FILES:-32}
      MUNCHY_EAGER_ARCHIVE_PIPELINE_BATCHES: ${MUNCHY_EAGER_ARCHIVE_PIPELINE_BATCHES:-3}
      MUNCHY_EAGER_ARCHIVE_WAIT_SECONDS: ${MUNCHY_EAGER_ARCHIVE_WAIT_SECONDS:-5}
      MUNCHY_AUDIO_ARCHIVE_WORKERS: ${MUNCHY_AUDIO_ARCHIVE_WORKERS:-2}
      MUNCHY_AUDIO_BITRATE: ${MUNCHY_AUDIO_BITRATE:-128k}
      MUNCHY_STORAGE_WAIT_SECONDS: ${MUNCHY_STORAGE_WAIT_SECONDS:-60}
      MUNCHY_RIVERHOG_HANDOFF_ENABLED: ${MUNCHY_RIVERHOG_HANDOFF_ENABLED:-0}
      MUNCHY_RIVERHOG_FINALIZE_POLL_SECONDS: ${MUNCHY_RIVERHOG_FINALIZE_POLL_SECONDS:-5}
      RIVERHOG_BASE_URL: ${RIVERHOG_BASE_URL:-}
      RIVERHOG_ALLOW_INSECURE_HTTP: ${RIVERHOG_ALLOW_INSECURE_HTTP:-false}
      RIVERHOG_TOKEN: ${RIVERHOG_TOKEN:-}
      RIVERHOG_HOST_HEADER: ${RIVERHOG_HOST_HEADER:-}
      RIVERHOG_HTTP_TIMEOUT_SECONDS: ${RIVERHOG_HTTP_TIMEOUT_SECONDS:-30}
      RIVERHOG_HTTP2: ${RIVERHOG_HTTP2:-false}
      RIVERHOG_UPLOAD_FILE_CONCURRENCY: ${RIVERHOG_UPLOAD_FILE_CONCURRENCY:-8}
      RIVERHOG_UPLOAD_TIMEOUT_SECONDS: ${RIVERHOG_UPLOAD_TIMEOUT_SECONDS:-1800}
      MUNCHY_UPSTREAM_EVENT_POLL_SECONDS: ${MUNCHY_UPSTREAM_EVENT_POLL_SECONDS:-5}
      MUNCHY_EVENT_SOURCE: ${MUNCHY_EVENT_SOURCE:-urn:munchy}
      MUNCHY_EVENT_CONTEXT_RETENTION: ${MUNCHY_EVENT_CONTEXT_RETENTION:-30d}
      MUNCHY_EVENT_REPEAT_INTERVAL: ${MUNCHY_EVENT_REPEAT_INTERVAL:-24h}
      MUNCHY_EVENT_REPEAT_TIME: ${MUNCHY_EVENT_REPEAT_TIME:-}
      MUNCHY_EVENT_REPEAT_TIMEZONE: ${MUNCHY_EVENT_REPEAT_TIMEZONE:-UTC}
      MUNCHY_EXTERNAL_HANDOFF_ENABLED: ${MUNCHY_EXTERNAL_HANDOFF_ENABLED:-1}
      MUNCHY_COMMAND_HANDOFF_COMMAND: ${MUNCHY_COMMAND_HANDOFF_COMMAND:-}
      MUNCHY_RCLONE_HANDOFF_COMMAND: ${MUNCHY_RCLONE_HANDOFF_COMMAND:-rclone}
      RCLONE_CONFIG: ${MUNCHY_RCLONE_CONFIG:-/rclone/rclone.conf}
      MUNCHY_HANDOFF_RETRY_INITIAL_SECONDS: ${MUNCHY_HANDOFF_RETRY_INITIAL_SECONDS:-30}
      MUNCHY_HANDOFF_RETRY_MAX_SECONDS: ${MUNCHY_HANDOFF_RETRY_MAX_SECONDS:-3600}
      TZ: ${TZ:-UTC}

    volumes:
      - ${MUNCHY_STATE_HOST_DIR:-./runtime/state}:/state
      - ${MUNCHY_WORK_HOST_DIR:-./runtime/work}:/work
      - ${MUNCHY_TUSD_HOST_DIR:-./runtime/tusd}:/tusd
      - ${MUNCHY_RCLONE_HOST_DIR:-./runtime/rclone}:/rclone:ro
      - ${MUNCHY_GPU_RUNTIME_HOST_DIR:-./runtime/gpu-targets}:/gpu-runtime

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${MUNCHY_PORT:-8092}/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  munchy-server-tusd:
    image: tusproject/tusd:v2.8.0@sha256:060f117d224d057a5f25be79b4a4535168a0901515cc20cd02f62d0b8e623f5f
    container_name: munchy-server-tusd
    network_mode: host
    user: "0:0"
    restart: unless-stopped
    command:
      - "-host"
      - "127.0.0.1"
      - "-port"
      - "8093"
      - "-base-path"
      - "/files/"
      - "-upload-dir"
      - "/uploads"
      - "-hooks-http"
      - "http://127.0.0.1:8092/internal/tusd/hooks"
      - "-hooks-http-forward-headers"
      - "X-Munchy-Tusd-Hook-Secret"
      - "-hooks-enabled-events"
      - "pre-create,post-finish"
    volumes:
      - ${MUNCHY_TUSD_HOST_DIR:-./runtime/tusd}:/uploads

  munchy-server-lan-gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: munchy-server-lan-gateway
    network_mode: host
    restart: unless-stopped
    depends_on:
      - munchy-server
      - munchy-server-tusd
    environment:
      MUNCHY_GATEWAY_BIND_ADDR: ${MUNCHY_GATEWAY_BIND_ADDR:-127.0.0.1}
      MUNCHY_GATEWAY_API_PORT: ${MUNCHY_GATEWAY_API_PORT:-8092}
      MUNCHY_GATEWAY_TUSD_PORT: ${MUNCHY_GATEWAY_TUSD_PORT:-8093}
      MUNCHY_GATEWAY_API_UPSTREAM_ADDR: ${MUNCHY_GATEWAY_API_UPSTREAM_ADDR:-127.0.0.1:8092}
      MUNCHY_GATEWAY_TUSD_UPSTREAM_ADDR: ${MUNCHY_GATEWAY_TUSD_UPSTREAM_ADDR:-127.0.0.1:8093}
      MUNCHY_TUSD_PUBLIC_SIGNING_SECRET: ${MUNCHY_TUSD_PUBLIC_SIGNING_SECRET:?MUNCHY_TUSD_PUBLIC_SIGNING_SECRET is required}
      NGINX_ENVSUBST_FILTER: ^(MUNCHY_GATEWAY_(BIND_ADDR|API_PORT|TUSD_PORT|API_UPSTREAM_ADDR|TUSD_UPSTREAM_ADDR)|MUNCHY_TUSD_PUBLIC_SIGNING_SECRET)$
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./config/nginx-lan-gateway.conf:/etc/nginx/templates/nginx.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
