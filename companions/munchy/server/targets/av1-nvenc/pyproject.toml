[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-av1-nvenc-target"
version = "0.1.0"
description = "Munchy AV1 NVENC execution target."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "munchy-target-support>=0.1,<0.2",
  "munchy-workflows>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "time-formats>=0.1,<0.2",
  "uvicorn[standard]>=0.52.1,<1.0",
]

[project.scripts]
munchy-av1-nvenc = "munchy_av1_nvenc.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_av1_nvenc"]
