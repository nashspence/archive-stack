worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format riverhog_transfer '$remote_addr [$time_local] '
        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
        'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout riverhog_transfer;
    error_log /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 30s;
    client_max_body_size 0;

    upstream munchy_server_api {
        server ${MUNCHY_GATEWAY_API_UPSTREAM_ADDR};
    }

    upstream munchy_server_tusd {
        server ${MUNCHY_GATEWAY_TUSD_UPSTREAM_ADDR};
    }

    server {
        listen ${MUNCHY_GATEWAY_BIND_ADDR}:${MUNCHY_GATEWAY_API_PORT};

        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        location / {
            proxy_pass http://munchy_server_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen ${MUNCHY_GATEWAY_BIND_ADDR}:${MUNCHY_GATEWAY_TUSD_PORT};

        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        location / {
            secure_link $arg_md5,$arg_expires;
            secure_link_md5 "$secure_link_expires$uri ${MUNCHY_TUSD_PUBLIC_SIGNING_SECRET}";
            if ($secure_link = "") { return 403; }
            if ($secure_link = "0") { return 410; }

            proxy_pass http://munchy_server_tusd;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
