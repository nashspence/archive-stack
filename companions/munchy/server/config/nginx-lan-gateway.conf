worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format riverhog_transfer '$remote_addr [$time_local] '
        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
        'rl=$request_length rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout riverhog_transfer;
    error_log /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 30s;
    client_max_body_size 0;

    upstream munchy_server_api {
        server ${MUNCHY_GATEWAY_API_UPSTREAM_ADDR};
    }

    upstream munchy_server_tusd {
        server ${MUNCHY_GATEWAY_TUSD_UPSTREAM_ADDR};
    }

    server {
        listen ${MUNCHY_GATEWAY_BIND_ADDR}:${MUNCHY_GATEWAY_API_PORT};

        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        location / {
            proxy_pass http://munchy_server_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen ${MUNCHY_GATEWAY_BIND_ADDR}:${MUNCHY_GATEWAY_TUSD_PORT};

        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        location = /_munchy_tusd_authorize {
            internal;
            proxy_pass http://munchy_server_api/internal/tusd/authorize;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Munchy-Tusd-Original-Uri $request_uri;
        }

        location / {
            auth_request /_munchy_tusd_authorize;

            proxy_pass http://munchy_server_tusd;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
