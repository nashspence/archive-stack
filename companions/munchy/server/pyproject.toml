[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-server"
version = "0.1.0"
description = "Media ingest, routing, transformation, and destination handoff."
requires-python = ">=3.12"
dependencies = [
  "application-access>=0.1,<0.2",
  "argon2-cffi>=23,<26",
  "config-validation>=0.1,<0.2",
  "fastapi>=0.111,<1.0",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.25,<5.0",
  "lifecycle-events>=0.1,<0.2",
  "munchy-api-client>=0.1,<0.2",
  "munchy-config>=0.1,<0.2",
  "munchy-target-support>=0.1,<0.2",
  "munchy-workflows>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "riverhog-api-client>=0.1,<0.2",
  "riverhog-protocol>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "tus-transport>=0.1,<0.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
munchy-server = "munchy_server.main:main"
munchy-av1-nvenc = "munchy_av1_nvenc.main:main"

[tool.uv.sources]
application-access = { workspace = true }
config-validation = { workspace = true }
lifecycle-events = { workspace = true }
munchy-api-client = { workspace = true }
munchy-config = { workspace = true }
munchy-target-support = { workspace = true }
munchy-workflows = { workspace = true }
riverhog-api-client = { workspace = true }
riverhog-protocol = { workspace = true }
time-formats = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = [
  "src/munchy",
  "src/munchy_av1_nvenc",
  "src/munchy_server",
]
