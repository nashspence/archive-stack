[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-storage-adapter-backblaze"
version = "0.1.0"
description = "Backblaze B2 storage adapter for Riverhog."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "riverhog-storage-adapter-asgi-support>=0.1,<0.2",
  "riverhog-storage-adapter-s3-support>=0.1,<0.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
riverhog-storage-adapter-backblaze = "riverhog_storage_adapter_backblaze.app:main"

[tool.uv.sources]
riverhog-storage-adapter-asgi-support = { workspace = true }
riverhog-storage-adapter-s3-support = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_storage_adapter_backblaze"]
