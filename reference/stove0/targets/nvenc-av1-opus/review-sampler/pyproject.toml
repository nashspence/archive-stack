[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "stove0-nvenc-av1-opus-review-sampler"
version = "0.1.0"
description = "Optional nonnormative NVENC AV1 and Opus review-sampler reference for Stove0."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
readme = { text = "Optional nonnormative Riverhog v1 reference component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "fastapi>=0.111,<1.0",
  "http-api-contracts>=0.1,<0.2",
  "stove0-media-archive-target-contracts>=0.1,<0.2",
  "stove0-review-target-contracts>=0.1,<0.2",
  "stove0-review-sampler-protocol>=0.1,<0.2",
  "stove0-review-sampler-support>=0.1,<0.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
stove0-nvenc-av1-opus-review-sampler = "stove0_nvenc_av1_opus_review_sampler.app:main"

[tool.uv.sources]
http-api-contracts = { workspace = true }
stove0-media-archive-target-contracts = { workspace = true }
stove0-review-target-contracts = { workspace = true }
stove0-review-sampler-protocol = { workspace = true }
stove0-review-sampler-support = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stove0_nvenc_av1_opus_review_sampler"]
