[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "stove0-media-archive-target-support"
version = "0.1.0"
description = "Optional nonnormative projection support for Stove0 media-archive references."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Optional nonnormative Riverhog v1 reference component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "pydantic>=2.7,<3.0",
  "riverhog-protocol>=0.1,<0.2",
  "stove0-media-archive-target-contracts>=0.1,<0.2",
  "stove0-media-metadata-observer-contracts>=0.1,<0.2",
  "stove0-observer-protocol>=0.1,<0.2",
  "stove0-protocol>=0.1,<0.2",
  "stove0-target-protocol>=0.1,<0.2",
]

[tool.uv.sources]
riverhog-protocol = { workspace = true }
stove0-media-archive-target-contracts = { workspace = true }
stove0-media-metadata-observer-contracts = { workspace = true }
stove0-observer-protocol = { workspace = true }
stove0-protocol = { workspace = true }
stove0-target-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stove0_media_archive_target_support"]
