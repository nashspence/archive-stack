[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "gogurt-linux"
version = "0.1.0"
description = "Optional Linux mount and systemd reference implementation for Gogurt."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "gogurt-core>=0.1,<0.2",
  "gogurt-listener-runtime>=0.1,<0.2",
  "gogurt-path-volume-support>=0.1,<0.2",
]

[project.entry-points."gogurt.mounted-volume-providers"]
gogurt-linux = "gogurt_linux:MOUNTED_VOLUME_PROVIDER_BINDING"

[project.entry-points."gogurt.listener-host-providers"]
gogurt-linux = "gogurt_linux:LISTENER_HOST_PROVIDER_BINDING"

[tool.uv.sources]
gogurt-core = { workspace = true }
gogurt-listener-runtime = { workspace = true }
gogurt-path-volume-support = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/gogurt_linux"]
