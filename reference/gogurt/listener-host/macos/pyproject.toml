[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "gogurt-macos-listener-host"
version = "0.1.0"
description = "Optional nonnormative macOS launchd listener-host reference for Gogurt."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Optional nonnormative Riverhog v1 reference component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "gogurt-listener-runtime>=0.1,<0.2",
]

[project.entry-points."gogurt.listener-host-providers"]
gogurt-macos-listener-host = "gogurt_macos_listener_host:LISTENER_HOST_PROVIDER_BINDING"

[tool.uv.sources]
gogurt-listener-runtime = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/gogurt_macos_listener_host"]
