[job.riverhog]
enabled = true
wait = "finalized"

[job.notify]
enabled = false
recipients = ["operator"]

[profiles.example-camera]
name = "example-camera"

[profiles.example-camera.archive]
codec = "av1_nvenc"
container = "webm"
quality = 38
max_height = 720
fps_mode = "passthrough"
scale_flags = "lanczos"
pix_fmt = "p010le"
preset = "p7"
tune = "uhq"

[profiles.example-camera.archive.audio]
codec = "opus"
bitrate = "28k"
sample_rate = 24000
channels = 1
application = "audio"
frame_duration = 40
cutoff = 12000
compression_level = 10
vbr = "on"

[groups.video]
profile = "example-camera"
archive_mode = "av1_nvenc"

[groups.video.metadata_projection]
creators = ["Example Operator"]
tags = ["device/example-camera"]

[groups.video.metadata_projection.device]
make = "Example"
model = "Camera"

[groups.preserve]
archive_mode = "preserve"
metadata_projection = false

[[job.profile_routing.routes]]
id = "example-camera-video"
group = "video"
when = { path = { suffix_in = [".mp4", ".mov", ".mkv", ".webm"] } }

[[job.profile_routing.routes]]
id = "preserve-artifacts"
group = "preserve"
when = { path = { suffix_in = [".xml", ".json", ".txt", ".srt", ".vtt", ".nfo"] } }

[[job.profile_routing.routes]]
id = "all-preserve-review"
group = "preserve"
when = {}
