schema_version = 1
target = "munchy-av1-nvenc"
name = "example-camera"

[archive]
codec = "av1_nvenc"
container = "mkv"
quality = 49
max_height = 720
fps_mode = "passthrough"
scale_flags = "lanczos"
pix_fmt = "p010le"
preset = "p7"
tune = "uhq"

[archive.audio]
codec = "opus"
bitrate = "28k"
sample_rate = 24000
channels = 1
application = "audio"
frame_duration = 40
cutoff = 12000
compression_level = 10
vbr = "on"
