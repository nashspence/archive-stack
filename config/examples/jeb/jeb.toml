[collector]
interval = "5m"
state_db = "/state/jeb.sqlite3"
batch_dir = "/landing/.jeb-batches"
preflight_repair = "safe_remux"
preflight_repair_original = "keep_corrupt"
preflight_repair_corrupt_dir = "/landing/_corrupt"

[notify]
enabled = false
url_env = "JEB_WEBHOOK_URL"
base_url = "https://archive.example.invalid"
recipients = ["operator"]
timeout = "10s"
reminder_interval = "24h"

[targets.munchy]
type = "munchy"
url_env = "JEB_MUNCHY_URL"
upload_workers = 4
upload_chunk_mib = 64
wait_for_safe_delete = true

[profiles.security-camera]
schema_version = 1
target = "munchy-av1-nvenc"
name = "security-camera"

[profiles.security-camera.archive]
codec = "av1_nvenc"
container = "webm"
quality = 38
max_height = 720
fps_mode = "passthrough"
scale_flags = "lanczos"
pix_fmt = "p010le"
preset = "p7"
tune = "uhq"

[profiles.security-camera.archive.audio]
codec = "opus"
bitrate = "28k"
sample_rate = 24000
channels = 1
application = "audio"
frame_duration = 40
cutoff = 12000
compression_level = 10
vbr = "on"

[profile_groups.video]
profile = "security-camera"
archive_mode = "av1_nvenc"
gpu_tasks = ["archive_video"]

[profile_groups.passthrough]
archive_mode = "passthrough"

[munchy_job_defaults]
workflow_mode = "archive"
cleanup_local_on_success = false

[munchy_job_defaults.riverhog]
enabled = true

[munchy_job_defaults.notify]
enabled = true
recipients = ["operator"]

[[munchy_job_defaults.profile_routing.routes]]
id = "example-camera-video"
group = "video"
path_prefix = "example-camera"
suffixes = [".mp4", ".mov", ".mkv", ".webm"]

[[munchy_job_defaults.profile_routing.routes]]
id = "passthrough-artifacts"
group = "passthrough"
suffixes = [".xml", ".json", ".txt", ".srt", ".vtt", ".nfo"]

[[sources]]
id = "example-camera"
enabled = false
path = "/landing/example-camera"
upload_prefix = "example-camera"
stable_age = "10m"
include_extensions = [".mp4", ".mov", ".mkv", ".webm", ".xml", ".json", ".txt"]

[[collections]]
id = "weekly-device-artifacts"
enabled = true
collection_slug = "weekly-device-artifacts"
target = "munchy"
cleanup = "after_target_success"
schedule = "weekly"
weekday = "monday"
hour = 3
minute = 0
sources = ["example-camera"]
