schema_version: 1
kind: munchy.device_profile
id: pixel-8
parameters:
  device_id:
    required: true
section:
  file_extensions:
  - .jpg
  - .jpeg
  - .mp4
  archive_mode: preserve
  media_preflight: false
  profile_group: preserve
  groups:
    preserve:
      archive_mode: preserve
  routing:
    extra_exiftool_tags:
    - AndroidCaptureFPS
    - AndroidMake
    - AndroidModel
    - SpecialTypeID
    gates:
      pixel-8-native:
        all:
        - path:
            prefix: '{device_id}'
        - any:
          - fact: exif.make
            equals: google
          - fact: exiftool.tags.android_make
            equals: Google
        - any:
          - fact: exif.model
            equals: Pixel 8
          - fact: exiftool.tags.android_model
            equals: Pixel 8
    routes:
    - id: action-pan-cover-front-jpeg
      group: preserve
      into: action-pan/cover/front-jpeg
      when:
        all:
        - gate: pixel-8-native
        - path:
            basename_regex: ^PXL_[0-9]{8}_[0-9]{9}\.ACTION_PAN-01\.COVER\.(jpg|jpeg)$
        - fact: exif.camera_direction
          equals: front
    - id: action-pan-cover-rear-jpeg
      group: preserve
      into: action-pan/cover/rear-jpeg
      when:
        all:
        - gate: pixel-8-native
        - path:
            basename_regex: ^PXL_[0-9]{8}_[0-9]{9}\.ACTION_PAN-01\.COVER\.(jpg|jpeg)$
        - fact: exif.camera_direction
          equals: rear
    - id: action-pan-original-front-jpeg
      group: preserve
      into: action-pan/original/front-jpeg
      when:
        all:
        - gate: pixel-8-native
        - path:
            basename_regex: ^PXL_[0-9]{8}_[0-9]{9}\.ACTION_PAN-02\.ORIGINAL\.(jpg|jpeg)$
        - fact: exif.camera_direction
          equals: front
    - id: action-pan-original-rear-jpeg
      group: preserve
      into: action-pan/original/rear-jpeg
      when:
        all:
        - gate: pixel-8-native
        - path:
            basename_regex: ^PXL_[0-9]{8}_[0-9]{9}\.ACTION_PAN-02\.ORIGINAL\.(jpg|jpeg)$
        - fact: exif.camera_direction
          equals: rear
    - id: long-exposure-cover-front-jpeg
      group: preserve
      into: long-exposure/cover/front-jpeg
      when:
        all:
        - gate: pixel-8-native
        - path:
            basename_regex: ^PXL_[0-9]{8}_[0-9]{9}\.LONG_EXPOSURE-01\.COVER\.(jpg|jpeg)$
        - fact: exif.camera_direction
          equals: front
    - id: long-exposure-cover-rear-jpeg
      group: preserve
      into: long-exposure/cover/rear-jpeg
      when:
        all:
        - gate: pixel-8-native
        - path:
            basename_regex: ^PXL_[0-9]{8}_[0-9]{9}\.LONG_EXPOSURE-01\.COVER\.(jpg|jpeg)$
        - fact: exif.camera_direction
          equals: rear
    - id: long-exposure-original-front-jpeg
