    - id: pan-1080p30-hevc
      group: preserve
      into: pan/1080p30-hevc
      when:
        all:
        - gate: pixel-8-native
        - path:
            suffix: .mp4
        - fact: exiftool.tags.special_type_id
          contains: SpecialType-CINEMATIC
        - fact: video.resolution
          equals: 1080p
        - fact: video.fps
          equals: 30
        - fact: video.codec
          equals: hevc
    - id: pan-4k30-hevc
      group: preserve
