name: issue-522-build

on:
  push:
    branches:
      - issue-522-collection-boundary
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-522-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, 'Expand #522') &&
       !contains(github.event.head_commit.message, 'Implement collection-first'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Expand architectural seed
        id: seed
        shell: bash
        run: |
          if [[ -d .issue-522-seed ]]; then
            cat .issue-522-seed/part-* | base64 -d > /tmp/issue-522-seed.tar.gz
            echo "cb3fcf40f4cbe58fa84120dc8a5d4c1611cb62b7949060ad635d173f8736cea6  /tmp/issue-522-seed.tar.gz" | sha256sum -c -
            tar -xzf /tmp/issue-522-seed.tar.gz
            rm -rf .issue-522-seed .issue-522-seed.tar.gz
            echo "expanded=true" >> "$GITHUB_OUTPUT"
          else
            echo "expanded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist expanded seed
        if: steps.seed.outputs.expanded == 'true'
        shell: bash
        run: |
          git config user.name "OpenAI architectural handoff"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand #522 collection-boundary implementation seed"
          git push origin HEAD:issue-522-collection-boundary

      - name: Apply collection-boundary hard cut
        run: python scripts/issue_522_apply.py

      - name: Refresh exact workspace lock
        run: uv lock

      - name: Format and apply safe lint fixes
        shell: bash
        run: |
          uv run --locked --all-packages --group dev python -m ruff check --fix . || true
          uv run --locked --all-packages --group dev python -m ruff format .

      - name: Compile changed Python surfaces
        run: >-
          python -m compileall -q
          packages/riverhog-protocol/src
          packages/riverhog-api-client/src
          packages/munchy-api-client/src
          riverhog/server/src
          companions/jeb/server/src
          companions/munchy/server/src
          scripts

      - name: Run focused architecture tests
        run: >-
          uv run --locked --all-packages --group dev
          python -m pytest -q --import-mode=importlib
          packages/riverhog-protocol/tests/test_collection_workflow_contracts.py
          riverhog/server/tests/test_collection_workflows.py
          companions/jeb/tests/test_collection_controller.py
          companions/munchy/tests/test_collection_transforms.py

      - name: Run broad validation and retain results
        shell: bash
        run: |
          set +e
          : > ISSUE-522-VALIDATION.md
          {
            echo "# Issue 522 validation"
            echo
            echo "Base: a2cabb8af3c7d552ac7f484af06d4cf9dafa1c3d"
            echo "Workflow source: ${GITHUB_SHA}"
            echo
            echo "Focused collection-workflow tests: passed"
            echo
          } >> ISSUE-522-VALIDATION.md
          for target in lint compile unit spec; do
            echo "Running make ${target}"
            make "${target}" >"/tmp/issue-522-${target}.log" 2>&1
            status=$?
            {
              echo "## make ${target}"
              echo
              echo "Exit status: ${status}"
              echo
              echo '```text'
              tail -n 120 "/tmp/issue-522-${target}.log"
              echo '```'
              echo
            } >> ISSUE-522-VALIDATION.md
          done
          exit 0

      - name: Commit generated hard cut
        shell: bash
        run: |
          git config user.name "OpenAI architectural handoff"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Implement collection-first companion architecture for #522"
            git push origin HEAD:issue-522-collection-boundary
          fi

      - name: Build source archive and Git bundle
        shell: bash
        run: |
          mkdir -p /tmp/issue-522-artifacts
          git bundle create /tmp/issue-522-artifacts/riverhog-issue-522.bundle HEAD
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=.pytest_cache \
            --exclude=.ruff_cache \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            --exclude=.issue-522-applied \
            --exclude=.github/workflows/issue-522-build.yml \
            --exclude=scripts/issue_522_apply.py \
            -czf /tmp/issue-522-artifacts/riverhog-issue-522.tar.gz .
          git rev-parse HEAD > /tmp/issue-522-artifacts/BRANCH_SHA
          sha256sum /tmp/issue-522-artifacts/riverhog-issue-522.tar.gz \
            /tmp/issue-522-artifacts/riverhog-issue-522.bundle \
            > /tmp/issue-522-artifacts/SHA256SUMS

      - name: Upload handoff archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riverhog-issue-522-${{ github.run_id }}
          path: /tmp/issue-522-artifacts
          if-no-files-found: error
          retention-days: 14
