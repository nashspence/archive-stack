name: Provider qualification

on:
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Continue the active run, start a fresh run, or decide automatically.
        default: auto
        required: true
        type: choice
        options:
          - auto
          - start
          - poll
      ref:
        description: release/v1 or an exact v1 release tag for a fresh run.
        default: release/v1
        required: true
        type: string
      corpus_profile:
        description: Deterministic qualification corpus for a fresh run.
        default: regular
        required: true
        type: choice
        options:
          - regular
          - multipart

permissions:
  actions: read
  contents: read

concurrency:
  group: provider-qualification
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve provider qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      action: ${{ steps.mode.outputs.action }}
      artifact_id: ${{ steps.mode.outputs.artifact_id }}
      profile: ${{ steps.mode.outputs.profile }}
      source_ref: ${{ steps.mode.outputs.source_ref }}
      source_sha: ${{ steps.mode.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out workflow authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve continuation and exact source
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_PROFILE: ${{ inputs.corpus_profile }}
          REQUESTED_REF: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != refs/heads/main ]]; then
            printf 'Provider qualification workflow authority must be main: %s\n' "$WORKFLOW_REF" >&2
            exit 2
          fi
          input_dir="$RUNNER_TEMP/provider-artifact-input"
          mkdir -p "$input_dir"
          artifact_id=""
          while IFS= read -r run_id; do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts | map(select(.expired == false and .name == "provider-qualification-state")) | .[0].id // empty')"
            if [[ -n "$artifact_id" ]]; then
              break
            fi
          done < <(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/provider-qualification.yml/runs?branch=main&status=completed&per_page=30" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')
          active=false
          last_started_date=""
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$input_dir/artifact.zip"
            unzip -q "$input_dir/artifact.zip" -d "$input_dir"
            jq --exit-status \
              '.schema == "riverhog-provider-qualification-status/v1"
                and (.active | type == "boolean")
                and (.started_at | type == "string")' \
              "$input_dir/status.json" >/dev/null
            active="$(jq -r '.active' "$input_dir/status.json")"
            last_started_date="$(jq -r '.started_at[0:10]' "$input_dir/status.json")"
          fi

          requested_mode="${REQUESTED_MODE:-auto}"
          action=skip
          if [[ "$active" == true ]]; then
            if [[ "$requested_mode" == start ]]; then
              printf 'A provider qualification is already active.\n' >&2
              exit 2
            fi
            action=poll
          elif [[ "$requested_mode" == poll ]]; then
            printf 'There is no active provider qualification to poll.\n' >&2
            exit 2
          elif [[ "$EVENT_NAME" == workflow_dispatch || "$requested_mode" == start ]]; then
            action=start
          elif [[ "$(date -u +%d)" =~ ^(01|15)$ \
            && "$last_started_date" != "$(date -u +%F)" ]]; then
            action=start
          fi

          if [[ "$action" == skip ]]; then
            printf 'action=skip\nartifact_id=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$action" == poll ]]; then
            source_sha="$(jq -r '.source_sha' "$input_dir/status.json")"
            source_ref="$(jq -r '.source_ref' "$input_dir/status.json")"
            profile="$(jq -r '.corpus_profile' "$input_dir/status.json")"
          else
            source_ref="${REQUESTED_REF:-release/v1}"
            profile="${REQUESTED_PROFILE:-regular}"
            if [[ "$EVENT_NAME" == schedule && "$(date -u +%d)" == 15 ]]; then
              profile=multipart
            fi
            if [[ "$profile" != regular && "$profile" != multipart ]]; then
              printf 'Unsupported provider qualification corpus: %s\n' "$profile" >&2
              exit 2
            fi
            source_sha=""
          fi
          if [[ ! "$source_ref" =~ ^(release/v1|v1\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then
            printf 'Unsupported provider qualification ref: %s\n' "$source_ref" >&2
            exit 2
          fi
          git fetch --force --no-tags origin "$source_ref"
          source_tip="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          if [[ "$action" == start ]]; then
            source_sha="$source_tip"
          elif [[ "$source_ref" == v1.* && "$source_sha" != "$source_tip" ]]; then
            printf 'Qualification tag moved or checkpoint source changed.\n' >&2
            exit 2
          elif ! git merge-base --is-ancestor "$source_sha" "$source_tip"; then
            printf 'Qualification source is no longer reachable from its selected ref.\n' >&2
            exit 2
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Provider qualification source is not an exact commit.\n' >&2
            exit 2
          fi
          printf 'action=%s\nartifact_id=%s\nsource_sha=%s\nsource_ref=%s\nprofile=%s\n' \
            "$action" "$artifact_id" "$source_sha" "$source_ref" "$profile" \
            >> "$GITHUB_OUTPUT"
      - name: Stop when no qualification is due
        if: steps.mode.outputs.action == 'skip'
        run: printf 'Provider qualification scheduler is idle.\n'

  provision_aws:
    name: reconcile AWS provider infrastructure
    needs: resolve
    if: needs.resolve.outputs.action == 'start'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: provider-qualification-provisioning
    permissions:
      contents: read
      id-token: write
    env:
      CONFIG_PATH: config/provider-qualification.example.toml
      RIVERHOG_QUALIFICATION_AWS_DEEP_ARCHIVE_BUCKET: ${{ vars.RIVERHOG_QUALIFICATION_AWS_DEEP_ARCHIVE_BUCKET }}
      RIVERHOG_QUALIFICATION_AWS_REGION: ${{ vars.RIVERHOG_QUALIFICATION_AWS_REGION }}
    steps:
      - name: Check out workflow authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify workflow authority
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: python uv
      - name: Materialize CloudFront public key
        env:
          CLOUDFRONT_PUBLIC_KEY: ${{ vars.RIVERHOG_QUALIFICATION_CLOUDFRONT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          public_key="$RUNNER_TEMP/provider-cloudfront-public.pem"
          umask 077
          printf '%s\n' "$CLOUDFRONT_PUBLIC_KEY" > "$public_key"
          chmod 600 "$public_key"
          printf 'RIVERHOG_QUALIFICATION_CLOUDFRONT_PUBLIC_KEY_PATH=%s\n' "$public_key" \
            >> "$GITHUB_ENV"
      - name: Configure AWS provisioning identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.RIVERHOG_QUALIFICATION_AWS_REGION }}
          role-to-assume: ${{ vars.RIVERHOG_QUALIFICATION_AWS_PROVISION_ROLE_ARN }}
          role-session-name: riverhog-provider-provision
      - name: Reconcile dedicated AWS infrastructure
        run: make provider-qualification args="infrastructure apply $CONFIG_PATH"

  qualify:
    name: resumable provider qualification
    needs:
      - resolve
      - provision_aws
    if: >-
      always()
      && needs.resolve.result == 'success'
      && needs.resolve.outputs.action != 'skip'
      && (needs.provision_aws.result == 'success' || needs.provision_aws.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: provider-qualification
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CONFIG_PATH: config/provider-qualification.example.toml
      RIVERHOG_QUALIFICATION_AWS_DEEP_ARCHIVE_BUCKET: ${{ vars.RIVERHOG_QUALIFICATION_AWS_DEEP_ARCHIVE_BUCKET }}
      RIVERHOG_QUALIFICATION_AWS_REGION: ${{ vars.RIVERHOG_QUALIFICATION_AWS_REGION }}
      RIVERHOG_QUALIFICATION_B2_ARCHIVE_BUCKET: ${{ vars.RIVERHOG_QUALIFICATION_B2_ARCHIVE_BUCKET }}
      RIVERHOG_QUALIFICATION_B2_REGION: ${{ vars.RIVERHOG_QUALIFICATION_B2_REGION }}
      RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_BUCKET: ${{ vars.RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_BUCKET }}
      RIVERHOG_QUALIFICATION_B2_S3_ENDPOINT_URL: ${{ vars.RIVERHOG_QUALIFICATION_B2_S3_ENDPOINT_URL }}
    steps:
      - name: Check out workflow authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified continuation state
        if: needs.resolve.outputs.action == 'poll'
        env:
          ARTIFACT_ID: ${{ needs.resolve.outputs.artifact_id }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          input_dir="$RUNNER_TEMP/provider-artifact-input"
          mkdir -p "$input_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$input_dir/artifact.zip"
          unzip -q "$input_dir/artifact.zip" -d "$input_dir"
          jq --exit-status \
            '.schema == "riverhog-provider-qualification-status/v1" and .active == true' \
            "$input_dir/status.json" >/dev/null
          test "$(jq -r '.source_sha' "$input_dir/status.json")" = "$SOURCE_SHA"
          test -s "$input_dir/checkpoint.json"
          test -s "$input_dir/database.dump"
          printf 'STATE_INPUT_DIR=%s\n' "$input_dir" >> "$GITHUB_ENV"
      - name: Check out verified exact source
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse --verify HEAD)" = "$SOURCE_SHA"
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Verify manually provisioned B2 infrastructure
        env:
          RIVERHOG_QUALIFICATION_B2_ARCHIVE_ACCESS_KEY_ID: ${{ vars.RIVERHOG_QUALIFICATION_B2_ARCHIVE_ACCESS_KEY_ID }}
          RIVERHOG_QUALIFICATION_B2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.RIVERHOG_QUALIFICATION_B2_ARCHIVE_SECRET_ACCESS_KEY }}
          RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_ACCESS_KEY_ID: ${{ vars.RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_ACCESS_KEY_ID }}
          RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_SECRET_ACCESS_KEY: ${{ secrets.RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_SECRET_ACCESS_KEY }}
        run: make provider-qualification args="b2-check $CONFIG_PATH"
      - name: Configure Docker engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Install Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v5.1.1
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
      - name: Resolve image metadata
        id: image-metadata
        run: |
          printf 'created=%s\nepoch=%s\n' \
            "$(git show -s --format=%cI HEAD)" "$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the disposable Riverhog image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: docker-bake.hcl
          targets: riverhog
          load: true
          set: |
            *.args.SOURCE_REVISION=${{ needs.resolve.outputs.source_sha }}
            *.args.BUILD_CREATED=${{ steps.image-metadata.outputs.created }}
            *.args.SOURCE_DATE_EPOCH=${{ steps.image-metadata.outputs.epoch }}
            *.args.RELEASE_VERSION=development
            *.cache-from=type=gha,scope=provider-qualification-riverhog
            *.cache-to=type=gha,scope=provider-qualification-riverhog,mode=min,ignore-error=true
      - name: Materialize CloudFront signing keys
        env:
          CLOUDFRONT_PRIVATE_KEY: ${{ secrets.RIVERHOG_QUALIFICATION_CLOUDFRONT_PRIVATE_KEY }}
          CLOUDFRONT_PUBLIC_KEY: ${{ vars.RIVERHOG_QUALIFICATION_CLOUDFRONT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/provider-cloudfront-private.pem"
          public_key="$RUNNER_TEMP/provider-cloudfront-public.pem"
          umask 077
          printf '%s\n' "$CLOUDFRONT_PRIVATE_KEY" > "$private_key"
          printf '%s\n' "$CLOUDFRONT_PUBLIC_KEY" > "$public_key"
          chmod 600 "$private_key" "$public_key"
          printf 'RIVERHOG_QUALIFICATION_CLOUDFRONT_PRIVATE_KEY_PATH=%s\n' "$private_key" >> "$GITHUB_ENV"
          printf 'RIVERHOG_QUALIFICATION_CLOUDFRONT_PUBLIC_KEY_PATH=%s\n' "$public_key" >> "$GITHUB_ENV"
      - name: Configure AWS runtime identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.RIVERHOG_QUALIFICATION_AWS_REGION }}
          role-to-assume: ${{ vars.RIVERHOG_QUALIFICATION_AWS_RUNTIME_ROLE_ARN }}
          role-session-name: riverhog-provider-runtime
          unset-current-credentials: true
      - name: Create and verify deterministic state
        env:
          ACTION: ${{ needs.resolve.outputs.action }}
          CORPUS_PROFILE: ${{ needs.resolve.outputs.profile }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/provider-state"
          corpus_root="$RUNNER_TEMP/provider-corpus"
          corpus_manifest="$RUNNER_TEMP/provider-corpus.qualification.json"
          mkdir -p "$state_dir"
          make provider-qualification args="corpus-create $corpus_root --profile $CORPUS_PROFILE"
          if [[ "$ACTION" == start ]]; then
            make provider-qualification args="checkpoint-start $state_dir/checkpoint.json --config $CONFIG_PATH --corpus-manifest $corpus_manifest --source-sha $SOURCE_SHA --source-ref $SOURCE_REF"
          else
            cp "$STATE_INPUT_DIR/checkpoint.json" "$state_dir/checkpoint.json"
            cp "$STATE_INPUT_DIR/database.dump" "$state_dir/database.dump"
          fi
          make provider-qualification args="checkpoint-show $state_dir/checkpoint.json" >/dev/null
          test "$(jq -r '.source_sha' "$state_dir/checkpoint.json")" = "$SOURCE_SHA"
          test "$(jq -r '.corpus_sha256' "$state_dir/checkpoint.json")" = \
            "$(jq -r '.sha256' "$corpus_manifest")"
          printf 'STATE_DIR=%s\nCORPUS_ROOT=%s\nCORPUS_MANIFEST=%s\n' \
            "$state_dir" "$corpus_root" "$corpus_manifest" >> "$GITHUB_ENV"
      - name: Generate the disposable deployment environment
        env:
          RIVERHOG_QUALIFICATION_ARCHIVE_PASSPHRASE: ${{ secrets.RIVERHOG_QUALIFICATION_ARCHIVE_PASSPHRASE }}
          RIVERHOG_QUALIFICATION_B2_ARCHIVE_ACCESS_KEY_ID: ${{ vars.RIVERHOG_QUALIFICATION_B2_ARCHIVE_ACCESS_KEY_ID }}
          RIVERHOG_QUALIFICATION_B2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.RIVERHOG_QUALIFICATION_B2_ARCHIVE_SECRET_ACCESS_KEY }}
          RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_ACCESS_KEY_ID: ${{ vars.RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_ACCESS_KEY_ID }}
          RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_SECRET_ACCESS_KEY: ${{ secrets.RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_SECRET_ACCESS_KEY }}
          RIVERHOG_QUALIFICATION_BOOTSTRAP_TOKEN: ${{ secrets.RIVERHOG_QUALIFICATION_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          test -z "${RIVERHOG_DATABASE_URL:-}"
          runtime_env="$RUNNER_TEMP/provider-runtime.env"
          make provider-qualification args="runtime-env $CONFIG_PATH --checkpoint $STATE_DIR/checkpoint.json --output $runtime_env"
          if grep -q '^RIVERHOG_DATABASE_URL=' "$runtime_env"; then
            printf 'Qualification runtime must not override the local compose database.\n' >&2
            exit 2
          fi
          compose_project="riverhog-qualification-$(jq -r '.run_id[0:12]' "$STATE_DIR/checkpoint.json")"
          if [[ -n "$(docker volume ls --quiet --filter "label=com.docker.compose.project=$compose_project")" ]]; then
            printf 'Qualification compose project is not fresh: %s\n' "$compose_project" >&2
            exit 2
          fi
          printf 'RUNTIME_ENV=%s\nCOMPOSE_PROJECT_NAME=%s\n' \
            "$runtime_env" "$compose_project" >> "$GITHUB_ENV"
      - name: Restore disposable database state
        if: needs.resolve.outputs.action == 'poll'
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNTIME_ENV" --project-name "$COMPOSE_PROJECT_NAME" \
            -f riverhog/server/compose.yaml up -d --wait postgres
          docker compose --env-file "$RUNTIME_ENV" --project-name "$COMPOSE_PROJECT_NAME" \
            -f riverhog/server/compose.yaml exec -T postgres \
            pg_restore --username riverhog --dbname riverhog --clean --if-exists --no-owner \
            < "$STATE_DIR/database.dump"
      - name: Start the disposable Riverhog deployment
        id: deployment
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNTIME_ENV" --project-name "$COMPOSE_PROJECT_NAME" \
            -f riverhog/server/compose.yaml up -d --wait app
          actual_url="$(docker compose --env-file "$RUNTIME_ENV" --project-name "$COMPOSE_PROJECT_NAME" \
            -f riverhog/server/compose.yaml config --format json \
            | jq -r '.services.app.environment.RIVERHOG_DATABASE_URL')"
          test "$actual_url" = 'postgresql+psycopg://riverhog:riverhog@postgres:5432/riverhog'
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
      - name: Advance one restartable qualification phase
        id: operate
        continue-on-error: true
        env:
          RIVERHOG_QUALIFICATION_ARCHIVE_PASSPHRASE: ${{ secrets.RIVERHOG_QUALIFICATION_ARCHIVE_PASSPHRASE }}
          RIVERHOG_QUALIFICATION_B2_ARCHIVE_ACCESS_KEY_ID: ${{ vars.RIVERHOG_QUALIFICATION_B2_ARCHIVE_ACCESS_KEY_ID }}
          RIVERHOG_QUALIFICATION_B2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.RIVERHOG_QUALIFICATION_B2_ARCHIVE_SECRET_ACCESS_KEY }}
          RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_ACCESS_KEY_ID: ${{ vars.RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_ACCESS_KEY_ID }}
          RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_SECRET_ACCESS_KEY: ${{ secrets.RIVERHOG_QUALIFICATION_B2_RETRIEVAL_CACHE_SECRET_ACCESS_KEY }}
          RIVERHOG_QUALIFICATION_BOOTSTRAP_TOKEN: ${{ secrets.RIVERHOG_QUALIFICATION_BOOTSTRAP_TOKEN }}
        run: >-
          make provider-qualification
          args="operate $CONFIG_PATH
          --checkpoint $STATE_DIR/checkpoint.json
          --corpus-manifest $CORPUS_MANIFEST
          --corpus-root $CORPUS_ROOT
          --base-url http://127.0.0.1:8000
          --allow-insecure-http"
      - name: Snapshot bounded disposable database state
        if: always() && steps.deployment.outcome == 'success'
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNTIME_ENV" --project-name "$COMPOSE_PROJECT_NAME" \
            -f riverhog/server/compose.yaml exec -T postgres \
            pg_dump --username riverhog --dbname riverhog --format custom \
            > "$STATE_DIR/database.dump"
          test -s "$STATE_DIR/database.dump"
          test "$(stat --format=%s "$STATE_DIR/database.dump")" -le 536870912
      - name: Package resumable dummy state and public evidence
        if: always() && env.STATE_DIR != ''
        id: package
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/provider-public-artifact"
          mkdir -p "$artifact_dir"
          test -s "$STATE_DIR/checkpoint.json"
          phase="$(jq -r '.phase' "$STATE_DIR/checkpoint.json")"
          active=true
          if [[ "$phase" == cleaned || "$phase" == failed ]]; then
            active=false
            make provider-qualification args="evidence $STATE_DIR/checkpoint.json --output $artifact_dir/evidence.json"
          else
            test -s "$STATE_DIR/database.dump"
            cp "$STATE_DIR/checkpoint.json" "$STATE_DIR/database.dump" "$artifact_dir/"
          fi
          jq --null-input \
            --arg source_sha "$(jq -r '.source_sha' "$STATE_DIR/checkpoint.json")" \
            --arg source_ref "$(jq -r '.source_ref' "$STATE_DIR/checkpoint.json")" \
            --arg corpus_profile "$(jq -r '.corpus_profile' "$STATE_DIR/checkpoint.json")" \
            --arg phase "$phase" \
            --arg started_at "$(jq -r '.started_at' "$STATE_DIR/checkpoint.json")" \
            --argjson active "$active" \
            '{
              schema: "riverhog-provider-qualification-status/v1",
              source_sha: $source_sha,
              source_ref: $source_ref,
              corpus_profile: $corpus_profile,
              phase: $phase,
              started_at: $started_at,
              active: $active
            }' > "$artifact_dir/status.json"
          printf 'PROVIDER_ARTIFACT_DIR=%s\n' "$artifact_dir" >> "$GITHUB_ENV"
      - name: Upload bounded qualification state
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-qualification-state
          path: ${{ runner.temp }}/provider-public-artifact
          if-no-files-found: error
          retention-days: 14
      - name: Remove the disposable deployment
        if: always() && env.RUNTIME_ENV != ''
        run: |
          docker compose --env-file "$RUNTIME_ENV" --project-name "$COMPOSE_PROJECT_NAME" \
            -f riverhog/server/compose.yaml down --volumes --remove-orphans
      - name: Preserve qualification failure after state upload
        if: steps.operate.outcome == 'failure'
        run: |
          printf 'Provider qualification failed after its resumable state was uploaded.\n' >&2
          exit 1
