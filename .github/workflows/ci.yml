name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/v1
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out and validate.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: make ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lint
          - target: compile
          - target: unit
          - target: spec
          - target: c2sp-vectors
          - target: postgres-concurrency
            docker: true
          - target: compose-smoke
            docker: true
          - target: dist-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Configure Docker engine
        if: matrix.docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Install Docker Compose
        if: matrix.docker
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v5.1.1
      - name: Run repository target
        env:
          CI_TARGET: ${{ matrix.target }}
        run: make "$CI_TARGET"

  client-platforms:
    name: client platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MISE_AUTO_INSTALL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            listener_repetitions: 12
          - os: macos-15
            listener_repetitions: 12
          - os: windows-2025
            listener_repetitions: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python uv age
      - name: Qualify native end-user behavior
        run: >-
          mise x python uv age -- uv run --locked --all-packages --group dev
          python -m pytest -q
          packages/riverhog-provenance/tests/test_platform_live.py
          utilities/gogurt/tests
          tests/platform/test_end_user_artifacts.py
      - name: Qualify independent staged uv-tool installs
        run: >-
          mise x python uv age -- uv run --locked --all-packages --group dev
          python scripts/qualify_installation.py --version 1.0.0 --listener-lifecycle
          --listener-lifecycle-repetitions ${{ matrix.listener_repetitions }}
          --gogurt-evidence-dir "${{ runner.temp }}/gogurt-failure-evidence"
      - name: Retain bounded Gogurt lifecycle failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gogurt-lifecycle-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/gogurt-failure-evidence
          if-no-files-found: warn
          retention-days: 14

  images:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    strategy:
      fail-fast: false
      matrix:
        target:
          - riverhog
          - riverhog-ftp-adapter
          - riverhog-storage-adapter-aws
          - riverhog-storage-adapter-backblaze
          - stove0
          - stove0-exiftool-observer
          - stove0-ffprobe-sampling-observer
          - stove0-nvenc-av1-opus-target
          - stove0-opus-target
          - stove0-review-materialize-target
          - stove0-review-rclone-effect-target
          - mango-fish
          - test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Configure Docker engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.0
          driver: docker
      - name: Install Mango Fish smoke toolchain
        if: matrix.target == 'mango-fish'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python
      - name: Resolve image metadata
        id: image-metadata
        run: |
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          load: true
          set: |
            *.args.SOURCE_REVISION=${{ inputs.ref || github.sha }}
            *.args.BUILD_CREATED=${{ steps.image-metadata.outputs.created }}
            *.args.SOURCE_DATE_EPOCH=${{ steps.image-metadata.outputs.epoch }}
            *.args.RELEASE_VERSION=development
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,scope=${{ matrix.target }},mode=min,ignore-error=true
      - name: Smoke Mango Fish image
        if: matrix.target == 'mango-fish'
        run: make mango-fish-smoke
      - name: Verify runtime image isolation
        if: matrix.target != 'test'
        env:
          IMAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/check_runtime_image.py "$IMAGE_TARGET"
