name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: make ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lint
          - target: compile
          - target: unit
          - target: spec
          - target: c2sp-vectors
          - target: postgres-concurrency
            docker: true
          - target: compose-smoke
            docker: true
          - target: dist-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Configure Docker engine
        if: matrix.docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Install Docker Compose
        if: matrix.docker
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v5.1.1
      - name: Run repository target
        env:
          CI_TARGET: ${{ matrix.target }}
        run: make "$CI_TARGET"

  provenance-observers:
    name: provenance observer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: python uv
      - name: Qualify the native provenance observer
        run: >-
          mise x -- uv run --locked --all-packages --group dev
          python -m pytest -q
          packages/riverhog-provenance/tests/test_platform_live.py

  images:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    strategy:
      fail-fast: false
      matrix:
        target:
          - riverhog
          - jeb
          - mango-fish
          - munchy-server
          - munchy-av1-nvenc
          - test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Docker engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
      - name: Resolve image metadata
        id: image-metadata
        run: |
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          load: true
          set: |
            *.args.SOURCE_REVISION=${{ github.sha }}
            *.args.BUILD_CREATED=${{ steps.image-metadata.outputs.created }}
            *.args.SOURCE_DATE_EPOCH=${{ steps.image-metadata.outputs.epoch }}
            *.args.RELEASE_VERSION=development
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,scope=${{ matrix.target }},mode=min,ignore-error=true
