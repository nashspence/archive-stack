name: Release qualification

on:
  schedule:
    - cron: "17 7 1,15 * *"
  workflow_dispatch:
    inputs:
      ref:
        description: main, release/v1, or an exact v1 release tag
        default: main
        required: true
        type: string
      version:
        description: Coordinated 1.x.y version to exercise
        default: 1.0.0
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

concurrency:
  group: release-qualification-${{ github.event_name }}-${{ inputs.ref || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out workflow authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the selected ref once
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != refs/heads/main ]]; then
            printf 'Release qualification workflow authority must be main: %s\n' "$WORKFLOW_REF" >&2
            exit 2
          fi
          ref="$REQUESTED_REF"
          version="$REQUESTED_VERSION"
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            ref=main
            version=1.0.0
            if git ls-remote --exit-code --heads origin release/v1 >/dev/null; then
              ref=release/v1
            fi
          fi
          if [[ ! "$ref" =~ ^(main|release/v1|v1\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then
            printf 'Unsupported qualification ref: %s\n' "$ref" >&2
            exit 2
          fi
          if [[ ! "$version" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Unsupported qualification version: %s\n' "$version" >&2
            exit 2
          fi
          git fetch --force --no-tags origin "$ref"
          sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          printf 'ref=%s\nsha=%s\nversion=%s\n' "$ref" "$sha" "$version" >> "$GITHUB_OUTPUT"
      - name: Verify exact-source CodeQL checks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          checks="$(gh api "repos/${{ github.repository }}/commits/$SOURCE_SHA/check-runs?per_page=100")"
          for context in 'Analyze (actions)' 'Analyze (python)'; do
            jq --exit-status --arg context "$context" \
              '[.check_runs[] | select(.name == $context and .app.id == 15368 and .conclusion == "success")] | length == 1' \
              <<< "$checks"
          done

  ci:
    name: required checks
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read

  release-audit:
    name: exact-SHA nonpublishing release audit
    needs:
      - resolve
      - ci
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      SOURCE_REF: ${{ needs.resolve.outputs.ref }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RIVERHOG_RELEASE_GHA_CACHE: "true"
    steps:
      - name: Check out workflow authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out verified exact source
        run: |
          git fetch --force --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse --verify HEAD)" = "$SOURCE_SHA"
      - name: Install repository toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Configure Docker engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.0
          driver: docker
      - name: Locate qualification evidence outside the source tree
        run: |
          qualification_dir="$RUNNER_TEMP/release-qualification"
          printf 'QUALIFICATION_DIR=%s\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'RELEASE_SUMMARY=%s/release.json\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'GOVERNANCE_SUMMARY=%s/governance.json\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'OPERATIONS_SUMMARY=%s/operations.json\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'OPERATIONS_TIMINGS=%s/operation-timings.json\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'DATABASE_SUMMARY=%s/database.json\n' "$qualification_dir" >> "$GITHUB_ENV"
      - name: Exercise disposable operation lifecycles and record timings
        env:
          RIVERHOG_OPERATION_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          RIVERHOG_OPERATION_TIMINGS: ${{ env.OPERATIONS_TIMINGS }}
        run: >-
          make unit
          TESTS="tests/unit/test_operation_lifecycle_api.py::test_riverhog_official_client_positive_disposable_lifecycle
          companions/stove0/tests/test_stove0_api_parity.py::test_stove0_official_client_positive_disposable_lifecycle
          reference/riverhog/ingress/ftp/tests/test_ftp_adapter_api_parity.py::test_official_client_positive_disposable_lifecycle
          tests/unit/test_collection_reads.py::test_collection_list_query_count_is_independent_of_page_rows
          companions/stove0/tests/test_work_state.py::test_unified_state_store_is_restart_safe_and_compare_and_swap
          companions/stove0/tests/test_preview_and_evaluation.py::test_unified_evaluation_store_is_restart_safe
          companions/stove0/tests/test_scheduler_roles.py::test_worker_tick_never_consumes_the_controller_event_cursor
          reference/riverhog/ingress/ftp/tests/test_ftp_adapter_custody.py::test_landing_adapter_reconciles_lost_response_without_releasing_custody
          reference/riverhog/ingress/ftp/tests/test_ftp_adapter_custody.py::test_explicit_flush_is_the_same_bounded_claim_and_receipt_path
          tests/unit/test_cli_app_keys.py
          tests/unit/test_cli_archive_copy.py
          tests/unit/test_cli_archive_retire.py
          tests/unit/test_cli_client.py
          tests/unit/test_cli_collection_delete.py
          tests/unit/test_cli_events.py
          tests/unit/test_cli_help.py
          tests/unit/test_cli_json_output.py
          tests/unit/test_cli_list_ids.py
          tests/unit/test_cli_provenance.py
          tests/unit/test_cli_status.py
          tests/unit/test_cli_tags.py
          tests/unit/test_cli_upload.py
          tests/unit/test_local_materialization.py
          companions/stove0/tests/test_cli.py
          reference/riverhog/ingress/ftp/tests/test_ftp_adapter_api_parity.py::test_operator_cli_has_human_and_json_views_for_each_management_operation"
          args="-p tests.operation_observer"
      - name: Verify and record the complete operation matrix
        run: >-
          make operation-qualification
          args="evidence --source-sha $SOURCE_SHA --timings $OPERATIONS_TIMINGS
          --output $OPERATIONS_SUMMARY"
      - name: Verify exact-SHA operation evidence
        run: |
          jq --exit-status --arg sha "$SOURCE_SHA" '
            .schema == "riverhog-operation-qualification/v1"
            and .source_sha == $sha
            and .summary.operations == (.operations | length)
            and .qualification.positive_local_lifecycles.status == "passed"
            and .qualification.cli_human_json_projection.status == "passed"
            and .qualification.bounded_state_access.status == "passed"
            and .qualification.event_cursor_restart_resume.status == "passed"
            and .qualification.provider_backed_lifecycles.status == "linked"
            and .performance.local_api.schema == "riverhog-operation-timings/v1"
            and .performance.local_api.source_sha == $sha
            and (.summary.applications | keys == ["riverhog", "riverhog-adapters", "stove0"])
            and (.summary.classifications | keys == [
              "client-only-primitive",
              "human-cli+json",
              "service-internal",
              "standard-tool/protocol"
            ])
          ' "$OPERATIONS_SUMMARY"
      - name: Qualify exact database schemas, selectors, and complete streams
        run: >-
          make database-qualification
          DATABASE_QUALIFICATION_SOURCE_SHA="$SOURCE_SHA"
          DATABASE_QUALIFICATION_OUTPUT="$DATABASE_SUMMARY"
      - name: Verify exact-SHA database evidence
        run: |
          jq --exit-status --arg sha "$SOURCE_SHA" '
            . as $root
            | .schema == "riverhog-database-qualification/v1"
            and .source_sha == $sha
            and .cardinalities == [4096, 16384]
            and .selector_contract.applications == ["riverhog", "stove0"]
            and .selector_contract.operations > 0
            and .selector_contract.statement_families > 0
            and .selector_contract.plan_cases > .selector_contract.operations
            and (.schema_fixtures.riverhog | test("^[0-9a-f]{64}$"))
            and (.schema_fixtures.stove0 | test("^[0-9a-f]{64}$"))
            and .qualification == {
              exact_schemas: "passed",
              natural_plans: "passed",
              bounded_pages: "passed",
              complete_streams: "passed",
              cancellation: "passed",
              backpressure: "passed"
            }
            and (.measurements | length) == 2
            and all(.measurements[]; (.plans | length) == $root.selector_contract.plan_cases)
            and all(.measurements[]; (.streams | length) == $root.selector_contract.statement_families)
            and all(.measurements[].streams[];
              .chunk_rows == 100
              and .peak_application_bytes <= $root.stream_contract.max_peak_application_bytes
              and .cancellation.cursor_closed
              and .cancellation.connection_reusable)
          ' "$DATABASE_SUMMARY"
      - name: Verify live release governance
        run: >-
          make release-governance-check
          RELEASE_GOVERNANCE_SCOPE=actions-observable
          RELEASE_SUMMARY="$GOVERNANCE_SUMMARY"
      - name: Build and verify release evidence
        run: >-
          make release-dry-run
          RELEASE_VERSION="$RELEASE_VERSION"
          RELEASE_SUMMARY="$RELEASE_SUMMARY"
      - name: Verify exact-SHA nonpublication summary
        run: |
          jq --exit-status --arg sha "$SOURCE_SHA" \
            '.source_sha == $sha and .published == false and .signature_verified == true' \
            "$RELEASE_SUMMARY"
          jq --exit-status --arg sha "$SOURCE_SHA" \
            '.source_sha == $sha
              and .scope == "actions-observable"
              and .immutable_releases == "operator-preflight-required"' \
            "$GOVERNANCE_SUMMARY"
      - name: Record the completed qualification
        run: |
          jq --null-input \
            --arg ref "$SOURCE_REF" \
            --arg sha "$SOURCE_SHA" \
            --arg version "$RELEASE_VERSION" \
            '{
              schema: "riverhog-release-qualification/v1",
              ref: $ref,
              source_sha: $sha,
              version: $version,
              required_checks: "passed",
              operation_matrix: "passed",
              database_contract: "passed",
              github_governance: "actions-observable-passed",
              release_evidence: "passed",
              published: false
            }' > "$QUALIFICATION_DIR/qualification.json"
      - name: Upload SHA-bound summaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/release-qualification/*.json
          if-no-files-found: error
          retention-days: 30
