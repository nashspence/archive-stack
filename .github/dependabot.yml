version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    assignees:
      - nashspence
    commit-message:
      prefix: deps
    groups:
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    assignees:
      - nashspence
    commit-message:
      prefix: deps
    groups:
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /companions/stove0/server
      - /reference/stove0/observers/exiftool
      - /reference/stove0/observers/ffprobe-sampling
      - /reference/stove0/targets/nvenc-av1-opus
      - /reference/stove0/targets/opus
      - /reference/stove0/targets/review
      - /reference/riverhog/ingress/ftp
      - /riverhog/server
      - /reference/riverhog/storage/aws
      - /reference/riverhog/storage/backblaze
      - /tests
      - /utilities/mango-fish
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    assignees:
      - nashspence
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: python
        versions:
          - ">= 3.13"
    groups:
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
