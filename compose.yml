services:
  garage:
    image: dxflrs/garage:b72b090a097c8ee2711c8fb065d250ed68dcd0bf
    volumes:
      - garage-data:/var/lib/garage
      - ./tests/harness/garage.toml:/etc/garage.toml:ro

  tusd:
    image: tusproject/tusd:v2.8.0
    command:
      - "-host"
      - "0.0.0.0"
      - "-port"
      - "1080"
      - "-base-path"
      - "/files/"
      - "-behind-proxy"
      - "-upload-dir"
      - "/uploads"
      - "-hooks-http"
      - "http://app:8000/internal/tusd/hooks"
      - "-hooks-http-forward-headers"
      - "X-Riverhog-Tusd-Hook-Secret"
      - "-hooks-enabled-events"
      - "pre-create"
    volumes:
      - upload-staging:/uploads

  webdav:
    image: rclone/rclone:1.69.3
    depends_on:
      - garage
    command:
      - "serve"
      - "webdav"
      - "garage:${RIVERHOG_S3_BUCKET}/collections"
      - "--config"
      - "/config/rclone.conf"
      - "--read-only"
      - "--addr"
      - ":8080"
    ports:
      - "${RIVERHOG_WEBDAV_PORT:-8080}:8080"
    volumes:
      - ./tests/harness/rclone.conf:/config/rclone.conf:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riverhog}
      POSTGRES_USER: ${POSTGRES_USER:-riverhog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riverhog}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-riverhog}\" -d \"${POSTGRES_DB:-riverhog}\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    image: riverhog-app:dev
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_started
      tusd:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      RIVERHOG_OBJECT_STORE: ${RIVERHOG_OBJECT_STORE}
      RIVERHOG_LOG_LEVEL: ${RIVERHOG_LOG_LEVEL:-INFO}
      RIVERHOG_S3_ENDPOINT_URL: ${RIVERHOG_S3_ENDPOINT_URL}
      RIVERHOG_S3_REGION: ${RIVERHOG_S3_REGION}
      RIVERHOG_S3_BUCKET: ${RIVERHOG_S3_BUCKET}
      RIVERHOG_S3_ACCESS_KEY_ID: ${RIVERHOG_S3_ACCESS_KEY_ID}
      RIVERHOG_S3_SECRET_ACCESS_KEY: ${RIVERHOG_S3_SECRET_ACCESS_KEY}
      RIVERHOG_S3_FORCE_PATH_STYLE: ${RIVERHOG_S3_FORCE_PATH_STYLE}
      RIVERHOG_ARCHIVE_STORES: ${RIVERHOG_ARCHIVE_STORES:-deep}
      RIVERHOG_DEFAULT_ARCHIVE_STORE: ${RIVERHOG_DEFAULT_ARCHIVE_STORE:-deep}
      RIVERHOG_ARCHIVE_READ_ORDER: ${RIVERHOG_ARCHIVE_READ_ORDER:-deep}
      RIVERHOG_ARCHIVE_STORE_DEEP_ENDPOINT_URL: ${RIVERHOG_ARCHIVE_STORE_DEEP_ENDPOINT_URL}
      RIVERHOG_ARCHIVE_STORE_DEEP_REGION: ${RIVERHOG_ARCHIVE_STORE_DEEP_REGION}
      RIVERHOG_ARCHIVE_STORE_DEEP_BUCKET: ${RIVERHOG_ARCHIVE_STORE_DEEP_BUCKET}
      RIVERHOG_ARCHIVE_STORE_DEEP_ACCESS_KEY_ID: ${RIVERHOG_ARCHIVE_STORE_DEEP_ACCESS_KEY_ID}
      RIVERHOG_ARCHIVE_STORE_DEEP_SECRET_ACCESS_KEY: ${RIVERHOG_ARCHIVE_STORE_DEEP_SECRET_ACCESS_KEY}
      RIVERHOG_ARCHIVE_STORE_DEEP_FORCE_PATH_STYLE: ${RIVERHOG_ARCHIVE_STORE_DEEP_FORCE_PATH_STYLE}
      RIVERHOG_ARCHIVE_STORE_DEEP_PREFIX: ${RIVERHOG_ARCHIVE_STORE_DEEP_PREFIX}
      RIVERHOG_ARCHIVE_STORE_DEEP_BACKEND: ${RIVERHOG_ARCHIVE_STORE_DEEP_BACKEND}
      RIVERHOG_ARCHIVE_STORE_DEEP_STORAGE_CLASS: ${RIVERHOG_ARCHIVE_STORE_DEEP_STORAGE_CLASS}
      RIVERHOG_ARCHIVE_STORE_DEEP_READ_MODE: ${RIVERHOG_ARCHIVE_STORE_DEEP_READ_MODE:-auto}
      RIVERHOG_ARCHIVE_STORE_B2_ENDPOINT_URL: ${RIVERHOG_ARCHIVE_STORE_B2_ENDPOINT_URL:-}
      RIVERHOG_ARCHIVE_STORE_B2_REGION: ${RIVERHOG_ARCHIVE_STORE_B2_REGION:-}
      RIVERHOG_ARCHIVE_STORE_B2_BUCKET: ${RIVERHOG_ARCHIVE_STORE_B2_BUCKET:-}
      RIVERHOG_ARCHIVE_STORE_B2_ACCESS_KEY_ID: ${RIVERHOG_ARCHIVE_STORE_B2_ACCESS_KEY_ID:-}
      RIVERHOG_ARCHIVE_STORE_B2_SECRET_ACCESS_KEY: ${RIVERHOG_ARCHIVE_STORE_B2_SECRET_ACCESS_KEY:-}
      RIVERHOG_ARCHIVE_STORE_B2_FORCE_PATH_STYLE: ${RIVERHOG_ARCHIVE_STORE_B2_FORCE_PATH_STYLE:-false}
      RIVERHOG_ARCHIVE_STORE_B2_PREFIX: ${RIVERHOG_ARCHIVE_STORE_B2_PREFIX-archive}
      RIVERHOG_ARCHIVE_STORE_B2_BACKEND: ${RIVERHOG_ARCHIVE_STORE_B2_BACKEND:-b2}
      RIVERHOG_ARCHIVE_STORE_B2_STORAGE_CLASS: ${RIVERHOG_ARCHIVE_STORE_B2_STORAGE_CLASS:-STANDARD}
      RIVERHOG_ARCHIVE_STORE_B2_READ_MODE: ${RIVERHOG_ARCHIVE_STORE_B2_READ_MODE:-auto}
      RIVERHOG_ARCHIVE_MULTIPART_PART_BYTES: ${RIVERHOG_ARCHIVE_MULTIPART_PART_BYTES:-64MiB}
      RIVERHOG_ARCHIVE_MULTIPART_CONCURRENCY: ${RIVERHOG_ARCHIVE_MULTIPART_CONCURRENCY:-4}
      RIVERHOG_ARCHIVE_MULTIPART_MAX_AGE: ${RIVERHOG_ARCHIVE_MULTIPART_MAX_AGE:-72h}
      RIVERHOG_ARCHIVE_MULTIPART_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_MULTIPART_SWEEP_INTERVAL:-6h}
      RIVERHOG_ARCHIVE_OBJECT_CONCURRENCY: ${RIVERHOG_ARCHIVE_OBJECT_CONCURRENCY:-4}
      RIVERHOG_ARCHIVE_ENCRYPTION: ${RIVERHOG_ARCHIVE_ENCRYPTION:-age_scrypt}
      RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE: ${RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE:-false}
      RIVERHOG_ARCHIVE_PASSPHRASE: ${RIVERHOG_ARCHIVE_PASSPHRASE:-}
      RIVERHOG_ARCHIVE_WORK_FACTOR: ${RIVERHOG_ARCHIVE_WORK_FACTOR:-18}
      RIVERHOG_ARCHIVE_UPLOAD_RETRY_DELAY: ${RIVERHOG_ARCHIVE_UPLOAD_RETRY_DELAY:-5m}
      RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL:-30s}
      RIVERHOG_OPERATOR_WEBHOOK_URL: ${RIVERHOG_OPERATOR_WEBHOOK_URL:-}
      RIVERHOG_OPERATOR_WEBHOOK_TIMEOUT: ${RIVERHOG_OPERATOR_WEBHOOK_TIMEOUT:-5s}
      RIVERHOG_OPERATOR_WEBHOOK_RETRY_DELAY: ${RIVERHOG_OPERATOR_WEBHOOK_RETRY_DELAY:-60s}
      RIVERHOG_OPERATOR_WEBHOOK_REMINDER_INTERVAL: ${RIVERHOG_OPERATOR_WEBHOOK_REMINDER_INTERVAL:-1h}
      RIVERHOG_OPERATOR_WEBHOOK_REMINDER_TIME: ${RIVERHOG_OPERATOR_WEBHOOK_REMINDER_TIME:-}
      RIVERHOG_OPERATOR_WEBHOOK_REMINDER_TIMEZONE: ${RIVERHOG_OPERATOR_WEBHOOK_REMINDER_TIMEZONE:-UTC}
      RIVERHOG_ARCHIVE_RESTORE_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_RESTORE_SWEEP_INTERVAL:-30s}
      RIVERHOG_ARCHIVE_RESTORE_LATENCY: ${RIVERHOG_ARCHIVE_RESTORE_LATENCY:-48h}
      RIVERHOG_ARCHIVE_RESTORE_READY_TTL: ${RIVERHOG_ARCHIVE_RESTORE_READY_TTL:-24h}
      RIVERHOG_ARCHIVE_RESTORE_RETRIEVAL_TIER: ${RIVERHOG_ARCHIVE_RESTORE_RETRIEVAL_TIER:-bulk}
      RIVERHOG_OTS_STAMP_COMMAND: ${RIVERHOG_OTS_STAMP_COMMAND:-ots}
      RIVERHOG_OTS_VERIFY_COMMAND: ${RIVERHOG_OTS_VERIFY_COMMAND:-ots --no-bitcoin}
      RIVERHOG_UPLOAD_STAGING_ROOT: ${RIVERHOG_UPLOAD_STAGING_ROOT:-/uploads}
      RIVERHOG_TUSD_BASE_URL: ${RIVERHOG_TUSD_BASE_URL}
      RIVERHOG_TUSD_PUBLIC_BASE_URL: ${RIVERHOG_TUSD_PUBLIC_BASE_URL:-}
      RIVERHOG_TUSD_HOOK_SECRET: ${RIVERHOG_TUSD_HOOK_SECRET}
      RIVERHOG_DATABASE_URL: ${RIVERHOG_DATABASE_URL:-postgresql+psycopg://riverhog:riverhog@postgres:5432/riverhog}
      RIVERHOG_PUBLIC_BASE_URL: ${RIVERHOG_PUBLIC_BASE_URL:-http://app:8000}
      INCOMPLETE_UPLOAD_TTL: ${INCOMPLETE_UPLOAD_TTL:-24h}
      RIVERHOG_UPLOAD_SESSION_IDLE_TTL: ${RIVERHOG_UPLOAD_SESSION_IDLE_TTL:-168h}
      UPLOAD_EXPIRY_SWEEP_INTERVAL: ${UPLOAD_EXPIRY_SWEEP_INTERVAL:-30s}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz')); assert payload['status'] == 'ok'",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    ports:
      - "${RIVERHOG_API_PORT:-8000}:8000"
    volumes:
      - .:/app
      - upload-staging:/uploads

  test:
    image: riverhog-test:dev
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      RIVERHOG_OBJECT_STORE: ${RIVERHOG_OBJECT_STORE}
      RIVERHOG_LOG_LEVEL: ${RIVERHOG_LOG_LEVEL:-INFO}
      RIVERHOG_S3_ENDPOINT_URL: ${RIVERHOG_S3_ENDPOINT_URL}
      RIVERHOG_S3_REGION: ${RIVERHOG_S3_REGION}
      RIVERHOG_S3_BUCKET: ${RIVERHOG_S3_BUCKET}
      RIVERHOG_S3_ACCESS_KEY_ID: ${RIVERHOG_S3_ACCESS_KEY_ID}
      RIVERHOG_S3_SECRET_ACCESS_KEY: ${RIVERHOG_S3_SECRET_ACCESS_KEY}
      RIVERHOG_S3_FORCE_PATH_STYLE: ${RIVERHOG_S3_FORCE_PATH_STYLE}
      RIVERHOG_ARCHIVE_STORES: ${RIVERHOG_ARCHIVE_STORES:-deep}
      RIVERHOG_DEFAULT_ARCHIVE_STORE: ${RIVERHOG_DEFAULT_ARCHIVE_STORE:-deep}
      RIVERHOG_ARCHIVE_READ_ORDER: ${RIVERHOG_ARCHIVE_READ_ORDER:-deep}
      RIVERHOG_ARCHIVE_STORE_DEEP_ENDPOINT_URL: ${RIVERHOG_ARCHIVE_STORE_DEEP_ENDPOINT_URL}
      RIVERHOG_ARCHIVE_STORE_DEEP_REGION: ${RIVERHOG_ARCHIVE_STORE_DEEP_REGION}
      RIVERHOG_ARCHIVE_STORE_DEEP_BUCKET: ${RIVERHOG_ARCHIVE_STORE_DEEP_BUCKET}
      RIVERHOG_ARCHIVE_STORE_DEEP_ACCESS_KEY_ID: ${RIVERHOG_ARCHIVE_STORE_DEEP_ACCESS_KEY_ID}
      RIVERHOG_ARCHIVE_STORE_DEEP_SECRET_ACCESS_KEY: ${RIVERHOG_ARCHIVE_STORE_DEEP_SECRET_ACCESS_KEY}
      RIVERHOG_ARCHIVE_STORE_DEEP_FORCE_PATH_STYLE: ${RIVERHOG_ARCHIVE_STORE_DEEP_FORCE_PATH_STYLE}
      RIVERHOG_ARCHIVE_STORE_DEEP_PREFIX: ${RIVERHOG_ARCHIVE_STORE_DEEP_PREFIX}
      RIVERHOG_ARCHIVE_STORE_DEEP_BACKEND: ${RIVERHOG_ARCHIVE_STORE_DEEP_BACKEND}
      RIVERHOG_ARCHIVE_STORE_DEEP_STORAGE_CLASS: ${RIVERHOG_ARCHIVE_STORE_DEEP_STORAGE_CLASS}
      RIVERHOG_ARCHIVE_STORE_DEEP_READ_MODE: ${RIVERHOG_ARCHIVE_STORE_DEEP_READ_MODE:-auto}
      RIVERHOG_ARCHIVE_STORE_B2_ENDPOINT_URL: ${RIVERHOG_ARCHIVE_STORE_B2_ENDPOINT_URL:-}
      RIVERHOG_ARCHIVE_STORE_B2_REGION: ${RIVERHOG_ARCHIVE_STORE_B2_REGION:-}
      RIVERHOG_ARCHIVE_STORE_B2_BUCKET: ${RIVERHOG_ARCHIVE_STORE_B2_BUCKET:-}
      RIVERHOG_ARCHIVE_STORE_B2_ACCESS_KEY_ID: ${RIVERHOG_ARCHIVE_STORE_B2_ACCESS_KEY_ID:-}
      RIVERHOG_ARCHIVE_STORE_B2_SECRET_ACCESS_KEY: ${RIVERHOG_ARCHIVE_STORE_B2_SECRET_ACCESS_KEY:-}
      RIVERHOG_ARCHIVE_STORE_B2_FORCE_PATH_STYLE: ${RIVERHOG_ARCHIVE_STORE_B2_FORCE_PATH_STYLE:-false}
      RIVERHOG_ARCHIVE_STORE_B2_PREFIX: ${RIVERHOG_ARCHIVE_STORE_B2_PREFIX-archive}
      RIVERHOG_ARCHIVE_STORE_B2_BACKEND: ${RIVERHOG_ARCHIVE_STORE_B2_BACKEND:-b2}
      RIVERHOG_ARCHIVE_STORE_B2_STORAGE_CLASS: ${RIVERHOG_ARCHIVE_STORE_B2_STORAGE_CLASS:-STANDARD}
      RIVERHOG_ARCHIVE_STORE_B2_READ_MODE: ${RIVERHOG_ARCHIVE_STORE_B2_READ_MODE:-auto}
      RIVERHOG_ARCHIVE_MULTIPART_PART_BYTES: ${RIVERHOG_ARCHIVE_MULTIPART_PART_BYTES:-64MiB}
      RIVERHOG_ARCHIVE_MULTIPART_CONCURRENCY: ${RIVERHOG_ARCHIVE_MULTIPART_CONCURRENCY:-4}
      RIVERHOG_ARCHIVE_MULTIPART_MAX_AGE: ${RIVERHOG_ARCHIVE_MULTIPART_MAX_AGE:-72h}
      RIVERHOG_ARCHIVE_MULTIPART_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_MULTIPART_SWEEP_INTERVAL:-6h}
      RIVERHOG_ARCHIVE_OBJECT_CONCURRENCY: ${RIVERHOG_ARCHIVE_OBJECT_CONCURRENCY:-4}
      RIVERHOG_ARCHIVE_ENCRYPTION: ${RIVERHOG_ARCHIVE_ENCRYPTION:-age_scrypt}
      RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE: ${RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE:-false}
      RIVERHOG_ARCHIVE_PASSPHRASE: ${RIVERHOG_ARCHIVE_PASSPHRASE:-}
      RIVERHOG_ARCHIVE_WORK_FACTOR: ${RIVERHOG_ARCHIVE_WORK_FACTOR:-18}
      RIVERHOG_ARCHIVE_UPLOAD_RETRY_DELAY: ${RIVERHOG_ARCHIVE_UPLOAD_RETRY_DELAY:-5m}
      RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL:-30s}
      RIVERHOG_OPERATOR_WEBHOOK_URL: ${RIVERHOG_OPERATOR_WEBHOOK_URL:-}
      RIVERHOG_OPERATOR_WEBHOOK_TIMEOUT: ${RIVERHOG_OPERATOR_WEBHOOK_TIMEOUT:-5s}
      RIVERHOG_OPERATOR_WEBHOOK_RETRY_DELAY: ${RIVERHOG_OPERATOR_WEBHOOK_RETRY_DELAY:-60s}
      RIVERHOG_OPERATOR_WEBHOOK_REMINDER_INTERVAL: ${RIVERHOG_OPERATOR_WEBHOOK_REMINDER_INTERVAL:-1h}
      RIVERHOG_OPERATOR_WEBHOOK_REMINDER_TIME: ${RIVERHOG_OPERATOR_WEBHOOK_REMINDER_TIME:-}
      RIVERHOG_OPERATOR_WEBHOOK_REMINDER_TIMEZONE: ${RIVERHOG_OPERATOR_WEBHOOK_REMINDER_TIMEZONE:-UTC}
      RIVERHOG_ARCHIVE_RESTORE_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_RESTORE_SWEEP_INTERVAL:-30s}
      RIVERHOG_ARCHIVE_RESTORE_LATENCY: ${RIVERHOG_ARCHIVE_RESTORE_LATENCY:-48h}
      RIVERHOG_ARCHIVE_RESTORE_READY_TTL: ${RIVERHOG_ARCHIVE_RESTORE_READY_TTL:-24h}
      RIVERHOG_ARCHIVE_RESTORE_RETRIEVAL_TIER: ${RIVERHOG_ARCHIVE_RESTORE_RETRIEVAL_TIER:-bulk}
      RIVERHOG_OTS_STAMP_COMMAND: ${RIVERHOG_OTS_STAMP_COMMAND:-ots}
      RIVERHOG_OTS_VERIFY_COMMAND: ${RIVERHOG_OTS_VERIFY_COMMAND:-ots --no-bitcoin}
      RIVERHOG_UPLOAD_STAGING_ROOT: ${RIVERHOG_UPLOAD_STAGING_ROOT:-/uploads}
      RIVERHOG_TUSD_BASE_URL: ${RIVERHOG_TUSD_BASE_URL}
      RIVERHOG_TUSD_HOOK_SECRET: ${RIVERHOG_TUSD_HOOK_SECRET}
