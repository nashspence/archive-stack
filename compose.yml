services:
  garage:
    image: dxflrs/garage:b72b090a097c8ee2711c8fb065d250ed68dcd0bf
    volumes:
      - garage-data:/var/lib/garage
      - ./tests/harness/garage.toml:/etc/garage.toml:ro

  tusd:
    image: tusproject/tusd:v2.8.0
    depends_on:
      - garage
    command:
      - "-host"
      - "0.0.0.0"
      - "-port"
      - "1080"
      - "-base-path"
      - "/files/"
      - "-s3-bucket"
      - "${RIVERHOG_S3_BUCKET}"
      - "-s3-endpoint"
      - "http://garage:3900"
      - "-s3-disable-ssl"
      - "-hooks-http"
      - "http://app:8000/internal/tusd/hooks"
      - "-hooks-http-forward-headers"
      - "X-Riverhog-Tusd-Hook-Secret"
    environment:
      AWS_ACCESS_KEY_ID: ${RIVERHOG_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${RIVERHOG_S3_SECRET_ACCESS_KEY}
      AWS_REGION: ${RIVERHOG_S3_REGION}

  webdav:
    image: rclone/rclone:1.69.3
    depends_on:
      - garage
    command:
      - "serve"
      - "webdav"
      - "garage:${RIVERHOG_S3_BUCKET}/collections"
      - "--config"
      - "/config/rclone.conf"
      - "--read-only"
      - "--addr"
      - ":8080"
    ports:
      - "${RIVERHOG_WEBDAV_PORT:-8080}:8080"
    volumes:
      - ./tests/harness/rclone.conf:/config/rclone.conf:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riverhog}
      POSTGRES_USER: ${POSTGRES_USER:-riverhog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riverhog}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-riverhog}\" -d \"${POSTGRES_DB:-riverhog}\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    image: riverhog-app:dev
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_started
      tusd:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      RIVERHOG_OBJECT_STORE: ${RIVERHOG_OBJECT_STORE}
      RIVERHOG_LOG_LEVEL: ${RIVERHOG_LOG_LEVEL:-INFO}
      RIVERHOG_S3_ENDPOINT_URL: ${RIVERHOG_S3_ENDPOINT_URL}
      RIVERHOG_S3_REGION: ${RIVERHOG_S3_REGION}
      RIVERHOG_S3_BUCKET: ${RIVERHOG_S3_BUCKET}
      RIVERHOG_S3_ACCESS_KEY_ID: ${RIVERHOG_S3_ACCESS_KEY_ID}
      RIVERHOG_S3_SECRET_ACCESS_KEY: ${RIVERHOG_S3_SECRET_ACCESS_KEY}
      RIVERHOG_S3_FORCE_PATH_STYLE: ${RIVERHOG_S3_FORCE_PATH_STYLE}
      RIVERHOG_GLACIER_ENDPOINT_URL: ${RIVERHOG_GLACIER_ENDPOINT_URL}
      RIVERHOG_GLACIER_REGION: ${RIVERHOG_GLACIER_REGION}
      RIVERHOG_GLACIER_BUCKET: ${RIVERHOG_GLACIER_BUCKET}
      RIVERHOG_GLACIER_ACCESS_KEY_ID: ${RIVERHOG_GLACIER_ACCESS_KEY_ID}
      RIVERHOG_GLACIER_SECRET_ACCESS_KEY: ${RIVERHOG_GLACIER_SECRET_ACCESS_KEY}
      RIVERHOG_GLACIER_FORCE_PATH_STYLE: ${RIVERHOG_GLACIER_FORCE_PATH_STYLE}
      RIVERHOG_GLACIER_PREFIX: ${RIVERHOG_GLACIER_PREFIX}
      RIVERHOG_GLACIER_BACKEND: ${RIVERHOG_GLACIER_BACKEND}
      RIVERHOG_GLACIER_STORAGE_CLASS: ${RIVERHOG_GLACIER_STORAGE_CLASS}
      RIVERHOG_GLACIER_ARCHIVE_ENCRYPTION: ${RIVERHOG_GLACIER_ARCHIVE_ENCRYPTION:-age_scrypt}
      RIVERHOG_GLACIER_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE: ${RIVERHOG_GLACIER_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE:-false}
      RIVERHOG_GLACIER_ARCHIVE_PASSPHRASE: ${RIVERHOG_GLACIER_ARCHIVE_PASSPHRASE:-}
      RIVERHOG_GLACIER_ARCHIVE_WORK_FACTOR: ${RIVERHOG_GLACIER_ARCHIVE_WORK_FACTOR:-18}
      RIVERHOG_GLACIER_UPLOAD_RETRY_DELAY: ${RIVERHOG_GLACIER_UPLOAD_RETRY_DELAY:-5m}
      RIVERHOG_GLACIER_UPLOAD_SWEEP_INTERVAL: ${RIVERHOG_GLACIER_UPLOAD_SWEEP_INTERVAL:-30s}
      RIVERHOG_OPERATOR_WEBHOOK_URL: ${RIVERHOG_OPERATOR_WEBHOOK_URL:-}
      RIVERHOG_OPERATOR_WEBHOOK_TIMEOUT: ${RIVERHOG_OPERATOR_WEBHOOK_TIMEOUT:-5s}
      RIVERHOG_OPERATOR_WEBHOOK_RETRY_DELAY: ${RIVERHOG_OPERATOR_WEBHOOK_RETRY_DELAY:-60s}
      RIVERHOG_OPERATOR_WEBHOOK_REMINDER_INTERVAL: ${RIVERHOG_OPERATOR_WEBHOOK_REMINDER_INTERVAL:-1h}
      RIVERHOG_OPERATOR_FAILURE_NOTIFICATION_INTERVAL: ${RIVERHOG_OPERATOR_FAILURE_NOTIFICATION_INTERVAL:-24h}
      RIVERHOG_GLACIER_RECOVERY_SWEEP_INTERVAL: ${RIVERHOG_GLACIER_RECOVERY_SWEEP_INTERVAL:-30s}
      RIVERHOG_GLACIER_RECOVERY_RESTORE_LATENCY: ${RIVERHOG_GLACIER_RECOVERY_RESTORE_LATENCY:-48h}
      RIVERHOG_GLACIER_RECOVERY_READY_TTL: ${RIVERHOG_GLACIER_RECOVERY_READY_TTL:-24h}
      RIVERHOG_GLACIER_RECOVERY_RETRIEVAL_TIER: ${RIVERHOG_GLACIER_RECOVERY_RETRIEVAL_TIER:-bulk}
      RIVERHOG_GLACIER_RECOVERY_RESTORE_MODE: ${RIVERHOG_GLACIER_RECOVERY_RESTORE_MODE:-auto}
      RIVERHOG_GLACIER_BULK_RETRIEVAL_RATE_USD_PER_GIB: ${RIVERHOG_GLACIER_BULK_RETRIEVAL_RATE_USD_PER_GIB:-0.0025}
      RIVERHOG_GLACIER_BULK_REQUEST_RATE_USD_PER_1000: ${RIVERHOG_GLACIER_BULK_REQUEST_RATE_USD_PER_1000:-0.025}
      RIVERHOG_GLACIER_STANDARD_RETRIEVAL_RATE_USD_PER_GIB: ${RIVERHOG_GLACIER_STANDARD_RETRIEVAL_RATE_USD_PER_GIB:-0.02}
      RIVERHOG_GLACIER_STANDARD_REQUEST_RATE_USD_PER_1000: ${RIVERHOG_GLACIER_STANDARD_REQUEST_RATE_USD_PER_1000:-0.10}
      RIVERHOG_OTS_STAMP_COMMAND: ${RIVERHOG_OTS_STAMP_COMMAND:-ots}
      RIVERHOG_OTS_VERIFY_COMMAND: ${RIVERHOG_OTS_VERIFY_COMMAND:-ots}
      RIVERHOG_RECOVERY_PAYLOAD_COMMAND: ${RIVERHOG_RECOVERY_PAYLOAD_COMMAND:-age}
      RIVERHOG_RECOVERY_PAYLOAD_REQUIRE_EXPLICIT_PASSPHRASE: ${RIVERHOG_RECOVERY_PAYLOAD_REQUIRE_EXPLICIT_PASSPHRASE:-false}
      RIVERHOG_RECOVERY_PAYLOAD_PASSPHRASE: ${RIVERHOG_RECOVERY_PAYLOAD_PASSPHRASE:-riverhog-dev-recovery-passphrase}
      RIVERHOG_RECOVERY_PAYLOAD_WORK_FACTOR: ${RIVERHOG_RECOVERY_PAYLOAD_WORK_FACTOR:-12}
      RIVERHOG_RECOVERY_PAYLOAD_MAX_WORK_FACTOR: ${RIVERHOG_RECOVERY_PAYLOAD_MAX_WORK_FACTOR:-30}
      RIVERHOG_PLANNER_DISC_TARGET_BYTES: ${RIVERHOG_PLANNER_DISC_TARGET_BYTES:-50GB}
      RIVERHOG_PLANNER_MIN_FILL_RATIO: ${RIVERHOG_PLANNER_MIN_FILL_RATIO:-99%}
      RIVERHOG_PLANNER_MIN_FILL_BYTES: ${RIVERHOG_PLANNER_MIN_FILL_BYTES:-}
      RIVERHOG_PLANNER_UNPLANNED_SATURATION_BYTES: ${RIVERHOG_PLANNER_UNPLANNED_SATURATION_BYTES:-300GB}
      RIVERHOG_PLANNER_IMAGE_ROOT: ${RIVERHOG_PLANNER_IMAGE_ROOT:-/app/.riverhog/images}
      RIVERHOG_UNBURNED_COLLECTION_BYTES_LIMIT: ${RIVERHOG_UNBURNED_COLLECTION_BYTES_LIMIT:-500GB}
      RIVERHOG_TUSD_BASE_URL: ${RIVERHOG_TUSD_BASE_URL}
      RIVERHOG_TUSD_HOOK_SECRET: ${RIVERHOG_TUSD_HOOK_SECRET}
      RIVERHOG_WEBDAV_ENABLED: ${RIVERHOG_WEBDAV_ENABLED}
      RIVERHOG_WEBDAV_ADDR: ${RIVERHOG_WEBDAV_ADDR}
      RIVERHOG_DATABASE_URL: ${RIVERHOG_DATABASE_URL:-postgresql+psycopg://riverhog:riverhog@postgres:5432/riverhog}
      RIVERHOG_PUBLIC_BASE_URL: ${RIVERHOG_PUBLIC_BASE_URL:-http://app:8000}
      INCOMPLETE_UPLOAD_TTL: ${INCOMPLETE_UPLOAD_TTL:-24h}
      UPLOAD_EXPIRY_SWEEP_INTERVAL: ${UPLOAD_EXPIRY_SWEEP_INTERVAL:-30s}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz')); assert payload['status'] == 'ok'",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    ports:
      - "${RIVERHOG_API_PORT:-8000}:8000"
    volumes:
      - .:/app

  test:
    image: riverhog-test:dev
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      RIVERHOG_OBJECT_STORE: ${RIVERHOG_OBJECT_STORE}
      RIVERHOG_LOG_LEVEL: ${RIVERHOG_LOG_LEVEL:-INFO}
      RIVERHOG_S3_ENDPOINT_URL: ${RIVERHOG_S3_ENDPOINT_URL}
      RIVERHOG_S3_REGION: ${RIVERHOG_S3_REGION}
      RIVERHOG_S3_BUCKET: ${RIVERHOG_S3_BUCKET}
      RIVERHOG_S3_ACCESS_KEY_ID: ${RIVERHOG_S3_ACCESS_KEY_ID}
      RIVERHOG_S3_SECRET_ACCESS_KEY: ${RIVERHOG_S3_SECRET_ACCESS_KEY}
      RIVERHOG_S3_FORCE_PATH_STYLE: ${RIVERHOG_S3_FORCE_PATH_STYLE}
      RIVERHOG_GLACIER_ENDPOINT_URL: ${RIVERHOG_GLACIER_ENDPOINT_URL}
      RIVERHOG_GLACIER_REGION: ${RIVERHOG_GLACIER_REGION}
      RIVERHOG_GLACIER_BUCKET: ${RIVERHOG_GLACIER_BUCKET}
      RIVERHOG_GLACIER_ACCESS_KEY_ID: ${RIVERHOG_GLACIER_ACCESS_KEY_ID}
      RIVERHOG_GLACIER_SECRET_ACCESS_KEY: ${RIVERHOG_GLACIER_SECRET_ACCESS_KEY}
      RIVERHOG_GLACIER_FORCE_PATH_STYLE: ${RIVERHOG_GLACIER_FORCE_PATH_STYLE}
      RIVERHOG_GLACIER_PREFIX: ${RIVERHOG_GLACIER_PREFIX}
      RIVERHOG_GLACIER_BACKEND: ${RIVERHOG_GLACIER_BACKEND}
      RIVERHOG_GLACIER_STORAGE_CLASS: ${RIVERHOG_GLACIER_STORAGE_CLASS}
      RIVERHOG_GLACIER_ARCHIVE_ENCRYPTION: ${RIVERHOG_GLACIER_ARCHIVE_ENCRYPTION:-age_scrypt}
      RIVERHOG_GLACIER_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE: ${RIVERHOG_GLACIER_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE:-false}
      RIVERHOG_GLACIER_ARCHIVE_PASSPHRASE: ${RIVERHOG_GLACIER_ARCHIVE_PASSPHRASE:-}
      RIVERHOG_GLACIER_ARCHIVE_WORK_FACTOR: ${RIVERHOG_GLACIER_ARCHIVE_WORK_FACTOR:-18}
      RIVERHOG_GLACIER_UPLOAD_RETRY_DELAY: ${RIVERHOG_GLACIER_UPLOAD_RETRY_DELAY:-5m}
      RIVERHOG_GLACIER_UPLOAD_SWEEP_INTERVAL: ${RIVERHOG_GLACIER_UPLOAD_SWEEP_INTERVAL:-30s}
      RIVERHOG_OPERATOR_WEBHOOK_URL: ${RIVERHOG_OPERATOR_WEBHOOK_URL:-}
      RIVERHOG_OPERATOR_WEBHOOK_TIMEOUT: ${RIVERHOG_OPERATOR_WEBHOOK_TIMEOUT:-5s}
      RIVERHOG_OPERATOR_WEBHOOK_RETRY_DELAY: ${RIVERHOG_OPERATOR_WEBHOOK_RETRY_DELAY:-60s}
      RIVERHOG_OPERATOR_WEBHOOK_REMINDER_INTERVAL: ${RIVERHOG_OPERATOR_WEBHOOK_REMINDER_INTERVAL:-1h}
      RIVERHOG_OPERATOR_FAILURE_NOTIFICATION_INTERVAL: ${RIVERHOG_OPERATOR_FAILURE_NOTIFICATION_INTERVAL:-24h}
      RIVERHOG_GLACIER_RECOVERY_SWEEP_INTERVAL: ${RIVERHOG_GLACIER_RECOVERY_SWEEP_INTERVAL:-30s}
      RIVERHOG_GLACIER_RECOVERY_RESTORE_LATENCY: ${RIVERHOG_GLACIER_RECOVERY_RESTORE_LATENCY:-48h}
      RIVERHOG_GLACIER_RECOVERY_READY_TTL: ${RIVERHOG_GLACIER_RECOVERY_READY_TTL:-24h}
      RIVERHOG_GLACIER_RECOVERY_RETRIEVAL_TIER: ${RIVERHOG_GLACIER_RECOVERY_RETRIEVAL_TIER:-bulk}
      RIVERHOG_GLACIER_RECOVERY_RESTORE_MODE: ${RIVERHOG_GLACIER_RECOVERY_RESTORE_MODE:-auto}
      RIVERHOG_GLACIER_BULK_RETRIEVAL_RATE_USD_PER_GIB: ${RIVERHOG_GLACIER_BULK_RETRIEVAL_RATE_USD_PER_GIB:-0.0025}
      RIVERHOG_GLACIER_BULK_REQUEST_RATE_USD_PER_1000: ${RIVERHOG_GLACIER_BULK_REQUEST_RATE_USD_PER_1000:-0.025}
      RIVERHOG_GLACIER_STANDARD_RETRIEVAL_RATE_USD_PER_GIB: ${RIVERHOG_GLACIER_STANDARD_RETRIEVAL_RATE_USD_PER_GIB:-0.02}
      RIVERHOG_GLACIER_STANDARD_REQUEST_RATE_USD_PER_1000: ${RIVERHOG_GLACIER_STANDARD_REQUEST_RATE_USD_PER_1000:-0.10}
      RIVERHOG_OTS_STAMP_COMMAND: ${RIVERHOG_OTS_STAMP_COMMAND:-ots}
      RIVERHOG_OTS_VERIFY_COMMAND: ${RIVERHOG_OTS_VERIFY_COMMAND:-ots}
      RIVERHOG_RECOVERY_PAYLOAD_COMMAND: ${RIVERHOG_RECOVERY_PAYLOAD_COMMAND:-age}
      RIVERHOG_RECOVERY_PAYLOAD_REQUIRE_EXPLICIT_PASSPHRASE: ${RIVERHOG_RECOVERY_PAYLOAD_REQUIRE_EXPLICIT_PASSPHRASE:-false}
      RIVERHOG_RECOVERY_PAYLOAD_PASSPHRASE: ${RIVERHOG_RECOVERY_PAYLOAD_PASSPHRASE:-riverhog-dev-recovery-passphrase}
      RIVERHOG_RECOVERY_PAYLOAD_WORK_FACTOR: ${RIVERHOG_RECOVERY_PAYLOAD_WORK_FACTOR:-12}
      RIVERHOG_RECOVERY_PAYLOAD_MAX_WORK_FACTOR: ${RIVERHOG_RECOVERY_PAYLOAD_MAX_WORK_FACTOR:-30}
      RIVERHOG_PLANNER_DISC_TARGET_BYTES: ${RIVERHOG_PLANNER_DISC_TARGET_BYTES:-50GB}
      RIVERHOG_PLANNER_MIN_FILL_RATIO: ${RIVERHOG_PLANNER_MIN_FILL_RATIO:-99%}
      RIVERHOG_PLANNER_MIN_FILL_BYTES: ${RIVERHOG_PLANNER_MIN_FILL_BYTES:-}
      RIVERHOG_PLANNER_UNPLANNED_SATURATION_BYTES: ${RIVERHOG_PLANNER_UNPLANNED_SATURATION_BYTES:-300GB}
      RIVERHOG_PLANNER_IMAGE_ROOT: ${RIVERHOG_PLANNER_IMAGE_ROOT:-/app/.riverhog/images}
      RIVERHOG_UNBURNED_COLLECTION_BYTES_LIMIT: ${RIVERHOG_UNBURNED_COLLECTION_BYTES_LIMIT:-500GB}
      RIVERHOG_TUSD_BASE_URL: ${RIVERHOG_TUSD_BASE_URL}
      RIVERHOG_TUSD_HOOK_SECRET: ${RIVERHOG_TUSD_HOOK_SECRET}
      RIVERHOG_PUBLIC_BASE_URL: ${RIVERHOG_PUBLIC_BASE_URL:-http://app:8000}
      RIVERHOG_DATABASE_URL: ${RIVERHOG_DATABASE_URL:-postgresql+psycopg://riverhog:riverhog@postgres:5432/riverhog}
      PYTHONPATH: /app:/app/src
    volumes:
      - .:/app

volumes:
  garage-data:
  postgres-data:
