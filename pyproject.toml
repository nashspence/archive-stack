[tool.uv.workspace]
members = [
  "companions/*/client",
  "companions/*/server",
  "packages/*",
  "riverhog/*",
  "utilities/*",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.35,<2.0",
  "mypy>=1.10,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "reuse>=6,<7",
  "ruff>=0.5,<1.0",
  "types-jsonschema>=4.25,<5.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["companions", "packages", "riverhog", "tests", "utilities"]
markers = [
  "integration: non-contract regression coverage",
]

[tool.mypy]
python_version = "3.12"
strict = true
