[tool.uv.workspace]
members = [
  "companions/*/client",
  "companions/*/server",
  "companions/stove0/extensions",
  "packages/*",
  "riverhog/*",
  "utilities/*",
]

[tool.uv.sources]
riverhog-ftp-adapter-api-client = { workspace = true }
riverhog-provenance = { workspace = true }
riverhog-transform-sdk = { workspace = true }
stove0-api-client = { workspace = true }
stove0-maintained-extensions = { workspace = true }
stove0-media-contracts = { workspace = true }
stove0-protocol = { workspace = true }
stove0-observer-protocol = { workspace = true }
stove0-observer-support = { workspace = true }
stove0-review-contracts = { workspace = true }
stove0-target-protocol = { workspace = true }
stove0-target-support = { workspace = true }
time-formats = { workspace = true }

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43.59,<2.0",
  "httpx2>=2,<3",
  "mypy>=2.3.0,<3.0",
  "packaging>=26,<27",
  "psycopg[binary]>=3.3.4,<4.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=7.1.0,<8.0",
  "reuse>=6,<7",
  "ruff>=0.16.0,<1.0",
  "types-jsonschema>=4.25,<5.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
testpaths = ["companions", "packages", "riverhog", "tests", "utilities"]
markers = [
  "integration: non-contract regression coverage",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "riverhog_provenance.linux"
# OSError.errno is typed as optional even on the caught native failures whose
# numeric code is preserved for diagnostic rendering.
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "riverhog_provenance.macos"
# The non-Darwin host stubs cannot express Darwin errno and native ABI details;
# live macOS CI qualifies the implementation itself.
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "riverhog_provenance.windows"
# The non-Windows host stubs intentionally omit ctypes/msvcrt/winreg members;
# live Windows CI qualifies those APIs and their independently typed wrappers.
disable_error_code = ["attr-defined"]
