[tool.uv.workspace]
members = [
  "companions/*/client",
  "companions/*/server",
  "companions/munchy/server/targets/av1-nvenc",
  "packages/*",
  "riverhog/*",
  "utilities/*",
]

[tool.uv.sources]
munchy-api-client = { workspace = true }
munchy-target-support = { workspace = true }
munchy-workflows = { workspace = true }
time-formats = { workspace = true }

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43.64,<2.0",
  "mypy>=2.3.0,<3.0",
  "psycopg[binary]>=3.3.4,<4.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=7.1.0,<8.0",
  "reuse>=6,<7",
  "ruff>=0.16.1,<1.0",
  "types-jsonschema>=4.25,<5.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["companions", "packages", "riverhog", "tests", "utilities"]
markers = [
  "integration: non-contract regression coverage",
]

[tool.mypy]
python_version = "3.12"
strict = true
