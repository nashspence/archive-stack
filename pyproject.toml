[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-mvp-skeleton"
version = "0.1.0"
description = "MVP skeleton for the riverhog archival API and CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "OpenAI" }]
dependencies = [
  "fastapi>=0.111,<1.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.27,<1.0",
  "h2>=4,<5",
  "rich>=15.0,<16.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
  "PyYAML>=6.0,<7.0",
  "boto3>=1.35,<2.0",
  "opentimestamps-client>=0.7,<1.0",
  "cryptography>=41,<47",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-bdd>=8.1,<9.0",
  "pytest-cov>=5.0,<6.0",
  "jsonschema>=4.25,<5.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "boto3-stubs[s3]>=1.35,<2.0",
  "scipy-stubs>=1.13,<2.0",
  "types-PyYAML>=6.0,<7.0",
]

planner = ["numpy>=2.0,<3.0", "scipy>=1.13,<2.0"]

db = ["psycopg[binary]>=3.2,<4.0", "sqlalchemy>=2.0,<3.0"]

service = ["uvicorn[standard]>=0.30,<1.0"]

[project.scripts]
riverhog-api = "riverhog_api.app:main"
riverhog = "riverhog_cli.main:main"
munchy = "munchy_cli.main:main"
djdan = "djdan.main:main"
jeb = "jeb.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/munchy",
  "src/munchy_cli",
  "src/jeb",
  "src/riverhog_age",
  "src/riverhog_api",
  "src/riverhog_cli",
  "src/riverhog_core",
  "src/djdan",
]

[tool.hatch.build.targets.wheel.force-include]
"contracts/webhooks/operator-notifications.v1.json" = "riverhog_core/contracts/webhooks/operator-notifications.v1.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "acceptance: executable contract scenarios loaded from Gherkin features",
  "api: API-focused contract coverage",
  "cli: CLI-focused contract coverage",
  "integration: non-contract regression coverage",
  "mvp: MVP contract coverage",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = [
  "munchy",
  "munchy_cli",
  "jeb",
  "riverhog_age",
  "riverhog_api",
  "riverhog_cli",
  "riverhog_core",
  "djdan",
]
