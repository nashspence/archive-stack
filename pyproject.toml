[tool.uv.workspace]
members = [
  "companions/*/client",
  "companions/*/server",
  "packages/*",
  "reference/gogurt/listener-host/*",
  "reference/gogurt/mounted-volume/*",
  "reference/riverhog/ingress/*",
  "reference/riverhog/provenance/contracts/*",
  "reference/riverhog/provenance/observers/*",
  "reference/riverhog/storage/*",
  "reference/stove0/observers/*",
  "reference/stove0/targets/*/target",
  "reference/stove0/targets/*/review-sampler",
  "riverhog/*",
  "utilities/*",
]

[tool.uv.sources]
gogurt-core = { workspace = true }
gogurt-listener-runtime = { workspace = true }
gogurt-path-volume-support = { workspace = true }
gogurt-linux-listener-host = { workspace = true }
gogurt-linux-mounted-volume = { workspace = true }
gogurt-macos-listener-host = { workspace = true }
gogurt-macos-mounted-volume = { workspace = true }
gogurt-windows-listener-host = { workspace = true }
gogurt-windows-mounted-volume = { workspace = true }
riverhog-ftp-adapter-api-client = { workspace = true }
riverhog-archive-contracts = { workspace = true }
riverhog-provenance = { workspace = true }
riverhog-provenance-contracts = { workspace = true }
riverhog-provenance-linux-contracts = { workspace = true }
riverhog-provenance-linux-observer = { workspace = true }
riverhog-provenance-macos-contracts = { workspace = true }
riverhog-provenance-macos-observer = { workspace = true }
riverhog-provenance-windows-contracts = { workspace = true }
riverhog-provenance-windows-observer = { workspace = true }
riverhog-storage-adapter-asgi-support = { workspace = true }
riverhog-storage-adapter-protocol = { workspace = true }
riverhog-storage-adapter-s3-support = { workspace = true }
riverhog-storage-adapter-support = { workspace = true }
riverhog-transform-sdk = { workspace = true }
stove0-api-client = { workspace = true }
stove0-media-archive-target-contracts = { workspace = true }
stove0-media-archive-target-support = { workspace = true }
stove0-media-metadata-observer-contracts = { workspace = true }
stove0-media-sampling-observer-contracts = { workspace = true }
stove0-observer-client = { workspace = true }
stove0-protocol = { workspace = true }
stove0-recipe-config = { workspace = true }
stove0-observer-protocol = { workspace = true }
stove0-observer-support = { workspace = true }
stove0-operator-contracts = { workspace = true }
stove0-review-planning = { workspace = true }
stove0-review-target-contracts = { workspace = true }
stove0-review-sampler-client = { workspace = true }
stove0-review-sampler-protocol = { workspace = true }
stove0-review-sampler-support = { workspace = true }
stove0-target-client = { workspace = true }
stove0-target-protocol = { workspace = true }
stove0-target-support = { workspace = true }
time-formats = { workspace = true }

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43.59,<2.0",
  "httpx2>=2,<3",
  "mypy>=2.3.0,<3.0",
  "packaging>=26,<27",
  "psycopg[binary]>=3.3.4,<4.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=7.1.0,<8.0",
  "reuse>=6,<7",
  "ruff>=0.16.0,<1.0",
  "types-jsonschema>=4.25,<5.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
testpaths = ["companions", "packages", "reference", "riverhog", "tests", "utilities"]
markers = [
  "integration: non-contract regression coverage",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "riverhog_provenance_linux_observer"
# OSError.errno is typed as optional even on the caught native failures whose
# numeric code is preserved for diagnostic rendering.
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "riverhog_provenance_macos_observer"
# The non-Darwin host stubs cannot express Darwin errno and native ABI details;
# live macOS CI qualifies the implementation itself.
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "riverhog_provenance_windows_observer"
# The non-Windows host stubs intentionally omit ctypes/msvcrt/winreg members;
# live Windows CI qualifies those APIs and their independently typed wrappers.
disable_error_code = ["attr-defined"]
