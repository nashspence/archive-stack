[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog"
version = "0.1.0"
description = "Encrypted remote collection custody, catalog, and retrieval."
requires-python = ">=3.12"
dependencies = [
  "application-access",
  "argon2-cffi>=23,<26",
  "boto3>=1.35,<2.0",
  "cli-support",
  "cryptography>=41,<47",
  "fastapi>=0.111,<1.0",
  "lifecycle-events",
  "opentimestamps-client>=0.7,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.7,<3.0",
  "rich>=15.0,<16.0",
  "riverhog-age",
  "riverhog-api-client",
  "riverhog-protocol",
  "sqlalchemy>=2.0,<3.0",
  "time-formats",
  "tus-transport",
  "typer>=0.12,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
riverhog-api = "riverhog_api.app:main"
riverhog = "riverhog_cli.main:main"

[tool.uv.sources]
application-access = { workspace = true }
cli-support = { workspace = true }
lifecycle-events = { workspace = true }
riverhog-age = { workspace = true }
riverhog-api-client = { workspace = true }
riverhog-protocol = { workspace = true }
time-formats = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = [
  "src/riverhog_api",
  "src/riverhog_cli",
  "src/riverhog_core",
]
