[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "munchy"
version = "0.1.0"
description = "Media ingest, routing, transformation, and destination handoff."
requires-python = ">=3.12"
dependencies = [
  "application-access",
  "argon2-cffi>=23,<26",
  "cli-support",
  "config-validation",
  "fastapi>=0.111,<1.0",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.25,<5.0",
  "lifecycle-events",
  "munchy-api-client",
  "munchy-config",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=15.0,<16.0",
  "riverhog-api-client",
  "time-formats",
  "tus-transport",
  "typer>=0.12,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
munchy = "munchy_cli.main:main"
munchy-runner = "munchy_runner.main:main"
munchy-av1-nvenc = "munchy_av1_nvenc.main:main"

[tool.uv.sources]
application-access = { workspace = true }
cli-support = { workspace = true }
config-validation = { workspace = true }
lifecycle-events = { workspace = true }
munchy-api-client = { workspace = true }
munchy-config = { workspace = true }
riverhog-api-client = { workspace = true }
time-formats = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = [
  "src/munchy",
  "src/munchy_av1_nvenc",
  "src/munchy_cli",
  "src/munchy_runner",
]
