services:
  munchy-runner:
    build:
      context: ../../..
      dockerfile: apps/munchy/runner/Dockerfile
    image: munchy-runner:latest
    container_name: munchy-runner
    network_mode: host
    restart: unless-stopped
    mem_limit: "2g"
    memswap_limit: "2g"
    stop_grace_period: 30s

    environment:
      MUNCHY_RUNNER_HOST: ${MUNCHY_RUNNER_HOST:-127.0.0.1}
      MUNCHY_RUNNER_PORT: ${MUNCHY_RUNNER_PORT:-8092}
      MUNCHY_RUNNER_STATE_DIR: /state
      MUNCHY_RUNNER_WORK_DIR: /work
      MUNCHY_RUNNER_TUSD_DIR: /tusd
      MUNCHY_RUNNER_TUSD_INTERNAL_BASE_URL: ${MUNCHY_RUNNER_TUSD_INTERNAL_BASE_URL:-http://127.0.0.1:8093/files}
      MUNCHY_RUNNER_TUSD_PUBLIC_BASE_URL: ${MUNCHY_RUNNER_TUSD_PUBLIC_BASE_URL:-http://127.0.0.1:8093/files}
      MUNCHY_RUNNER_TUSD_HOOK_SECRET: ${MUNCHY_RUNNER_TUSD_HOOK_SECRET:-dev-munchy-runner-hook-secret}
      MUNCHY_RUNNER_ADMIN_TOKEN: ${MUNCHY_RUNNER_ADMIN_TOKEN:-}
      MUNCHY_RUNNER_APPLICATION_AUTH_REQUIRED: ${MUNCHY_RUNNER_APPLICATION_AUTH_REQUIRED:-1}
      MUNCHY_RUNNER_TUSD_PUBLIC_SIGNING_SECRET: ${MUNCHY_RUNNER_TUSD_PUBLIC_SIGNING_SECRET:-}
      MUNCHY_RUNNER_STATE_DB: ${MUNCHY_RUNNER_STATE_DB:-/state/runner.sqlite3}
      MUNCHY_RUNNER_DEBUG_DIR: ${MUNCHY_RUNNER_DEBUG_DIR:-/state/debug}
      MUNCHY_RUNNER_LOG_LEVEL: ${MUNCHY_RUNNER_LOG_LEVEL:-INFO}
      MUNCHY_RUNNER_HTTPX_LOG_LEVEL: ${MUNCHY_RUNNER_HTTPX_LOG_LEVEL:-WARNING}
      MUNCHY_RUNNER_UVICORN_LOG_LEVEL: ${MUNCHY_RUNNER_UVICORN_LOG_LEVEL:-info}
      MUNCHY_RUNNER_GPU_RUNTIME_DIR: /gpu-runtime/munchy-av1-nvenc
      MUNCHY_RUNNER_GPU_MANAGER_URL: ${MUNCHY_RUNNER_GPU_MANAGER_URL:-http://127.0.0.1:8080}
      MUNCHY_RUNNER_GPU_TARGET_URL: ${MUNCHY_RUNNER_GPU_TARGET_URL:-http://127.0.0.1:8000}
      MUNCHY_RUNNER_GPU_TARGET: ${MUNCHY_RUNNER_GPU_TARGET:-munchy-av1-nvenc}
      MUNCHY_RUNNER_GPU_LEASE_TTL_S: ${MUNCHY_RUNNER_GPU_LEASE_TTL_S:-28800}
      MUNCHY_RUNNER_GPU_WAIT_S: ${MUNCHY_RUNNER_GPU_WAIT_S:-300}
      MUNCHY_RUNNER_GPU_REPOST_SECONDS: ${MUNCHY_RUNNER_GPU_REPOST_SECONDS:-120}
      MUNCHY_RUNNER_MIN_FREE_BYTES: ${MUNCHY_RUNNER_MIN_FREE_BYTES:-10737418240}
      MUNCHY_RUNNER_GPU_SCRATCH_MULTIPLIER: ${MUNCHY_RUNNER_GPU_SCRATCH_MULTIPLIER:-2.5}
      MUNCHY_RUNNER_EAGER_ARCHIVE_SCRATCH_MULTIPLIER: ${MUNCHY_RUNNER_EAGER_ARCHIVE_SCRATCH_MULTIPLIER:-0.5}
      MUNCHY_RUNNER_REVIEW_SCRATCH_EXTRA_MULTIPLIER: ${MUNCHY_RUNNER_REVIEW_SCRATCH_EXTRA_MULTIPLIER:-0.35}
      MUNCHY_RUNNER_BUFFERED_HANDOFF_SCRATCH_EXTRA_MULTIPLIER: ${MUNCHY_RUNNER_BUFFERED_HANDOFF_SCRATCH_EXTRA_MULTIPLIER:-1.25}
      MUNCHY_RUNNER_MAX_ACTIVE_INPUT_UPLOADS: ${MUNCHY_RUNNER_MAX_ACTIVE_INPUT_UPLOADS:-8}
      MUNCHY_RUNNER_MAX_RUNNING_JOBS: ${MUNCHY_RUNNER_MAX_RUNNING_JOBS:-1}
      MUNCHY_RUNNER_HANDOFF_ATTEMPTS: ${MUNCHY_RUNNER_HANDOFF_ATTEMPTS:-3}
      MUNCHY_RUNNER_RESUME_ON_START: ${MUNCHY_RUNNER_RESUME_ON_START:-1}
      MUNCHY_RUNNER_LOCAL_CLEANUP_MIN_AGE_HOURS: ${MUNCHY_RUNNER_LOCAL_CLEANUP_MIN_AGE_HOURS:-24}
      MUNCHY_RUNNER_INPUT_UPLOAD_TTL_HOURS: ${MUNCHY_RUNNER_INPUT_UPLOAD_TTL_HOURS:-24}
      MUNCHY_RUNNER_ORPHAN_INPUT_UPLOAD_TTL_HOURS: ${MUNCHY_RUNNER_ORPHAN_INPUT_UPLOAD_TTL_HOURS:-24}
      MUNCHY_RUNNER_CLEANUP_INTERVAL_SECONDS: ${MUNCHY_RUNNER_CLEANUP_INTERVAL_SECONDS:-3600}
      MUNCHY_RUNNER_EAGER_ARCHIVE_BATCH_FILES: ${MUNCHY_RUNNER_EAGER_ARCHIVE_BATCH_FILES:-32}
      MUNCHY_RUNNER_EAGER_ARCHIVE_PIPELINE_BATCHES: ${MUNCHY_RUNNER_EAGER_ARCHIVE_PIPELINE_BATCHES:-3}
      MUNCHY_RUNNER_EAGER_ARCHIVE_WAIT_SECONDS: ${MUNCHY_RUNNER_EAGER_ARCHIVE_WAIT_SECONDS:-5}
      MUNCHY_RUNNER_AUDIO_ARCHIVE_WORKERS: ${MUNCHY_RUNNER_AUDIO_ARCHIVE_WORKERS:-2}
      MUNCHY_RUNNER_AUDIO_BITRATE: ${MUNCHY_RUNNER_AUDIO_BITRATE:-128k}
      MUNCHY_RUNNER_STORAGE_WAIT_SECONDS: ${MUNCHY_RUNNER_STORAGE_WAIT_SECONDS:-60}
      MUNCHY_RUNNER_RIVERHOG_HANDOFF_ENABLED: ${MUNCHY_RUNNER_RIVERHOG_HANDOFF_ENABLED:-0}
      MUNCHY_RUNNER_RIVERHOG_HANDOFF_CHUNK_BYTES: ${MUNCHY_RUNNER_RIVERHOG_HANDOFF_CHUNK_BYTES:-8388608}
      MUNCHY_RUNNER_RIVERHOG_HANDOFF_WORKERS: ${MUNCHY_RUNNER_RIVERHOG_HANDOFF_WORKERS:-8}
      MUNCHY_RUNNER_RIVERHOG_EAGER_HANDOFF_FILES_PER_TICK: ${MUNCHY_RUNNER_RIVERHOG_EAGER_HANDOFF_FILES_PER_TICK:-128}
      MUNCHY_RUNNER_RIVERHOG_EAGER_HANDOFF_BYTES_PER_TICK: ${MUNCHY_RUNNER_RIVERHOG_EAGER_HANDOFF_BYTES_PER_TICK:-536870912}
      MUNCHY_RUNNER_RIVERHOG_EAGER_HANDOFF_SECONDS_PER_TICK: ${MUNCHY_RUNNER_RIVERHOG_EAGER_HANDOFF_SECONDS_PER_TICK:-8}
      MUNCHY_RUNNER_RIVERHOG_EAGER_HANDOFF_INTERVAL_SECONDS: ${MUNCHY_RUNNER_RIVERHOG_EAGER_HANDOFF_INTERVAL_SECONDS:-1}
      MUNCHY_RUNNER_RIVERHOG_HANDOFF_SAVE_EVERY_FILES: ${MUNCHY_RUNNER_RIVERHOG_HANDOFF_SAVE_EVERY_FILES:-32}
      MUNCHY_RUNNER_RIVERHOG_HANDOFF_SAVE_EVERY_SECONDS: ${MUNCHY_RUNNER_RIVERHOG_HANDOFF_SAVE_EVERY_SECONDS:-5}
      MUNCHY_RUNNER_RIVERHOG_FINALIZE_POLL_SECONDS: ${MUNCHY_RUNNER_RIVERHOG_FINALIZE_POLL_SECONDS:-5}
      RIVERHOG_BASE_URL: ${RIVERHOG_BASE_URL:-}
      RIVERHOG_UPLOAD_BASE_URL: ${RIVERHOG_UPLOAD_BASE_URL:-}
      RIVERHOG_TOKEN: ${RIVERHOG_TOKEN:-}
      RIVERHOG_HOST_HEADER: ${RIVERHOG_HOST_HEADER:-}
      RIVERHOG_TLS_VERIFY: ${RIVERHOG_TLS_VERIFY:-true}
      RIVERHOG_HTTP_TIMEOUT_SECONDS: ${RIVERHOG_HTTP_TIMEOUT_SECONDS:-30}
      RIVERHOG_HTTP2: ${RIVERHOG_HTTP2:-false}
      RIVERHOG_UPLOAD_TIMEOUT_SECONDS: ${RIVERHOG_UPLOAD_TIMEOUT_SECONDS:-60}
      RIVERHOG_UPLOAD_HTTP2: ${MUNCHY_RUNNER_RIVERHOG_HANDOFF_HTTP2:-false}
      MUNCHY_RUNNER_UPSTREAM_EVENT_POLL_SECONDS: ${MUNCHY_RUNNER_UPSTREAM_EVENT_POLL_SECONDS:-5}
      MUNCHY_RUNNER_EVENT_SOURCE: ${MUNCHY_RUNNER_EVENT_SOURCE:-urn:munchy}
      MUNCHY_RUNNER_EVENT_CONTEXT_RETENTION: ${MUNCHY_RUNNER_EVENT_CONTEXT_RETENTION:-30d}
      MUNCHY_RUNNER_EVENT_REPEAT_INTERVAL: ${MUNCHY_RUNNER_EVENT_REPEAT_INTERVAL:-24h}
      MUNCHY_RUNNER_EVENT_REPEAT_TIME: ${MUNCHY_RUNNER_EVENT_REPEAT_TIME:-}
      MUNCHY_RUNNER_EVENT_REPEAT_TIMEZONE: ${MUNCHY_RUNNER_EVENT_REPEAT_TIMEZONE:-UTC}
      MUNCHY_RUNNER_EXTERNAL_HANDOFF_ENABLED: ${MUNCHY_RUNNER_EXTERNAL_HANDOFF_ENABLED:-1}
      MUNCHY_RUNNER_COMMAND_HANDOFF_COMMAND: ${MUNCHY_RUNNER_COMMAND_HANDOFF_COMMAND:-}
      MUNCHY_RUNNER_RCLONE_HANDOFF_COMMAND: ${MUNCHY_RUNNER_RCLONE_HANDOFF_COMMAND:-rclone}
      RCLONE_CONFIG: ${MUNCHY_RUNNER_RCLONE_CONFIG:-/rclone/rclone.conf}
      MUNCHY_RUNNER_HANDOFF_RETRY_INITIAL_SECONDS: ${MUNCHY_RUNNER_HANDOFF_RETRY_INITIAL_SECONDS:-30}
      MUNCHY_RUNNER_HANDOFF_RETRY_MAX_SECONDS: ${MUNCHY_RUNNER_HANDOFF_RETRY_MAX_SECONDS:-3600}
      TZ: America/Los_Angeles

    volumes:
      - ${MUNCHY_RUNNER_STATE_HOST_DIR:-./runtime/state}:/state
      - ${MUNCHY_RUNNER_WORK_HOST_DIR:-./runtime/work}:/work
      - ${MUNCHY_RUNNER_TUSD_HOST_DIR:-./runtime/tusd}:/tusd
      - ${MUNCHY_RUNNER_RCLONE_HOST_DIR:-./runtime/rclone}:/rclone:ro
      - ${MUNCHY_RUNNER_GPU_RUNTIME_HOST_DIR:-./runtime/gpu-targets}:/gpu-runtime

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${MUNCHY_RUNNER_PORT:-8092}/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  munchy-runner-tusd:
    image: tusproject/tusd:v2.8.0
    container_name: munchy-runner-tusd
    network_mode: host
    user: "0:0"
    restart: unless-stopped
    command:
      - "-host"
      - "127.0.0.1"
      - "-port"
      - "8093"
      - "-base-path"
      - "/files/"
      - "-upload-dir"
      - "/uploads"
      - "-hooks-http"
      - "http://127.0.0.1:8092/internal/tusd/hooks"
      - "-hooks-http-forward-headers"
      - "X-Munchy-Runner-Tusd-Hook-Secret"
      - "-hooks-enabled-events"
      - "pre-create,post-finish"
    volumes:
      - ${MUNCHY_RUNNER_TUSD_HOST_DIR:-./runtime/tusd}:/uploads

  munchy-runner-lan-gateway:
    image: nginx:1.27-alpine
    container_name: munchy-runner-lan-gateway
    network_mode: host
    restart: unless-stopped
    depends_on:
      - munchy-runner
      - munchy-runner-tusd
    environment:
      MUNCHY_GATEWAY_BIND_ADDR: ${MUNCHY_GATEWAY_BIND_ADDR:-127.0.0.1}
      NGINX_ENVSUBST_FILTER: ^MUNCHY_GATEWAY_BIND_ADDR$
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./config/nginx-lan-gateway.conf:/etc/nginx/templates/nginx.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
