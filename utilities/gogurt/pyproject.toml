[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "gogurt"
version = "0.1.0"
description = "Mounted-volume marker actions for macOS operators."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "config-validation>=0.1,<0.2",
  "riverhog-cli-support>=0.1,<0.2",
  "typer>=0.12,<1.0",
]

[project.scripts]
gogurt = "gogurt.cli:main"

[tool.uv.sources]
config-validation = { workspace = true }
riverhog-cli-support = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/gogurt"]

[tool.hatch.build.targets.wheel.force-include]
"macos/io.github.nashspence.gogurt.plist" = "gogurt/macos/io.github.nashspence.gogurt.plist"
"macos/gogurt.swift" = "gogurt/macos/gogurt.swift"
