[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mango-fish"
version = "0.1.0"
description = "Credentialed CloudEvents cursor logs delivered unchanged to webhooks."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1.0",
  "lifecycle-events",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
mango-fish = "mango_fish.cli:main"

[tool.uv.sources]
lifecycle-events = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mango_fish"]

