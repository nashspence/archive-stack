services:
  jeb:
    build:
      context: ../..
      dockerfile: services/jeb/Dockerfile
    image: jeb:latest
    restart: unless-stopped
    env_file:
      - ../../config/examples/jeb/jeb.env
    environment:
      JEB_HEALTH_HOST: 0.0.0.0
      JEB_HEALTH_PORT: "8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import json, urllib.request;
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=5));
          assert payload['status'] == 'ok'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing
      - type: bind
        source: ${JEB_STATE_HOST_DIR:-./runtime/state}
        target: /state

  jeb-tusd:
    image: tusproject/tusd:v2.8.0
    restart: unless-stopped
    depends_on:
      jeb:
        condition: service_healthy
      jeb-ingress-init:
        condition: service_completed_successfully
    command:
      - -host
      - 0.0.0.0
      - -port
      - "1080"
      - -base-path
      - /jeb/files/
      - -behind-proxy
      - -disable-download
      - -upload-dir
      - /landing/.ingress/tus
      - -hooks-http
      - http://jeb:8081/internal/ingress/tus/hooks
      - -hooks-http-forward-headers
      - Authorization
      - -hooks-enabled-events
      - pre-create,post-finish
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing

  jeb-ingress-init:
    image: alpine:3.22
    restart: "no"
    command:
      - sh
      - -c
      - install -d -o 1000 -g 1000 -m 770 /landing/.ingress /landing/.ingress/tus
    volumes:
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing

  jeb-tus:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - jeb
      - jeb-tusd
    ports:
      - "${JEB_TUS_PORT:-1081}:1081"
    volumes:
      - type: bind
        source: ./adapters/tus/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true

  jeb-ftp:
    image: stilliard/pure-ftpd:trixie-latest
    restart: unless-stopped
    env_file:
      - ../../config/examples/jeb/jeb.env
    ports:
      - "${JEB_FTP_PORT:-21}:21"
      - "${JEB_FTP_PASSIVE_PORT_START:-30000}-${JEB_FTP_PASSIVE_PORT_END:-30039}:30000-30039"
    environment:
      FTP_PASSIVE_PORTS: ${JEB_FTP_PASSIVE_PORT_START:-30000}:${JEB_FTP_PASSIVE_PORT_END:-30039}
    volumes:
      - type: bind
        source: ./adapters/ftp/bootstrap-users.sh
        target: /usr/local/bin/bootstrap-users
        read_only: true
      - type: bind
        source: ${JEB_LANDING_HOST_DIR:-./runtime/landing}
        target: /landing
    command: ["/usr/local/bin/bootstrap-users"]
