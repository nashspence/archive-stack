services:
  ftpd:
    image: stilliard/pure-ftpd:trixie-latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FTPD_PORT:-21}:21"
      - "${FTPD_PASSIVE_PORT_START:-30000}-${FTPD_PASSIVE_PORT_END:-30039}:30000-30039"
    environment:
      PUBLICHOST: ${FTPD_PUBLICHOST:?set FTPD_PUBLICHOST}
      FTP_UID: ${FTPD_UID:-1000}
      FTP_GID: ${FTPD_GID:-1000}
      FTP_ROOT: /home/ftpusers
      FTPD_USERS: ${FTPD_USERS:?set FTPD_USERS}
      FTPD_MAX_CLIENTS: ${FTPD_MAX_CLIENTS:-40}
      FTPD_MAX_CONNECTIONS: ${FTPD_MAX_CONNECTIONS:-8}
      FTP_PASSIVE_PORTS: ${FTPD_PASSIVE_PORT_START:-30000}:${FTPD_PASSIVE_PORT_END:-30039}
    volumes:
      - type: bind
        source: ./bootstrap-users.sh
        target: /usr/local/bin/bootstrap-users
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FTPD_USERS_DIR:-./runtime/ftpusers}
        target: /home/ftpusers
      - type: bind
        source: ${FTPD_PASSWD_DIR:-./runtime/passwd}
        target: /etc/pure-ftpd/passwd
    command: ["/usr/local/bin/bootstrap-users"]
