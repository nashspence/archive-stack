[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-client"
version = "0.1.0"
description = "Command-line client for the Riverhog custody platform."
requires-python = ">=3.12"
dependencies = [
  "cli-support",
  "httpx>=0.27,<1.0",
  "rich>=15.0,<16.0",
  "riverhog-age",
  "riverhog-api-client",
  "riverhog-protocol",
  "time-formats",
  "tus-transport",
  "typer>=0.12,<1.0",
]

[project.scripts]
riverhog = "riverhog_cli.main:main"

[tool.uv.sources]
cli-support = { workspace = true }
riverhog-age = { workspace = true }
riverhog-api-client = { workspace = true }
riverhog-protocol = { workspace = true }
time-formats = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_cli"]
