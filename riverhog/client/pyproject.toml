[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-client"
version = "0.1.0"
description = "Command-line client for the Riverhog archive platform."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "alembic>=1.18.5,<2.0",
  "httpx>=0.27,<1.0",
  "rich>=15.0,<16.0",
  "riverhog-api-client>=0.1,<0.2",
  "riverhog-application-access>=0.1,<0.2",
  "riverhog-cli-support>=0.1,<0.2",
  "riverhog-protocol>=0.1,<0.2",
  "riverhog-provenance>=0.1,<0.2",
  "state-schema>=0.1,<0.2",
  "SQLAlchemy>=2.0,<3.0",
  "time-formats>=0.1,<0.2",
  "typer>=0.12,<1.0",
]

[project.scripts]
riverhog = "riverhog_cli.main:main"

[tool.uv.sources]
riverhog-api-client = { workspace = true }
riverhog-application-access = { workspace = true }
riverhog-cli-support = { workspace = true }
riverhog-protocol = { workspace = true }
riverhog-provenance = { workspace = true }
state-schema = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_cli"]
