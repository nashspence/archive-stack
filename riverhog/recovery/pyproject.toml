[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-recover"
version = "0.1.0"
description = "Independent recovery tool for Riverhog archive copies."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "riverhog-archive-contracts>=0.1,<0.2",
  "riverhog-provenance>=0.1,<0.2",
]

[tool.uv.sources]
riverhog-archive-contracts = { workspace = true }
riverhog-provenance = { workspace = true }

[project.scripts]
riverhog-recover = "riverhog_recover.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_recover"]
