server {
    listen 1081;

    client_max_body_size 256m;
    client_body_timeout 300s;
    send_timeout 300s;

    location = /_riverhog_tus_auth {
        internal;
        proxy_pass http://adapter:8080/internal/tus/auth;
        proxy_pass_request_body off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Length "";
    }

    location ^~ /files/ {
        auth_request /_riverhog_tus_auth;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://tusd:1080;
    }

    location ^~ /v1/tus-publications/ {
        auth_request /_riverhog_tus_auth;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Content-SHA256 $http_x_content_sha256;
        proxy_pass http://adapter:8080;
    }
}
