[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-ftp-adapter"
version = "0.1.0"
description = "Content-opaque FTP producer for finalized Riverhog collections."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "fastapi>=0.111,<1.0",
  "http-api-contracts>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "riverhog-api-client>=0.1,<0.2",
  "riverhog-ftp-adapter-api-client>=0.1,<0.2",
  "riverhog-protocol>=0.1,<0.2",
  "riverhog-provenance>=0.1,<0.2",
  "starlette>=0.37,<2.0",
  "uvicorn[standard]>=0.52.3,<1.0",
]

[project.scripts]
riverhog-ftp-adapter = "riverhog_ftp_adapter.app:main"

[tool.uv.sources]
http-api-contracts = { workspace = true }
riverhog-ftp-adapter-api-client = { workspace = true }
riverhog-api-client = { workspace = true }
riverhog-protocol = { workspace = true }
riverhog-provenance = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_ftp_adapter"]
