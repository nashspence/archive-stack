[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-server"
version = "0.1.0"
description = "Encrypted archive management, catalog, and retrieval."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "alembic>=1.18.5,<2.0",
  "riverhog-application-access>=0.1,<0.2",
  "fastapi>=0.111,<1.0",
  "http-api-contracts>=0.1,<0.2",
  "lifecycle-events>=0.1,<0.2",
  "opentimestamps-client>=0.7,<1.0",
  "psycopg[binary]>=3.3.4,<4.0",
  "pydantic>=2.7,<3.0",
  "riverhog-age>=0.1,<0.2",
  "riverhog-archive-contracts>=0.1,<0.2",
  "riverhog-protocol>=0.1,<0.2",
  "riverhog-provenance>=0.1,<0.2",
  "riverhog-provenance-contracts>=0.1,<0.2",
  "riverhog-storage-adapter-protocol>=0.1,<0.2",
  "riverhog-storage-adapter-support>=0.1,<0.2",
  "sqlalchemy>=2.0,<3.0",
  "starlette>=0.37,<2.0",
  "state-schema>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
riverhog-api = "riverhog_api.app:main"

[tool.uv.sources]
riverhog-application-access = { workspace = true }
http-api-contracts = { workspace = true }
lifecycle-events = { workspace = true }
riverhog-age = { workspace = true }
riverhog-archive-contracts = { workspace = true }
riverhog-protocol = { workspace = true }
riverhog-provenance = { workspace = true }
riverhog-provenance-contracts = { workspace = true }
riverhog-storage-adapter-protocol = { workspace = true }
riverhog-storage-adapter-support = { workspace = true }
state-schema = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = [
  "src/riverhog_api",
  "src/riverhog_core",
]
