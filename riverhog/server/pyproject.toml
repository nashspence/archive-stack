[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-server"
version = "0.1.0"
description = "Encrypted remote collection custody, catalog, and retrieval."
requires-python = ">=3.12"
dependencies = [
  "application-access",
  "argon2-cffi>=23,<26",
  "boto3>=1.35,<2.0",
  "cryptography>=41,<47",
  "fastapi>=0.111,<1.0",
  "httpx[http2]>=0.27,<1.0",
  "lifecycle-events",
  "opentimestamps-client>=0.7,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.7,<3.0",
  "riverhog-age",
  "riverhog-protocol",
  "sqlalchemy>=2.0,<3.0",
  "time-formats",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
riverhog-api = "riverhog_api.app:main"

[tool.uv.sources]
application-access = { workspace = true }
lifecycle-events = { workspace = true }
riverhog-age = { workspace = true }
riverhog-protocol = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = [
  "src/riverhog_api",
  "src/riverhog_core",
]
