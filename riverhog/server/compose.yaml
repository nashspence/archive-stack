x-riverhog-environment: &riverhog-environment
  RIVERHOG_BOOTSTRAP_TOKEN: ${RIVERHOG_BOOTSTRAP_TOKEN:-riverhog-development-bootstrap-token}
  RIVERHOG_LOG_LEVEL: ${RIVERHOG_LOG_LEVEL:-INFO}
  RIVERHOG_DATABASE_URL: ${RIVERHOG_DATABASE_URL:-postgresql+psycopg://riverhog:riverhog@postgres:5432/riverhog}
  RIVERHOG_PUBLIC_BASE_URL: ${RIVERHOG_PUBLIC_BASE_URL-}
  RIVERHOG_ARCHIVE_STORES: ${RIVERHOG_ARCHIVE_STORES:-archive}
  RIVERHOG_ARCHIVE_WRITE_STORE: ${RIVERHOG_ARCHIVE_WRITE_STORE:-archive}
  RIVERHOG_ARCHIVE_READ_ORDER: ${RIVERHOG_ARCHIVE_READ_ORDER:-archive}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_URL: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_URL:-http://archive-adapter:8080}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_TOKEN_FILE: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_TOKEN_FILE:-/run/secrets/riverhog-storage-adapter.token}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_ALLOW_INSECURE_HTTP: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_ALLOW_INSECURE_HTTP:-true}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_MAX_CONNECTIONS: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_MAX_CONNECTIONS:-32}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_TIMEOUT_SECONDS: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_ADAPTER_TIMEOUT_SECONDS:-300}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_MONTHLY_DOWNLOAD_ALLOWANCE_BYTES: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_MONTHLY_DOWNLOAD_ALLOWANCE_BYTES:-}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_DOWNLOAD_SAFETY_BUFFER_BYTES: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_DOWNLOAD_SAFETY_BUFFER_BYTES:-0B}
  RIVERHOG_RETRIEVAL_CACHE_WRITE_SEGMENT_BYTES: ${RIVERHOG_RETRIEVAL_CACHE_WRITE_SEGMENT_BYTES:-64MiB}
  RIVERHOG_ARCHIVE_WRITE_CONCURRENCY: ${RIVERHOG_ARCHIVE_WRITE_CONCURRENCY:-4}
  RIVERHOG_ARCHIVE_PREPARE_CONCURRENCY: ${RIVERHOG_ARCHIVE_PREPARE_CONCURRENCY:-8}
  RIVERHOG_ARCHIVE_UPLOAD_REQUEST_CONCURRENCY: ${RIVERHOG_ARCHIVE_UPLOAD_REQUEST_CONCURRENCY:-4}
  RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASES: ${RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASES:-false}
  RIVERHOG_ARCHIVE_PASSPHRASES_JSON: ${RIVERHOG_ARCHIVE_PASSPHRASES_JSON:-}
  RIVERHOG_ARCHIVE_ACTIVE_PASSPHRASE_ID: ${RIVERHOG_ARCHIVE_ACTIVE_PASSPHRASE_ID:-}
  RIVERHOG_ARCHIVE_SCRYPT_WORK_FACTOR: ${RIVERHOG_ARCHIVE_SCRYPT_WORK_FACTOR:-18}
  RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL:-30s}
  RIVERHOG_COLLECTION_UPLOAD_CUSTODY_LEASE: ${RIVERHOG_COLLECTION_UPLOAD_CUSTODY_LEASE:-1h}
  RIVERHOG_INGRESS_MAX_INFLIGHT_BYTES: ${RIVERHOG_INGRESS_MAX_INFLIGHT_BYTES:-1280MiB}
  RIVERHOG_INGRESS_SOURCE_READ_CHUNK_BYTES: ${RIVERHOG_INGRESS_SOURCE_READ_CHUNK_BYTES:-8MiB}
  RIVERHOG_AGE_SESSION_CACHE_ENTRIES: ${RIVERHOG_AGE_SESSION_CACHE_ENTRIES:-128}
  RIVERHOG_AGE_SESSION_DERIVATION_CONCURRENCY: ${RIVERHOG_AGE_SESSION_DERIVATION_CONCURRENCY:-4}

  RIVERHOG_RETRIEVAL_CACHE_STORES: ${RIVERHOG_RETRIEVAL_CACHE_STORES:-local,elastic}
  RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_URL: ${RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_URL:-http://filesystem-cache-adapter:8080}
  RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_TOKEN_FILE: ${RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_TOKEN_FILE:-/run/secrets/riverhog-storage-adapter.token}
  RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_ALLOW_INSECURE_HTTP: ${RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_ALLOW_INSECURE_HTTP:-true}
  RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_MAX_CONNECTIONS: ${RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_MAX_CONNECTIONS:-32}
  RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_TIMEOUT_SECONDS: ${RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADAPTER_TIMEOUT_SECONDS:-300}
  RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADMISSION_ENABLED: ${RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADMISSION_ENABLED:-true}
  RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADMISSION_BUDGET_BYTES: ${RIVERHOG_RETRIEVAL_CACHE_LOCAL_ADMISSION_BUDGET_BYTES:-1MiB}
  RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_URL: ${RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_URL:-http://elastic-cache-adapter:8080}
  RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_TOKEN_FILE: ${RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_TOKEN_FILE:-/run/secrets/riverhog-storage-adapter.token}
  RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_ALLOW_INSECURE_HTTP: ${RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_ALLOW_INSECURE_HTTP:-true}
  RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_MAX_CONNECTIONS: ${RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_MAX_CONNECTIONS:-32}
  RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_TIMEOUT_SECONDS: ${RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADAPTER_TIMEOUT_SECONDS:-300}
  RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADMISSION_ENABLED: ${RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADMISSION_ENABLED:-true}
  RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADMISSION_BUDGET_BYTES: ${RIVERHOG_RETRIEVAL_CACHE_ELASTIC_ADMISSION_BUDGET_BYTES:-}
  RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_ENABLED: ${RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_ENABLED:-true}
  RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_LEASE: ${RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_LEASE:-72h}
  RIVERHOG_RETRIEVAL_DEFAULT_LEASE: ${RIVERHOG_RETRIEVAL_DEFAULT_LEASE:-24h}
  RIVERHOG_RETRIEVAL_MAX_LEASE: ${RIVERHOG_RETRIEVAL_MAX_LEASE:-7d}
  RIVERHOG_RETRIEVAL_PENDING_TIMEOUT: ${RIVERHOG_RETRIEVAL_PENDING_TIMEOUT:-72h}
  RIVERHOG_RETRIEVAL_CACHE_SWEEP_INTERVAL: ${RIVERHOG_RETRIEVAL_CACHE_SWEEP_INTERVAL:-5m}
  RIVERHOG_RETRIEVAL_RESTORE_POLL_INTERVAL: ${RIVERHOG_RETRIEVAL_RESTORE_POLL_INTERVAL:-5m}
  RIVERHOG_RETRIEVAL_ESTIMATED_LATENCY: ${RIVERHOG_RETRIEVAL_ESTIMATED_LATENCY:-48h}
  RIVERHOG_RETRIEVAL_REQUEST_CONCURRENCY: ${RIVERHOG_RETRIEVAL_REQUEST_CONCURRENCY:-8}
  RIVERHOG_RETRIEVAL_MAX_INFLIGHT_BYTES: ${RIVERHOG_RETRIEVAL_MAX_INFLIGHT_BYTES:-1GiB}
  RIVERHOG_RETRIEVAL_READ_CHUNK_BYTES: ${RIVERHOG_RETRIEVAL_READ_CHUNK_BYTES:-8MiB}
  RIVERHOG_EVENT_SOURCE: ${RIVERHOG_EVENT_SOURCE:-urn:riverhog}
  RIVERHOG_EVENT_CONTEXT_RETENTION: ${RIVERHOG_EVENT_CONTEXT_RETENTION:-30d}
  RIVERHOG_EVENT_CONTEXT_REAP_BATCH_SIZE: ${RIVERHOG_EVENT_CONTEXT_REAP_BATCH_SIZE:-100}
  RIVERHOG_BROWSE_TOKEN_SIGNING_KEY: ${RIVERHOG_BROWSE_TOKEN_SIGNING_KEY:-riverhog-development-browse-token-signing-key-v1}
  RIVERHOG_BROWSE_REQUIRE_EXPLICIT_SIGNING_KEY: ${RIVERHOG_BROWSE_REQUIRE_EXPLICIT_SIGNING_KEY:-false}
  RIVERHOG_BROWSE_TOKEN_LIFETIME: ${RIVERHOG_BROWSE_TOKEN_LIFETIME:-24h}
  RIVERHOG_CATALOG_SYNC_BOOTSTRAP_LIFETIME: ${RIVERHOG_CATALOG_SYNC_BOOTSTRAP_LIFETIME:-7d}
  RIVERHOG_CATALOG_SYNC_CURSOR_LIFETIME: ${RIVERHOG_CATALOG_SYNC_CURSOR_LIFETIME:-24h}
  RIVERHOG_CATALOG_SYNC_HISTORY_RETENTION: ${RIVERHOG_CATALOG_SYNC_HISTORY_RETENTION:-30d}
  RIVERHOG_CATALOG_SYNC_PAGE_SIZE_MAX: ${RIVERHOG_CATALOG_SYNC_PAGE_SIZE_MAX:-100}
  RIVERHOG_CATALOG_SYNC_HISTORY_REAP_BATCH_SIZE: ${RIVERHOG_CATALOG_SYNC_HISTORY_REAP_BATCH_SIZE:-100}
services:
  garage:
    profiles: ["development"]
    image: dxflrs/garage:b72b090a097c8ee2711c8fb065d250ed68dcd0bf@sha256:f22f09abe741e54ab244e95638310e040b81eda41e2c6ab9b7373cda4b9e955c
    volumes:
      - garage-data:/var/lib/garage
      - ../../tests/harness/garage.toml:/etc/garage.toml:ro

  archive-adapter:
    profiles: ["development"]
    image: riverhog-test:dev
    build:
      context: ../..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    entrypoint: ["python", "-m", "tests.harness.garage_storage_adapter"]
    environment:
      RIVERHOG_GARAGE_STORAGE_ADAPTER_TOKEN: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_TOKEN:-riverhog-development-storage-adapter-token}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ENDPOINT_URL: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_ENDPOINT_URL:-http://garage:3900}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_REGION: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_REGION:-garage}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_BUCKET: ${RIVERHOG_GARAGE_ARCHIVE_BUCKET:-riverhog-archive}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ACCESS_KEY_ID: ${RIVERHOG_GARAGE_ARCHIVE_ACCESS_KEY_ID:-GK000000000000000000000002}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_SECRET_ACCESS_KEY: ${RIVERHOG_GARAGE_ARCHIVE_SECRET_ACCESS_KEY:-2222222222222222222222222222222222222222222222222222222222222222}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_READ_MODE: ${RIVERHOG_GARAGE_ARCHIVE_READ_MODE:-restore_required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  filesystem-cache-adapter:
    profiles: ["development"]
    image: riverhog-storage-adapter-filesystem:dev
    build:
      context: ../..
      dockerfile: reference/riverhog/storage/filesystem/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    environment:
      RIVERHOG_FILESYSTEM_STORAGE_ADAPTER_TOKEN_FILE: /run/secrets/riverhog-storage-adapter.token
      RIVERHOG_FILESYSTEM_STORAGE_ADAPTER_ROOT: /var/lib/riverhog-filesystem
      RIVERHOG_FILESYSTEM_STORAGE_ADAPTER_MINIMUM_FREE_BYTES: ${RIVERHOG_FILESYSTEM_STORAGE_ADAPTER_MINIMUM_FREE_BYTES:-0B}
    volumes:
      - filesystem-cache-data:/var/lib/riverhog-filesystem
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH:-../../tests/harness/garage-storage-adapter.token}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  elastic-cache-adapter:
    profiles: ["development"]
    image: riverhog-test:dev
    build:
      context: ../..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    entrypoint: ["python", "-m", "tests.harness.garage_storage_adapter"]
    environment:
      RIVERHOG_GARAGE_STORAGE_ADAPTER_TOKEN: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_TOKEN:-riverhog-development-storage-adapter-token}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ENDPOINT_URL: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_ENDPOINT_URL:-http://garage:3900}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_REGION: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_REGION:-garage}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_BUCKET: ${RIVERHOG_GARAGE_CACHE_BUCKET:-riverhog-cache}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ACCESS_KEY_ID: ${RIVERHOG_GARAGE_CACHE_ACCESS_KEY_ID:-GK000000000000000000000002}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_SECRET_ACCESS_KEY: ${RIVERHOG_GARAGE_CACHE_SECRET_ACCESS_KEY:-2222222222222222222222222222222222222222222222222222222222222222}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_READ_MODE: immediate
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riverhog}
      POSTGRES_USER: ${POSTGRES_USER:-riverhog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riverhog}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-riverhog}\" -d \"${POSTGRES_DB:-riverhog}\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/10-riverhog-prerequisites.sql:/docker-entrypoint-initdb.d/10-riverhog-prerequisites.sql:ro

  state:
    image: riverhog-app:dev
    build:
      context: ../..
      dockerfile: riverhog/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    env_file:
      - path: ${RIVERHOG_COMPOSE_ENV_FILE:-../../.env.compose}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *riverhog-environment
    command: ["state", "upgrade"]

  app:
    image: riverhog-app:dev
    build:
      context: ../..
      dockerfile: riverhog/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    env_file:
      - path: ${RIVERHOG_COMPOSE_ENV_FILE:-../../.env.compose}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      state:
        condition: service_completed_successfully
    environment: *riverhog-environment
    volumes:
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH:-../../tests/harness/garage-storage-adapter.token}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready')); assert payload == {'service': 'riverhog', 'status': 'ok'}",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    ports:
      - "${RIVERHOG_API_BIND_ADDR:-127.0.0.1}:${RIVERHOG_API_PORT:-8000}:8000"
  test:
    image: riverhog-test:dev
    build:
      context: ../..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    env_file:
      - path: ${RIVERHOG_COMPOSE_ENV_FILE:-../../.env.compose}
        required: false
    environment:
      <<: *riverhog-environment
      PYTHONPATH: /workspace
    volumes:
      - ../..:/workspace
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH:-../../tests/harness/garage-storage-adapter.token}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true

volumes:
  filesystem-cache-data:
  garage-data:
  postgres-data:
