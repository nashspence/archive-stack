x-riverhog-environment: &riverhog-environment
  RIVERHOG_BOOTSTRAP_TOKEN: ${RIVERHOG_BOOTSTRAP_TOKEN:-riverhog-development-bootstrap-token}
  RIVERHOG_LOG_LEVEL: ${RIVERHOG_LOG_LEVEL:-INFO}
  RIVERHOG_DATABASE_URL: ${RIVERHOG_DATABASE_URL:-postgresql+psycopg://riverhog:riverhog@postgres:5432/riverhog}
  RIVERHOG_PUBLIC_BASE_URL: ${RIVERHOG_PUBLIC_BASE_URL-}
  RIVERHOG_STORAGE_ADAPTER_MAX_CONNECTIONS: ${RIVERHOG_STORAGE_ADAPTER_MAX_CONNECTIONS:-32}

  RIVERHOG_STORAGE_ADAPTERS: ${RIVERHOG_STORAGE_ADAPTERS:-archive}
  RIVERHOG_STORAGE_ADAPTER_ARCHIVE_ENDPOINT_URL: ${RIVERHOG_STORAGE_ADAPTER_ARCHIVE_ENDPOINT_URL:-http://garage-storage-adapter:8080}
  RIVERHOG_STORAGE_ADAPTER_ARCHIVE_TOKEN_FILE: ${RIVERHOG_STORAGE_ADAPTER_ARCHIVE_TOKEN_FILE:-/run/secrets/riverhog-storage-adapter-token}
  RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_PROFILE_ID: ${RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_PROFILE_ID:-riverhog.garage-development/v1}
  RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_PROFILE_READ_MODE: ${RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_PROFILE_READ_MODE:-immediate}
  RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_EGRESS_ACCOUNTING_ID: ${RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_EGRESS_ACCOUNTING_ID:-riverhog-garage-development}
  RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_PROFILE_CONTRACT_SHA256: ${RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_PROFILE_CONTRACT_SHA256:-059e3bd9cb31a9eace59d4796c9bcdb88669582748b09f8208832fa07891dfb3}
  RIVERHOG_STORAGE_ADAPTER_ARCHIVE_ALLOW_INSECURE_HTTP: ${RIVERHOG_STORAGE_ADAPTER_ARCHIVE_ALLOW_INSECURE_HTTP:-true}
  RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_IMPLEMENTATION_ID: ${RIVERHOG_STORAGE_ADAPTER_ARCHIVE_EXPECTED_IMPLEMENTATION_ID:-riverhog.garage-storage-adapter/v1}

  RIVERHOG_ARCHIVE_STORES: ${RIVERHOG_ARCHIVE_STORES:-archive}
  RIVERHOG_ARCHIVE_WRITE_STORE: ${RIVERHOG_ARCHIVE_WRITE_STORE:-archive}
  RIVERHOG_ARCHIVE_READ_ORDER: ${RIVERHOG_ARCHIVE_READ_ORDER:-archive}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_STORAGE_ADAPTER: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_STORAGE_ADAPTER:-archive}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_MONTHLY_DOWNLOAD_ALLOWANCE_BYTES: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_MONTHLY_DOWNLOAD_ALLOWANCE_BYTES:-}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_DOWNLOAD_SAFETY_BUFFER_BYTES: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_DOWNLOAD_SAFETY_BUFFER_BYTES:-0B}
  RIVERHOG_ARCHIVE_MULTIPART_PART_BYTES: ${RIVERHOG_ARCHIVE_MULTIPART_PART_BYTES:-64MiB}
  RIVERHOG_ARCHIVE_MULTIPART_CONCURRENCY: ${RIVERHOG_ARCHIVE_MULTIPART_CONCURRENCY:-4}
  RIVERHOG_ARCHIVE_MULTIPART_MAX_AGE: ${RIVERHOG_ARCHIVE_MULTIPART_MAX_AGE:-72h}
  RIVERHOG_ARCHIVE_MULTIPART_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_MULTIPART_SWEEP_INTERVAL:-6h}
  RIVERHOG_ARCHIVE_PREPARE_CONCURRENCY: ${RIVERHOG_ARCHIVE_PREPARE_CONCURRENCY:-8}
  RIVERHOG_ARCHIVE_UPLOAD_REQUEST_CONCURRENCY: ${RIVERHOG_ARCHIVE_UPLOAD_REQUEST_CONCURRENCY:-4}
  RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE: ${RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE:-false}
  RIVERHOG_ARCHIVE_PASSPHRASE: ${RIVERHOG_ARCHIVE_PASSPHRASE:-}
  RIVERHOG_ARCHIVE_SCRYPT_WORK_FACTOR: ${RIVERHOG_ARCHIVE_SCRYPT_WORK_FACTOR:-18}
  RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL:-30s}
  RIVERHOG_INGRESS_MAX_INFLIGHT_BYTES: ${RIVERHOG_INGRESS_MAX_INFLIGHT_BYTES:-1280MiB}
  RIVERHOG_INGRESS_SOURCE_READ_CHUNK_BYTES: ${RIVERHOG_INGRESS_SOURCE_READ_CHUNK_BYTES:-8MiB}
  RIVERHOG_AGE_SESSION_CACHE_ENTRIES: ${RIVERHOG_AGE_SESSION_CACHE_ENTRIES:-128}
  RIVERHOG_AGE_SESSION_DERIVATION_CONCURRENCY: ${RIVERHOG_AGE_SESSION_DERIVATION_CONCURRENCY:-4}

  RIVERHOG_RETRIEVAL_CACHE_STORAGE_ADAPTER: ${RIVERHOG_RETRIEVAL_CACHE_STORAGE_ADAPTER:-}
  RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_ENABLED: ${RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_ENABLED:-true}
  RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_LEASE: ${RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_LEASE:-72h}
  RIVERHOG_RETRIEVAL_DEFAULT_LEASE: ${RIVERHOG_RETRIEVAL_DEFAULT_LEASE:-24h}
  RIVERHOG_RETRIEVAL_MAX_LEASE: ${RIVERHOG_RETRIEVAL_MAX_LEASE:-7d}
  RIVERHOG_RETRIEVAL_PENDING_TIMEOUT: ${RIVERHOG_RETRIEVAL_PENDING_TIMEOUT:-72h}
  RIVERHOG_RETRIEVAL_CACHE_SWEEP_INTERVAL: ${RIVERHOG_RETRIEVAL_CACHE_SWEEP_INTERVAL:-5m}
  RIVERHOG_RETRIEVAL_RESTORE_POLL_INTERVAL: ${RIVERHOG_RETRIEVAL_RESTORE_POLL_INTERVAL:-5m}
  RIVERHOG_RETRIEVAL_REQUEST_CONCURRENCY: ${RIVERHOG_RETRIEVAL_REQUEST_CONCURRENCY:-8}
  RIVERHOG_RETRIEVAL_MAX_INFLIGHT_BYTES: ${RIVERHOG_RETRIEVAL_MAX_INFLIGHT_BYTES:-1GiB}
  RIVERHOG_RETRIEVAL_READ_CHUNK_BYTES: ${RIVERHOG_RETRIEVAL_READ_CHUNK_BYTES:-8MiB}

  RIVERHOG_EVENT_SOURCE: ${RIVERHOG_EVENT_SOURCE:-urn:riverhog}
  RIVERHOG_EVENT_CONTEXT_RETENTION: ${RIVERHOG_EVENT_CONTEXT_RETENTION:-30d}
  RIVERHOG_OTS_STAMP_COMMAND: ${RIVERHOG_OTS_STAMP_COMMAND:-ots}
  RIVERHOG_OTS_VERIFY_COMMAND: ${RIVERHOG_OTS_VERIFY_COMMAND:-ots --no-bitcoin --no-default-whitelist}
  RIVERHOG_OTS_UPGRADE_COMMAND: ${RIVERHOG_OTS_UPGRADE_COMMAND:-ots}
  RIVERHOG_ATTESTATION_SECRET_KEY_FILE: ${RIVERHOG_ATTESTATION_SECRET_KEY_FILE:-}
  RIVERHOG_ATTESTATION_PUBLIC_KEY_FILE: ${RIVERHOG_ATTESTATION_PUBLIC_KEY_FILE:-}
  RIVERHOG_PROOF_MATURATION_RETRY_DELAY: ${RIVERHOG_PROOF_MATURATION_RETRY_DELAY:-6h}
  RIVERHOG_PROOF_MATURATION_SWEEP_INTERVAL: ${RIVERHOG_PROOF_MATURATION_SWEEP_INTERVAL:-1h}

services:
  garage:
    profiles: ["development"]
    image: dxflrs/garage:b72b090a097c8ee2711c8fb065d250ed68dcd0bf@sha256:f22f09abe741e54ab244e95638310e040b81eda41e2c6ab9b7373cda4b9e955c
    volumes:
      - garage-data:/var/lib/garage
      - ../../tests/harness/garage.toml:/etc/garage.toml:ro

  garage-storage-adapter:
    profiles: ["development"]
    image: riverhog-garage-storage-adapter:dev
    build:
      context: ../..
      dockerfile: riverhog/garage-storage-adapter/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_started
    environment:
      RIVERHOG_GARAGE_STORAGE_ADAPTER_HOST: 0.0.0.0
      RIVERHOG_GARAGE_STORAGE_ADAPTER_PORT: 8080
      RIVERHOG_GARAGE_STORAGE_ADAPTER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ENDPOINT_URL: http://garage:3900
      RIVERHOG_GARAGE_STORAGE_ADAPTER_REGION: garage
      RIVERHOG_GARAGE_STORAGE_ADAPTER_BUCKET: riverhog-archive
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ACCESS_KEY_ID: GK000000000000000000000002
      RIVERHOG_GARAGE_STORAGE_ADAPTER_SECRET_ACCESS_KEY: 2222222222222222222222222222222222222222222222222222222222222222
      RIVERHOG_GARAGE_STORAGE_ADAPTER_PROFILE_ID: riverhog.garage-development/v1
      RIVERHOG_GARAGE_STORAGE_ADAPTER_EGRESS_ACCOUNTING_ID: riverhog-garage-development
      RIVERHOG_GARAGE_STORAGE_ADAPTER_TOKEN_FILE: /run/secrets/riverhog-storage-adapter-token
      RIVERHOG_GARAGE_STORAGE_ADAPTER_STATE_ROOT: /var/lib/riverhog-garage-storage-adapter
    secrets:
      - riverhog-storage-adapter-token
    volumes:
      - garage-storage-adapter-state:/var/lib/riverhog-garage-storage-adapter
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health/ready')); assert payload['status'] == 'ok'",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riverhog}
      POSTGRES_USER: ${POSTGRES_USER:-riverhog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riverhog}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-riverhog}\" -d \"${POSTGRES_DB:-riverhog}\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  state:
    image: riverhog-app:dev
    build:
      context: ../..
      dockerfile: riverhog/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: "no"
    env_file:
      - path: ${RIVERHOG_COMPOSE_ENV_FILE:-../../.env.compose}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment: *riverhog-environment
    command: ["state", "upgrade"]

  app:
    image: riverhog-app:dev
    build:
      context: ../..
      dockerfile: riverhog/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    env_file:
      - path: ${RIVERHOG_COMPOSE_ENV_FILE:-../../.env.compose}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      state:
        condition: service_completed_successfully
    environment: *riverhog-environment
    secrets:
      - riverhog-storage-adapter-token
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready')); assert payload == {'service': 'riverhog', 'status': 'ok'}",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    ports:
      - "${RIVERHOG_API_BIND_ADDR:-127.0.0.1}:${RIVERHOG_API_PORT:-8000}:8000"
  test:
    image: riverhog-test:dev
    build:
      context: ../..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    env_file:
      - path: ${RIVERHOG_COMPOSE_ENV_FILE:-../../.env.compose}
        required: false
    environment:
      <<: *riverhog-environment
      PYTHONPATH: /workspace
    secrets:
      - riverhog-storage-adapter-token
    volumes:
      - ../..:/workspace

volumes:
  garage-data:
  garage-storage-adapter-state:
  postgres-data:

secrets:
  riverhog-storage-adapter-token:
    file: ../../tests/harness/storage-adapter-token
