x-riverhog-environment: &riverhog-environment
  RIVERHOG_BOOTSTRAP_TOKEN: ${RIVERHOG_BOOTSTRAP_TOKEN:-riverhog-development-bootstrap-token}
  RIVERHOG_LOG_LEVEL: ${RIVERHOG_LOG_LEVEL:-INFO}
  RIVERHOG_DATABASE_URL: ${RIVERHOG_DATABASE_URL:-postgresql+psycopg://riverhog:riverhog@postgres:5432/riverhog}
  RIVERHOG_PUBLIC_BASE_URL: ${RIVERHOG_PUBLIC_BASE_URL:-http://app:8000}
  RIVERHOG_S3_MAX_POOL_CONNECTIONS: ${RIVERHOG_S3_MAX_POOL_CONNECTIONS:-32}

  RIVERHOG_INGRESS_ENDPOINT_URL: ${RIVERHOG_INGRESS_ENDPOINT_URL:-http://garage:3900}
  RIVERHOG_INGRESS_REGION: ${RIVERHOG_INGRESS_REGION:-garage}
  RIVERHOG_INGRESS_BUCKET: ${RIVERHOG_INGRESS_BUCKET:-riverhog-ingress}
  RIVERHOG_INGRESS_ACCESS_KEY_ID: ${RIVERHOG_INGRESS_ACCESS_KEY_ID:-GK000000000000000000000002}
  RIVERHOG_INGRESS_SECRET_ACCESS_KEY: ${RIVERHOG_INGRESS_SECRET_ACCESS_KEY:-2222222222222222222222222222222222222222222222222222222222222222}
  RIVERHOG_INGRESS_FORCE_PATH_STYLE: ${RIVERHOG_INGRESS_FORCE_PATH_STYLE:-true}
  RIVERHOG_INGRESS_PREFIX: ${RIVERHOG_INGRESS_PREFIX-}
  RIVERHOG_INGRESS_SECRET_KEY: ${RIVERHOG_INGRESS_SECRET_KEY:-riverhog-development-ingress-secret-key}
  RIVERHOG_INGRESS_CLEANUP_CONCURRENCY: ${RIVERHOG_INGRESS_CLEANUP_CONCURRENCY:-8}
  RIVERHOG_INGRESS_CLEANUP_RETRY_DELAY: ${RIVERHOG_INGRESS_CLEANUP_RETRY_DELAY:-5m}
  RIVERHOG_INGRESS_CLEANUP_SWEEP_INTERVAL: ${RIVERHOG_INGRESS_CLEANUP_SWEEP_INTERVAL:-10s}

  RIVERHOG_ARCHIVE_STORES: ${RIVERHOG_ARCHIVE_STORES:-archive}
  RIVERHOG_ARCHIVE_WRITE_STORE: ${RIVERHOG_ARCHIVE_WRITE_STORE:-archive}
  RIVERHOG_ARCHIVE_READ_ORDER: ${RIVERHOG_ARCHIVE_READ_ORDER:-archive}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_ENDPOINT_URL: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_ENDPOINT_URL:-http://garage:3900}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_REGION: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_REGION:-garage}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_BUCKET: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_BUCKET:-riverhog-archive}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_ACCESS_KEY_ID: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_ACCESS_KEY_ID:-GK000000000000000000000002}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_SECRET_ACCESS_KEY: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_SECRET_ACCESS_KEY:-2222222222222222222222222222222222222222222222222222222222222222}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_FORCE_PATH_STYLE: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_FORCE_PATH_STYLE:-true}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_PREFIX: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_PREFIX-}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_BACKEND: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_BACKEND:-s3}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_STORAGE_CLASS: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_STORAGE_CLASS:-STANDARD}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_READ_MODE: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_READ_MODE:-immediate}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_CLOUDFRONT_BASE_URL: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_CLOUDFRONT_BASE_URL:-}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_CLOUDFRONT_PUBLIC_KEY_ID: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_CLOUDFRONT_PUBLIC_KEY_ID:-}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_CLOUDFRONT_PRIVATE_KEY_PATH: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_CLOUDFRONT_PRIVATE_KEY_PATH:-}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_MONTHLY_DOWNLOAD_ALLOWANCE_BYTES: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_MONTHLY_DOWNLOAD_ALLOWANCE_BYTES:-}
  RIVERHOG_ARCHIVE_STORE_ARCHIVE_DOWNLOAD_SAFETY_BUFFER_BYTES: ${RIVERHOG_ARCHIVE_STORE_ARCHIVE_DOWNLOAD_SAFETY_BUFFER_BYTES:-0B}
  RIVERHOG_ARCHIVE_MULTIPART_PART_BYTES: ${RIVERHOG_ARCHIVE_MULTIPART_PART_BYTES:-64MiB}
  RIVERHOG_ARCHIVE_MULTIPART_CONCURRENCY: ${RIVERHOG_ARCHIVE_MULTIPART_CONCURRENCY:-4}
  RIVERHOG_ARCHIVE_MULTIPART_MAX_AGE: ${RIVERHOG_ARCHIVE_MULTIPART_MAX_AGE:-72h}
  RIVERHOG_ARCHIVE_MULTIPART_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_MULTIPART_SWEEP_INTERVAL:-6h}
  RIVERHOG_ARCHIVE_OBJECT_CONCURRENCY: ${RIVERHOG_ARCHIVE_OBJECT_CONCURRENCY:-4}
  RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE: ${RIVERHOG_ARCHIVE_REQUIRE_EXPLICIT_PASSPHRASE:-false}
  RIVERHOG_ARCHIVE_PASSPHRASE: ${RIVERHOG_ARCHIVE_PASSPHRASE:-}
  RIVERHOG_ARCHIVE_SCRYPT_WORK_FACTOR: ${RIVERHOG_ARCHIVE_SCRYPT_WORK_FACTOR:-18}
  RIVERHOG_ARCHIVE_UPLOAD_RETRY_DELAY: ${RIVERHOG_ARCHIVE_UPLOAD_RETRY_DELAY:-5m}
  RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL: ${RIVERHOG_ARCHIVE_UPLOAD_SWEEP_INTERVAL:-30s}

  RIVERHOG_RETRIEVAL_CACHE_ENDPOINT_URL: ${RIVERHOG_RETRIEVAL_CACHE_ENDPOINT_URL:-}
  RIVERHOG_RETRIEVAL_CACHE_REGION: ${RIVERHOG_RETRIEVAL_CACHE_REGION:-}
  RIVERHOG_RETRIEVAL_CACHE_BUCKET: ${RIVERHOG_RETRIEVAL_CACHE_BUCKET:-}
  RIVERHOG_RETRIEVAL_CACHE_ACCESS_KEY_ID: ${RIVERHOG_RETRIEVAL_CACHE_ACCESS_KEY_ID:-}
  RIVERHOG_RETRIEVAL_CACHE_SECRET_ACCESS_KEY: ${RIVERHOG_RETRIEVAL_CACHE_SECRET_ACCESS_KEY:-}
  RIVERHOG_RETRIEVAL_CACHE_FORCE_PATH_STYLE: ${RIVERHOG_RETRIEVAL_CACHE_FORCE_PATH_STYLE:-false}
  RIVERHOG_RETRIEVAL_CACHE_PREFIX: ${RIVERHOG_RETRIEVAL_CACHE_PREFIX-}
  RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_LEASE: ${RIVERHOG_RETRIEVAL_CACHE_NEW_ARCHIVE_LEASE:-30d}
  RIVERHOG_RETRIEVAL_DEFAULT_LEASE: ${RIVERHOG_RETRIEVAL_DEFAULT_LEASE:-7d}
  RIVERHOG_RETRIEVAL_MAX_LEASE: ${RIVERHOG_RETRIEVAL_MAX_LEASE:-30d}
  RIVERHOG_RETRIEVAL_CACHE_SWEEP_INTERVAL: ${RIVERHOG_RETRIEVAL_CACHE_SWEEP_INTERVAL:-1h}
  RIVERHOG_RETRIEVAL_SWEEP_INTERVAL: ${RIVERHOG_RETRIEVAL_SWEEP_INTERVAL:-30s}
  RIVERHOG_RETRIEVAL_ESTIMATED_LATENCY: ${RIVERHOG_RETRIEVAL_ESTIMATED_LATENCY:-48h}
  RIVERHOG_RETRIEVAL_TIER: ${RIVERHOG_RETRIEVAL_TIER:-bulk}

  RIVERHOG_TUSD_BASE_URL: ${RIVERHOG_TUSD_BASE_URL:-http://tusd:1080/files}
  RIVERHOG_TUSD_PUBLIC_BASE_URL: ${RIVERHOG_TUSD_PUBLIC_BASE_URL:-}
  RIVERHOG_TUSD_HOOK_SECRET: ${RIVERHOG_TUSD_HOOK_SECRET:-dev-tusd-hook-secret}
  RIVERHOG_TUSD_APPEND_TIMEOUT: ${RIVERHOG_TUSD_APPEND_TIMEOUT:-60s}
  RIVERHOG_UPLOAD_FILE_TTL: ${RIVERHOG_UPLOAD_FILE_TTL:-24h}
  RIVERHOG_UPLOAD_SESSION_IDLE_TTL: ${RIVERHOG_UPLOAD_SESSION_IDLE_TTL:-168h}
  RIVERHOG_UPLOAD_EXPIRY_SWEEP_INTERVAL: ${RIVERHOG_UPLOAD_EXPIRY_SWEEP_INTERVAL:-30s}

  RIVERHOG_EVENT_SOURCE: ${RIVERHOG_EVENT_SOURCE:-urn:riverhog}
  RIVERHOG_EVENT_CONTEXT_RETENTION: ${RIVERHOG_EVENT_CONTEXT_RETENTION:-30d}
  RIVERHOG_OTS_STAMP_COMMAND: ${RIVERHOG_OTS_STAMP_COMMAND:-ots}
  RIVERHOG_OTS_VERIFY_COMMAND: ${RIVERHOG_OTS_VERIFY_COMMAND:-ots --no-bitcoin --no-default-whitelist}
  RIVERHOG_OTS_UPGRADE_COMMAND: ${RIVERHOG_OTS_UPGRADE_COMMAND:-ots}
  RIVERHOG_ATTESTATION_SECRET_KEY_FILE: ${RIVERHOG_ATTESTATION_SECRET_KEY_FILE:-}
  RIVERHOG_ATTESTATION_PUBLIC_KEY_FILE: ${RIVERHOG_ATTESTATION_PUBLIC_KEY_FILE:-}
  RIVERHOG_PROOF_MATURATION_RETRY_DELAY: ${RIVERHOG_PROOF_MATURATION_RETRY_DELAY:-6h}
  RIVERHOG_PROOF_MATURATION_SWEEP_INTERVAL: ${RIVERHOG_PROOF_MATURATION_SWEEP_INTERVAL:-1h}

services:
  garage:
    image: dxflrs/garage:b72b090a097c8ee2711c8fb065d250ed68dcd0bf
    volumes:
      - garage-data:/var/lib/garage
      - ../../tests/harness/garage.toml:/etc/garage.toml:ro

  tusd:
    image: tusproject/tusd:v2.8.0
    command:
      - "-host"
      - "0.0.0.0"
      - "-port"
      - "1080"
      - "-base-path"
      - "/files/"
      - "-behind-proxy"
      - "-network-timeout"
      - "${RIVERHOG_TUSD_NETWORK_TIMEOUT:-10m}"
      - "-s3-part-size"
      - "${RIVERHOG_UPLOAD_CHUNK_BYTES:-52428800}"
      - "-s3-bucket"
      - "${RIVERHOG_INGRESS_BUCKET:-riverhog-ingress}"
      - "-s3-endpoint"
      - "${RIVERHOG_INGRESS_ENDPOINT_URL:-http://garage:3900}"
      - "-s3-object-prefix"
      - "${RIVERHOG_INGRESS_PREFIX-}"
      - "-hooks-http"
      - "http://app:8000/internal/tusd/hooks"
      - "-hooks-http-forward-headers"
      - "X-Riverhog-Tusd-Hook-Secret,Authorization"
      - "-hooks-enabled-events"
      - "pre-create,post-finish"
    environment:
      AWS_ACCESS_KEY_ID: ${RIVERHOG_INGRESS_ACCESS_KEY_ID:-GK000000000000000000000002}
      AWS_SECRET_ACCESS_KEY: ${RIVERHOG_INGRESS_SECRET_ACCESS_KEY:-2222222222222222222222222222222222222222222222222222222222222222}
      AWS_REGION: ${RIVERHOG_INGRESS_REGION:-garage}
      AWS_S3_FORCE_PATH_STYLE: ${RIVERHOG_INGRESS_FORCE_PATH_STYLE:-true}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riverhog}
      POSTGRES_USER: ${POSTGRES_USER:-riverhog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riverhog}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-riverhog}\" -d \"${POSTGRES_DB:-riverhog}\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  state:
    image: riverhog-app:dev
    build:
      context: ../..
      dockerfile: riverhog/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: "no"
    env_file:
      - path: ${RIVERHOG_COMPOSE_ENV_FILE:-../../.env.compose}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment: *riverhog-environment
    command: ["state", "upgrade"]

  app:
    image: riverhog-app:dev
    build:
      context: ../..
      dockerfile: riverhog/server/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    env_file:
      - path: ${RIVERHOG_COMPOSE_ENV_FILE:-../../.env.compose}
        required: false
    depends_on:
      garage:
        condition: service_started
      tusd:
        condition: service_started
      postgres:
        condition: service_healthy
      state:
        condition: service_completed_successfully
    environment: *riverhog-environment
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready')); assert payload == {'service': 'riverhog', 'status': 'ok'}",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    ports:
      - "${RIVERHOG_API_BIND_ADDR:-127.0.0.1}:${RIVERHOG_API_PORT:-8000}:8000"
  test:
    image: riverhog-test:dev
    build:
      context: ../..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    env_file:
      - path: ${RIVERHOG_COMPOSE_ENV_FILE:-../../.env.compose}
        required: false
    environment:
      <<: *riverhog-environment
      PYTHONPATH: /workspace
    volumes:
      - ../..:/workspace

volumes:
  garage-data:
  postgres-data:
