[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "gogurt"
version = "0.1.0"
description = "Mounted-volume marker actions for macOS operators."
requires-python = ">=3.12"
dependencies = [
  "cli-support",
  "config-validation",
  "typer>=0.12,<1.0",
]

[project.scripts]
gogurt = "gogurt.cli:main"

[tool.uv.sources]
cli-support = { workspace = true }
config-validation = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/gogurt"]

[tool.hatch.build.targets.wheel.force-include]
"macos/io.github.nashspence.gogurt.plist" = "gogurt/macos/io.github.nashspence.gogurt.plist"
"macos/gogurt.swift" = "gogurt/macos/gogurt.swift"

