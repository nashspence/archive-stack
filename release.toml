schema = "riverhog-release/v1"
series = "v1"
release_branch = "release/v1"
tag_template = "v{version}"
version_policy = "coordinated"
python_distribution_channel = "github-release"
source_url = "https://github.com/nashspence/riverhog"
documentation_url = "https://nashspence.github.io/riverhog/v1/"

[governance]
repository = "nashspence/riverhog"
maintainer = "nashspence"
workflow_source_branch = "main"
required_check_integration_id = 15368
required_checks = [
  "Analyze (actions)",
  "Analyze (python)",
  "build mango-fish",
  "build riverhog",
  "build riverhog-ftp-adapter",
  "build stove0",
  "build stove0-extensions",
  "build stove0-nvenc-extension",
  "build test",
  "client platform (macos-15)",
  "client platform (ubuntu-24.04)",
  "client platform (windows-2025)",
  "make c2sp-vectors",
  "make compile",
  "make compose-smoke",
  "make dist-smoke",
  "make lint",
  "make postgres-concurrency",
  "make spec",
  "make unit",
]

[governance.main]
delivery = "authorized direct fast-forward push followed by exact-SHA GitHub check validation"
protection = "An active no-bypass ruleset requires linear history and rejects force-push and deletion; it has no pull-request or pre-push status gate."

[governance.release]
delivery = "Pull requests into release/v1 with every required check passing against the current head."
required_approvals = 0
review_policy = "The sole maintainer must inspect the diff and check result; add approval requirements when another maintainer can provide meaningful review."
contents = "Stabilization and deliberate v1 backports only; main remains the development line."
selection = "Backport only fixes needed for supported v1 security, archive recovery, data integrity, or documented v1 behavior."
provenance = "Prefer git cherry-pick -x from main; otherwise record the originating commit or issue in the pull request."
conflicts = "Resolve for the current v1 design, rerun every required check, and never preserve retired behavior solely to simplify a backport."
return_to_main = "Fix on main first when affected; if an emergency release fix lands first, forward-port it to main before publication completes."
support = "Maintain eligible v1 fixes until v2.0.0, then critical security, archive-recovery, and data-integrity fixes for twelve months."

[governance.tags]
release_candidate = "v{version}-rc.{candidate}"
final = "v{version}"
immutability = "Published v1 tags are never moved or deleted."
github_releases = "GitHub immutable releases must remain enabled before any v1 publication."
failed_publication = "Resume only for the same tag and source SHA when safe; otherwise publish the next release candidate or patch version."

[governance.authority]
branches = "The Riverhog release maintainer creates release branches after their tracker gate is clean."
tags = "The Riverhog release maintainer alone creates release-candidate and final tags."
github_releases = "The Riverhog release maintainer approves the protected release-publication environment."
registries = "The Riverhog release maintainer approves the protected release-publication environment."
pages = "The Riverhog release maintainer approves the protected github-pages environment."
provider_qualification = "The Riverhog release maintainer approves AWS infrastructure reconciliation; B2 provisioning is manual and read-only conformance checks plus restartable runtime polling are unattended."

[governance.environments]
release = "release-publication"
pages = "github-pages"
provider_qualification_provisioning = "provider-qualification-provisioning"
provider_qualification_runtime = "provider-qualification"

[compatibility]
components = "A supported deployment runs components from one coordinated product version."
http_api = "Published v1 HTTP and CloudEvents contracts remain backward compatible throughout v1."
cli = "Command names, options, exit status, and structured output remain backward compatible throughout v1; prose output is for people."
archive = "A valid v1 archive remains independently recoverable throughout the supported v1 lifetime. Pack construction, ingress checkpointing, and multipart transfer strategies are not archive-format compatibility promises."
recovery = "Every later v1 recovery release reads every valid earlier v1 archive and provenance set."
configuration = "Accepted v1 configuration remains valid throughout v1 unless an unsafe value must be rejected."
persistent_state = "State upgrades are forward-only; every later v1 schema restores and upgrades every earlier v1 state fixture."

[artifacts]
python_formats = ["wheel", "sdist"]
documentation = "riverhog-docs-v{version}.tar.gz"
source = "riverhog-source-v{version}.tar.gz"
evidence = [
  "install-manifest.json",
  "release-manifest.json",
  "SHA256SUMS",
  "SHA256SUMS.minisig",
  "release.spdx.json",
  "release.intoto.jsonl",
  "THIRD_PARTY_NOTICES.md",
]

[artifacts.notices]
schema = "riverhog-artifact-notices/v1"
directory = "notices"
format = "tar.gz"
basis = "exact-artifact-contents"
required_for = ["wheel", "image"]

[installation]
method = "uv-tool"
lock_format = "pylock.toml"
managed_python = true
wheel_only = true
simple_index_path = "artifacts/v{version}/simple/"

[installation.listener]
root = "gogurt"
scope = "current-user"
resume = "next-login"
autorun = "explicit-required"
service_managers = ["systemd-user", "launchd-user", "task-scheduler-user"]

[signing]
checksums = "SHA-256"
signature = "minisign"
key_owner = "The Riverhog release maintainer owns the offline release-signing key."
secret_key = "The secret key remains outside the repository, GitHub, CI logs, and release artifacts."
public_key = "The public key is distributed in the v1 documentation and every GitHub release."
rotation = "Generate a new offline key and publish a transition signed by both old and new keys."
compromise = "Stop publication, disclose and revoke affected evidence, and issue a new patch release without moving an existing tag."
github_oidc = "Published GitHub artifacts also receive workflow identity attestations; they complement rather than replace the maintainer signature."

[python]
end_user_artifact = [
  "companions/stove0/client",
  "riverhog/client",
  "riverhog/recovery",
  "utilities/gogurt",
]
deployed_implementation = [
  "companions/stove0/server",
  "companions/stove0/extensions",
  "riverhog/ftp-adapter",
  "riverhog/server",
  "utilities/mango-fish",
]
reusable_library = [
  "packages/file-download",
  "packages/lifecycle-events",
  "packages/riverhog-age",
  "packages/riverhog-ftp-adapter-api-client",
  "packages/riverhog-api-client",
  "packages/riverhog-protocol",
  "packages/riverhog-provenance",
  "packages/riverhog-transform-sdk",
  "packages/stove0-observer-protocol",
  "packages/stove0-observer-support",
  "packages/stove0-media-contracts",
  "packages/stove0-api-client",
  "packages/stove0-protocol",
  "packages/stove0-review-contracts",
  "packages/stove0-target-protocol",
  "packages/stove0-target-support",
]
internal_build_unit = [
  "packages/application-access",
  "packages/config-validation",
  "packages/http-api-contracts",
  "packages/riverhog-cli-support",
  "packages/state-schema",
  "packages/time-formats",
]
test_only_artifact = []

[platforms]
end_user_artifacts = ["linux-x64", "macos-arm64", "windows-x64"]
deployed_implementations = ["linux/amd64"]

[images]
platforms = ["linux/amd64"]

[images.runtime]
riverhog = { distribution = "riverhog-server", repository = "ghcr.io/nashspence/riverhog" }
mango-fish = { distribution = "mango-fish", repository = "ghcr.io/nashspence/riverhog-mango-fish" }
riverhog-ftp-adapter = { distribution = "riverhog-ftp-adapter", repository = "ghcr.io/nashspence/riverhog-ftp-adapter" }
stove0 = { distribution = "stove0-server", repository = "ghcr.io/nashspence/riverhog-stove0" }
stove0-extensions = { distribution = "stove0-maintained-extensions", repository = "ghcr.io/nashspence/riverhog-stove0-extensions" }
stove0-nvenc-extension = { distribution = "stove0-maintained-extensions", repository = "ghcr.io/nashspence/riverhog-stove0-nvenc-extension" }

[images.test_only]
test = { local_tag = "riverhog-test:dev" }
