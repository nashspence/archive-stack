schema = "riverhog-release/v1"
series = "v1"
release_branch = "release/v1"
tag_template = "v{version}"
version_policy = "coordinated"
python_distribution_channel = "github-release"
source_url = "https://github.com/nashspence/riverhog"
documentation_url = "https://nashspence.github.io/riverhog/v1/"

[governance]
repository = "nashspence/riverhog"
maintainer = "nashspence"
workflow_source_branch = "main"
branch_delivery = "pre-v1-lockstep"
required_check_integration_id = 15368
required_checks = [
  "Analyze (actions)",
  "Analyze (python)",
  "build mango-fish",
  "build riverhog",
  "build riverhog-ftp-adapter",
  "build riverhog-storage-adapter-aws",
  "build riverhog-storage-adapter-backblaze",
  "build stove0",
  "build stove0-exiftool-observer",
  "build stove0-ffprobe-sampling-observer",
  "build stove0-nvenc-av1-opus-target",
  "build stove0-opus-target",
  "build stove0-review-materialize-target",
  "build stove0-review-rclone-effect-target",
  "build test",
  "client platform (macos-15)",
  "client platform (ubuntu-24.04)",
  "client platform (windows-2025)",
  "make c2sp-vectors",
  "make compile",
  "make compose-smoke",
  "make dist-smoke",
  "make lint",
  "make postgres-concurrency",
  "make spec",
  "make unit",
]

[governance.main]
delivery = "Fast-forward only to the exact commit accepted by protected release/v1, followed by exact-SHA GitHub check validation."
protection = "An active no-bypass ruleset requires linear history and rejects force-push and deletion; it has no pull-request or pre-push status gate."

[governance.release]
delivery = "Pull requests into release/v1 with every required check passing against the current head; the accepted commit is then fast-forwarded unchanged to main."
required_approvals = 0
review_policy = "The sole maintainer must inspect the diff and check result; add approval requirements when another maintainer can provide meaningful review."
contents = "Current pre-v1 stabilization and release corrections; main and release/v1 remain commit-identical."
synchronization = "Provider qualification stays disabled between release/v1 acceptance and the immediate fast-forward of main to the same commit."

[governance.tags]
release_candidate = "v{version}-rc.{candidate}"
final = "v{version}"
immutability = "Published v1 tags are never moved or deleted."
github_releases = "GitHub immutable releases must remain enabled before any v1 publication."
failed_publication = "Resume only for the same tag and source SHA when safe; otherwise publish the next release candidate or patch version."

[governance.authority]
branches = "The Riverhog release maintainer creates release branches after their tracker gate is clean."
tags = "The Riverhog release maintainer alone creates release-candidate and final tags."
github_releases = "The Riverhog release maintainer approves the protected release-publication environment."
registries = "The Riverhog release maintainer approves the protected release-publication environment."
pages = "The Riverhog release maintainer approves the protected github-pages environment."
provider_qualification = "The Riverhog release maintainer approves AWS infrastructure reconciliation; B2 provisioning is manual and read-only conformance checks plus restartable runtime polling are unattended."

[governance.environments]
release = "release-publication"
pages = "github-pages"
provider_qualification_provisioning = "provider-qualification-provisioning"
provider_qualification_runtime = "provider-qualification"

[compatibility]
components = "A supported deployment runs components from one coordinated product version."
http_api = "Published v1 HTTP and CloudEvents contracts remain backward compatible throughout v1."
cli = "Command names, options, exit status, and structured output remain backward compatible throughout v1; prose output is for people."
archive = "A valid v1 archive remains independently recoverable throughout the supported v1 lifetime. Pack construction, ingress checkpointing, and resumable-write strategies are not archive-format compatibility promises."
recovery = "Every later v1 recovery release reads every valid earlier v1 archive and provenance set."
configuration = "Accepted v1 configuration remains valid throughout v1 unless an unsafe value must be rejected."
persistent_state = "State upgrades are forward-only; every later v1 schema restores and upgrades every earlier v1 state fixture."

[artifacts]
python_formats = ["wheel", "sdist"]
documentation = "riverhog-docs-v{version}.tar.gz"
source = "riverhog-source-v{version}.tar.gz"
evidence = [
  "install-manifest.json",
  "release-manifest.json",
  "SHA256SUMS",
  "SHA256SUMS.minisig",
  "release.spdx.json",
  "release.intoto.jsonl",
  "THIRD_PARTY_NOTICES.md",
]

[artifacts.notices]
schema = "riverhog-artifact-notices/v1"
directory = "notices"
format = "tar.gz"
basis = "exact-artifact-contents"
required_for = ["wheel", "image"]

[installation]
method = "uv-tool"
lock_format = "pylock.toml"
managed_python = true
wheel_only = true
simple_index_path = "artifacts/v{version}/simple/"

[installation.listener]
root = "gogurt"
scope = "current-user"
resume = "next-login"
autorun = "explicit-required"
provider_selection = "explicit"
provider_identity = "persisted-exactly"

[qualification.gogurt_reference]
purpose = "First-party reference conformance only; these selections are not defaults or recommendations."
linux-x64 = { mounted_volume_distribution = "gogurt-linux-mounted-volume", mounted_volume_provider = "gogurt-linux-mounted-volume", listener_host_distribution = "gogurt-linux-listener-host", listener_host_provider = "gogurt-linux-listener-host" }
macos-arm64 = { mounted_volume_distribution = "gogurt-macos-mounted-volume", mounted_volume_provider = "gogurt-macos-mounted-volume", listener_host_distribution = "gogurt-macos-listener-host", listener_host_provider = "gogurt-macos-listener-host" }
windows-x64 = { mounted_volume_distribution = "gogurt-windows-mounted-volume", mounted_volume_provider = "gogurt-windows-mounted-volume", listener_host_distribution = "gogurt-windows-listener-host", listener_host_provider = "gogurt-windows-listener-host" }

[qualification.storage_reference]
purpose = "Selected reference qualification only; these cases are neither defaults nor recommendations and are not a support matrix."
distributions = ["riverhog-storage-adapter-aws", "riverhog-storage-adapter-backblaze"]
cases = ["b2-archive", "b2-retrieval-cache", "aws-deep-archive", "aws-cloudfront-egress"]

[references]
policy = "New mechanisms are independently owned and published. First-party reference components are a finite, maintainer-selected, optional, nonnormative conformance set; their inventory is neither complete nor recommended and is not an expansion target or support matrix."

[signing]
checksums = "SHA-256"
signature = "minisign"
key_owner = "The Riverhog release maintainer owns the offline release-signing key."
secret_key = "The secret key remains outside the repository, GitHub, CI logs, and release artifacts."
public_key = "The public key is distributed in the v1 documentation and every GitHub release."
rotation = "Generate a new offline key and publish a transition signed by both old and new keys."
compromise = "Stop publication, disclose and revoke affected evidence, and issue a new patch release without moving an existing tag."
github_oidc = "Published GitHub artifacts also receive workflow identity attestations; they complement rather than replace the maintainer signature."

[python]
end_user_artifact = [
  "companions/stove0/client",
  "riverhog/client",
  "riverhog/recovery",
  "utilities/gogurt",
]
deployed_implementation = [
  "companions/stove0/server",
  "riverhog/server",
  "utilities/mango-fish",
]
reference_component = [
  "reference/gogurt/listener-host/linux",
  "reference/gogurt/listener-host/macos",
  "reference/gogurt/listener-host/windows",
  "reference/gogurt/mounted-volume/linux",
  "reference/gogurt/mounted-volume/macos",
  "reference/gogurt/mounted-volume/path-support",
  "reference/gogurt/mounted-volume/windows",
  "reference/riverhog/ingress/ftp",
  "reference/riverhog/ingress/ftp-api-client",
  "reference/riverhog/provenance/contracts/linux",
  "reference/riverhog/provenance/contracts/macos",
  "reference/riverhog/provenance/contracts/windows",
  "reference/riverhog/provenance/observers/linux",
  "reference/riverhog/provenance/observers/macos",
  "reference/riverhog/provenance/observers/windows",
  "reference/riverhog/storage/aws",
  "reference/riverhog/storage/backblaze",
  "reference/riverhog/storage/s3-support",
  "reference/stove0/observers/contracts/media-metadata",
  "reference/stove0/observers/contracts/media-sampling",
  "reference/stove0/observers/exiftool",
  "reference/stove0/observers/ffprobe-sampling",
  "reference/stove0/targets/media-archive/contracts",
  "reference/stove0/targets/media-archive/support",
  "reference/stove0/targets/nvenc-av1-opus/review-sampler",
  "reference/stove0/targets/nvenc-av1-opus/target",
  "reference/stove0/targets/opus/review-sampler",
  "reference/stove0/targets/opus/target",
  "reference/stove0/targets/review/contracts",
  "reference/stove0/targets/review/planning",
  "reference/stove0/targets/review/sampler/client",
  "reference/stove0/targets/review/sampler/protocol",
  "reference/stove0/targets/review/sampler/support",
  "reference/stove0/targets/review/materialize-target",
  "reference/stove0/targets/review/rclone-effect-target",
  "reference/stove0/targets/review/support",
]
reusable_library = [
  "packages/gogurt-core",
  "packages/gogurt-listener-runtime",
  "packages/application-access",
  "packages/file-download",
  "packages/http-api-contracts",
  "packages/lifecycle-events",
  "packages/riverhog-age",
  "packages/riverhog-archive-contracts",
  "packages/riverhog-api-client",
  "packages/riverhog-protocol",
  "packages/riverhog-provenance",
  "packages/riverhog-provenance-contracts",
  "packages/riverhog-storage-adapter-asgi-support",
  "packages/riverhog-storage-adapter-protocol",
  "packages/riverhog-storage-adapter-support",
  "packages/riverhog-transform-sdk",
  "packages/stove0-observer-protocol",
  "packages/stove0-observer-support",
  "packages/stove0-observer-client",
  "packages/stove0-api-client",
  "packages/stove0-operator-contracts",
  "packages/stove0-protocol",
  "packages/stove0-recipe-config",
  "packages/stove0-target-client",
  "packages/stove0-target-protocol",
  "packages/stove0-target-support",
]
internal_build_unit = [
  "packages/config-validation",
  "packages/riverhog-cli-support",
  "packages/state-schema",
  "packages/time-formats",
]
test_only_artifact = []

[platforms]
end_user_artifacts = ["linux-x64", "macos-arm64", "windows-x64"]
runtime_images = ["linux/amd64"]

[images]
platforms = ["linux/amd64"]

[images.runtime]
riverhog = { role = "product", description = "Riverhog archive service.", distributions = ["riverhog-server"], repository = "ghcr.io/nashspence/riverhog" }
mango-fish = { role = "product", description = "Riverhog CloudEvents utility.", distributions = ["mango-fish"], repository = "ghcr.io/nashspence/riverhog-mango-fish" }
riverhog-ftp-adapter = { role = "reference", description = "Optional nonnormative Riverhog FTP ingress reference.", distributions = ["riverhog-ftp-adapter", "riverhog-provenance-linux-observer"], repository = "ghcr.io/nashspence/riverhog-ftp-adapter" }
riverhog-storage-adapter-aws = { role = "reference", description = "Optional nonnormative AWS storage reference for Riverhog.", distributions = ["riverhog-storage-adapter-aws"], repository = "ghcr.io/nashspence/riverhog-storage-adapter-aws" }
riverhog-storage-adapter-backblaze = { role = "reference", description = "Optional nonnormative Backblaze B2 storage reference for Riverhog.", distributions = ["riverhog-storage-adapter-backblaze"], repository = "ghcr.io/nashspence/riverhog-storage-adapter-backblaze" }
stove0 = { role = "product", description = "Stove0 transformation companion.", distributions = ["stove0-server"], repository = "ghcr.io/nashspence/riverhog-stove0" }
stove0-exiftool-observer = { role = "reference", description = "Optional nonnormative ExifTool observer reference for Stove0.", distributions = ["stove0-exiftool-observer"], repository = "ghcr.io/nashspence/riverhog-stove0-exiftool-observer" }
stove0-ffprobe-sampling-observer = { role = "reference", description = "Optional nonnormative FFprobe sampling-observer reference for Stove0.", distributions = ["stove0-ffprobe-sampling-observer"], repository = "ghcr.io/nashspence/riverhog-stove0-ffprobe-sampling-observer" }
stove0-nvenc-av1-opus-target = { role = "reference", description = "Optional nonnormative NVENC AV1 and Opus target reference for Stove0.", distributions = ["stove0-nvenc-av1-opus-target", "stove0-nvenc-av1-opus-review-sampler"], repository = "ghcr.io/nashspence/riverhog-stove0-nvenc-av1-opus-target" }
stove0-opus-target = { role = "reference", description = "Optional nonnormative Opus target reference for Stove0.", distributions = ["stove0-opus-target", "stove0-opus-review-sampler"], repository = "ghcr.io/nashspence/riverhog-stove0-opus-target" }
stove0-review-materialize-target = { role = "reference", description = "Optional nonnormative review materialization target reference for Stove0.", distributions = ["stove0-review-materialize-target"], repository = "ghcr.io/nashspence/riverhog-stove0-review-materialize-target" }
stove0-review-rclone-effect-target = { role = "reference", description = "Optional nonnormative rclone review-effect target reference for Stove0.", distributions = ["stove0-review-rclone-effect-target"], repository = "ghcr.io/nashspence/riverhog-stove0-review-rclone-effect-target" }

[images.test_only]
test = { local_tag = "riverhog-test:dev" }
