schema = "riverhog-release/v1"
series = "v1"
release_branch = "release/v1"
tag_template = "v{version}"
version_policy = "coordinated"
python_distribution_channel = "github-release"
source_url = "https://github.com/nashspence/riverhog"
documentation_url = "https://nashspence.github.io/riverhog/v1/"

[compatibility]
components = "A supported deployment runs components from one coordinated product version."
http_api = "Published v1 HTTP and CloudEvents contracts remain backward compatible throughout v1."
cli = "Command names, options, exit status, and structured output remain backward compatible throughout v1; prose output is for people."
archive = "A valid v1 archive remains independently recoverable throughout the supported v1 lifetime."
recovery = "Every later v1 recovery release reads every valid earlier v1 archive and provenance set."
configuration = "Accepted v1 configuration remains valid throughout v1 unless an unsafe value must be rejected."
persistent_state = "State upgrades are forward-only; every later v1 schema restores and upgrades every earlier v1 state fixture."

[artifacts]
python_formats = ["wheel", "sdist"]
documentation = "riverhog-docs-v{version}.tar.gz"
source = "riverhog-source-v{version}.tar.gz"
evidence = [
  "release-manifest.json",
  "SHA256SUMS",
  "SHA256SUMS.minisig",
  "release.spdx.json",
  "release.intoto.jsonl",
  "THIRD_PARTY_NOTICES.md",
]

[python]
end_user_artifact = [
  "companions/jeb/client",
  "companions/munchy/client",
  "riverhog/client",
  "riverhog/recovery",
  "utilities/gogurt",
]
deployed_implementation = [
  "companions/jeb/server",
  "companions/munchy/server",
  "companions/munchy/server/targets/av1-nvenc",
  "riverhog/server",
  "utilities/mango-fish",
]
reusable_library = [
  "packages/file-download",
  "packages/jeb-api-client",
  "packages/jeb-protocol",
  "packages/lifecycle-events",
  "packages/media-preflight",
  "packages/munchy-api-client",
  "packages/munchy-config",
  "packages/munchy-workflows",
  "packages/riverhog-age",
  "packages/riverhog-api-client",
  "packages/riverhog-protocol",
  "packages/riverhog-provenance",
  "packages/tus-transport",
]
internal_build_unit = [
  "packages/application-access",
  "packages/config-validation",
  "packages/http-api-contracts",
  "packages/jeb-cli-support",
  "packages/munchy-target-support",
  "packages/riverhog-cli-support",
  "packages/state-schema",
  "packages/time-formats",
]
test_only_artifact = []

[images.runtime]
riverhog = { distribution = "riverhog-server", repository = "ghcr.io/nashspence/riverhog" }
jeb = { distribution = "jeb-server", repository = "ghcr.io/nashspence/riverhog-jeb" }
mango-fish = { distribution = "mango-fish", repository = "ghcr.io/nashspence/riverhog-mango-fish" }
munchy-server = { distribution = "munchy-server", repository = "ghcr.io/nashspence/riverhog-munchy" }
munchy-av1-nvenc = { distribution = "munchy-av1-nvenc-target", repository = "ghcr.io/nashspence/riverhog-munchy-av1-nvenc" }

[images.test_only]
test = { local_tag = "riverhog-test:dev" }
