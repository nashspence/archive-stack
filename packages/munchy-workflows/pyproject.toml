[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-workflows"
version = "0.1.0"
description = "Shared Munchy workflow authoring and profile behavior."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "config-validation>=0.1,<0.2",
  "munchy-api-client>=0.1,<0.2",
  "munchy-config>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "riverhog-provenance>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "tus-transport>=0.1,<0.2",
]

[tool.uv.sources]
config-validation = { workspace = true }
munchy-api-client = { workspace = true }
munchy-config = { workspace = true }
riverhog-provenance = { workspace = true }
time-formats = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_workflows"]
