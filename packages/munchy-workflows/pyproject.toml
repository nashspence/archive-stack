[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-workflows"
version = "0.1.0"
description = "Shared Munchy workflow authoring and profile behavior."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "config-validation>=0.1,<0.2",
  "munchy-api-client>=0.1,<0.2",
  "munchy-config>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "time-formats>=0.1,<0.2",
  "tus-transport>=0.1,<0.2",
]

[tool.uv.sources]
config-validation = { workspace = true }
munchy-api-client = { workspace = true }
munchy-config = { workspace = true }
time-formats = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_workflows"]
