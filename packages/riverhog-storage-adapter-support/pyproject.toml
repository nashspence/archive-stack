[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-storage-adapter-support"
version = "0.1.0"
description = "Provider-neutral runtime and conformance support for Riverhog storage adapters."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "fastapi>=0.111,<1.0",
  "httpx[http2]>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "riverhog-storage-adapter-protocol>=0.1,<0.2",
]

[project.scripts]
riverhog-storage-adapter-conformance = "riverhog_storage_adapter_support.conformance:main"
riverhog-storage-adapter-schemas = "riverhog_storage_adapter_support.schemas:main"

[tool.uv.sources]
riverhog-storage-adapter-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_storage_adapter_support"]
