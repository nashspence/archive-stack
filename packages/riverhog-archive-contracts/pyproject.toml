[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-archive-contracts"
version = "0.1.0"
description = "Dependency-light immutable Riverhog archive recovery contracts."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_archive_contracts"]

[tool.hatch.build.targets.wheel.shared-data]
"schemas" = "share/riverhog-archive-contracts/schemas"
