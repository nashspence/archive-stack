[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-target-support"
version = "0.1.0"
description = "Shared support for Munchy execution targets and their coordinator."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "munchy-workflows>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "uvicorn[standard]>=0.52.1,<1.0",
]

[tool.uv.sources]
munchy-workflows = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_target_support"]
