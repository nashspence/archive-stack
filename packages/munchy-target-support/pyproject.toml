[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-target-support"
version = "0.1.0"
description = "Shared support for Munchy transform targets and their coordinator."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "httpx>=0.27,<1.0",
  "munchy-workflows>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "rfc8785>=0.1.4,<0.2",
  "time-formats>=0.1,<0.2",
  "uvicorn[standard]>=0.52.0,<1.0",
]

[project.scripts]
munchy-target-conformance = "munchy_target_support.conformance:main"

[tool.uv.sources]
munchy-workflows = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_target_support"]
