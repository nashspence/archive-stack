[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-config"
version = "0.1.0"
description = "Munchy configuration schemas and reusable device-profile expansion."
requires-python = ">=3.12"
dependencies = ["config-validation"]

[tool.uv.sources]
config-validation = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_config"]
