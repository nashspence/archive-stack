[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-config"
version = "0.1.0"
description = "Munchy configuration schemas and reusable device-profile expansion."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["config-validation>=0.1,<0.2"]

[tool.uv.sources]
config-validation = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_config"]
