[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-cli-support"
version = "0.1.0"
description = "Shared structured CLI projection helpers."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "http-api-contracts>=0.1,<0.2",
]

[tool.uv.sources]
http-api-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_cli_support"]
