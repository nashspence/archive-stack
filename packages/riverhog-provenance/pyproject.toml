[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-provenance"
version = "0.1.0"
description = "Portable Riverhog v1 per-file provenance journals and validation."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "jsonschema>=4.23,<5.0",
  "riverhog-provenance-contracts>=0.1,<0.2",
  "riverhog-provenance-linux-contracts>=0.1,<0.2",
  "riverhog-provenance-macos-contracts>=0.1,<0.2",
  "riverhog-provenance-windows-contracts>=0.1,<0.2",
]

[tool.uv.sources]
riverhog-provenance-contracts = { workspace = true }
riverhog-provenance-linux-contracts = { workspace = true }
riverhog-provenance-macos-contracts = { workspace = true }
riverhog-provenance-windows-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_provenance"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "riverhog_provenance/NOTICE"
