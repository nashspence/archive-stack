[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-provenance"
version = "0.1.0"
description = "Riverhog v1 per-file provenance journals and platform observers."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.23,<5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_provenance"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "riverhog_provenance/NOTICE"
