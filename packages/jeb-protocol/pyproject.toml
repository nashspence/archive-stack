[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jeb-protocol"
version = "0.1.0"
description = "Shared contracts for Jeb servers and clients."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/jeb_protocol"]
