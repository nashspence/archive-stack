[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "stove0-target-protocol"
version = "0.1.0"
description = "Dependency-light public contracts for external stove0 targets."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "http-api-contracts>=0.1,<0.2",
  "jsonschema>=4.25,<5.0",
  "pydantic>=2.7,<3.0",
  "riverhog-protocol>=0.1,<0.2",
  "stove0-protocol>=0.1,<0.2",
]

[tool.uv.sources]
http-api-contracts = { workspace = true }
riverhog-protocol = { workspace = true }
stove0-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stove0_target_protocol"]
