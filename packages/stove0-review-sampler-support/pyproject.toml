[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "stove0-review-sampler-support"
version = "0.1.0"
description = "HTTP and workspace support for terminal stove0 review samplers."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "jsonschema>=4.25,<5.0",
  "pydantic>=2.7,<3.0",
  "stove0-review-sampler-client>=0.1,<0.2",
  "stove0-review-sampler-protocol>=0.1,<0.2",
]

[project.scripts]
stove0-review-sampler-conformance = "stove0_review_sampler_support.conformance:main"
stove0-review-sampler-schemas = "stove0_review_sampler_support.schemas:main"

[tool.uv.sources]
stove0-review-sampler-client = { workspace = true }
stove0-review-sampler-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stove0_review_sampler_support"]
