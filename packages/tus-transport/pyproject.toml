[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "tus-transport"
version = "0.1.0"
description = "Persistent HTTP transport for TUS uploads."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "httpx[http2]>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tus_transport"]
