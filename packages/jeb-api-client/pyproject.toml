[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "jeb-api-client"
version = "0.1.0"
description = "Python client for the Jeb API."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "http-api-contracts>=0.1,<0.2",
  "httpx>=0.27,<1.0",
  "jeb-protocol>=0.1,<0.2",
  "lifecycle-events>=0.1,<0.2",
  "riverhog-provenance>=0.1,<0.2",
  "tus-transport>=0.1,<0.2",
]

[tool.uv.sources]
http-api-contracts = { workspace = true }
jeb-protocol = { workspace = true }
lifecycle-events = { workspace = true }
riverhog-provenance = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jeb_api_client"]
