[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jeb-api-client"
version = "0.1.0"
description = "Python client for the Jeb API."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27,<1.0",
  "lifecycle-events>=0.1,<0.2",
]

[tool.uv.sources]
lifecycle-events = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jeb_api_client"]
