[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "jeb-api-client"
version = "0.1.0"
description = "Python client for the Jeb API."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1.0",
  "lifecycle-events",
]

[tool.uv.sources]
lifecycle-events = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jeb_api_client"]
