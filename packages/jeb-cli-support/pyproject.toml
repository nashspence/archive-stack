[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "jeb-cli-support"
version = "0.1.0"
description = "Shared command-line presentation for Jeb."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = ["jeb-protocol>=0.1,<0.2", "riverhog-cli-support>=0.1,<0.2"]

[tool.uv.sources]
jeb-protocol = { workspace = true }
riverhog-cli-support = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jeb_cli_support"]
