[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "jeb-cli-support"
version = "0.1.0"
description = "Shared command-line presentation for Jeb."
requires-python = ">=3.12"
dependencies = ["jeb-protocol>=0.1,<0.2", "riverhog-cli-support>=0.1,<0.2"]

[tool.uv.sources]
jeb-protocol = { workspace = true }
riverhog-cli-support = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jeb_cli_support"]
