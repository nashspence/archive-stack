[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "http-api-contracts"
version = "0.1.0"
description = "Shared typed HTTP error, health, and OpenAPI contracts."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.7,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/http_api_contracts"]
