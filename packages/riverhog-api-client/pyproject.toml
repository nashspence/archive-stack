[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-api-client"
version = "0.1.0"
description = "Typed Riverhog HTTP, retrieval, and direct-ingress client."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "file-download>=0.1,<0.2",
  "http-api-contracts>=0.1,<0.2",
  "httpx[http2]>=0.27,<1.0",
  "lifecycle-events>=0.1,<0.2",
  "riverhog-protocol>=0.1,<0.2",
]

[tool.uv.sources]
file-download = { workspace = true }
http-api-contracts = { workspace = true }
lifecycle-events = { workspace = true }
riverhog-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_api_client"]
