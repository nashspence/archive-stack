[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-api-client"
version = "0.1.0"
description = "Typed Riverhog HTTP, retrieval, and encrypted-ingress client."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "file-download>=0.1,<0.2",
  "h2>=4,<5",
  "httpx>=0.27,<1.0",
  "lifecycle-events>=0.1,<0.2",
  "riverhog-age>=0.1,<0.2",
  "riverhog-protocol>=0.1,<0.2",
  "tus-transport>=0.1,<0.2",
]

[tool.uv.sources]
file-download = { workspace = true }
lifecycle-events = { workspace = true }
riverhog-age = { workspace = true }
riverhog-protocol = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_api_client"]
