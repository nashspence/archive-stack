[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-api-client"
version = "0.1.0"
description = "Typed Riverhog HTTP, retrieval, and direct-ingress client."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "riverhog-application-access>=0.1,<0.2",
  "file-download>=0.1,<0.2",
  "http-api-contracts>=0.1,<0.2",
  "httpx[http2]>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "riverhog-protocol>=0.1,<0.2",
  "riverhog-provenance-contracts>=0.1,<0.2",
]

[tool.uv.sources]
riverhog-application-access = { workspace = true }
file-download = { workspace = true }
http-api-contracts = { workspace = true }
riverhog-protocol = { workspace = true }
riverhog-provenance-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_api_client"]
