[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-provenance-contracts"
version = "0.1.0"
description = "Canonical Riverhog provenance identity and reference contracts."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Riverhog v1 component. See the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "jsonschema>=4.25,<5.0",
  "pydantic>=2.12,<3.0",
  "referencing>=0.37,<0.38",
  "rfc8785>=0.1,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_provenance_contracts"]
