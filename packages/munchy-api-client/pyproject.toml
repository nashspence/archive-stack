[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "munchy-api-client"
version = "0.1.0"
description = "Munchy submission, upload, routing, and provenance client."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "file-download>=0.1,<0.2",
  "h2>=4,<5",
  "http-api-contracts>=0.1,<0.2",
  "httpx>=0.27,<1.0",
  "lifecycle-events>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "tus-transport>=0.1,<0.2",
]

[tool.uv.sources]
file-download = { workspace = true }
http-api-contracts = { workspace = true }
lifecycle-events = { workspace = true }
time-formats = { workspace = true }
tus-transport = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/munchy_api_client"]
